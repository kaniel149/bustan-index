<svg xmlns="http://www.w3.org/2000/svg" width="480" height="711" viewBox="0 0 480 711" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">ความเสี่ยงค่าเงินในราคาเหมาจ่าย</title><desc id="desc">20,000 ดอลลาร์เป็น 700,000 บาทที่อัตรา 35 หรือ 720,000 ที่ 36 ต่างกัน 20,000 บาท</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="378.02" lengthAdjust="spacingAndGlyphs">ความเสี่ยงค่าเงินในราคาเหมาจ่าย</tspan></text><g class="diagram-bar" data-node="0"><text x="28" y="150" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="150" textLength="232.23" lengthAdjust="spacingAndGlyphs">ที่ 35 บาทต่อดอลลาร์</tspan></text><text x="28" y="191" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="191" textLength="337.08" lengthAdjust="spacingAndGlyphs">700000 บาท · อัตราแลกเปลี่ยนสมมติ</tspan></text><rect x="28" y="215" width="424" height="28" rx="3" fill="#dedfce"/><rect x="28" y="215" width="412.22" height="28" rx="3" fill="#24463e"/><text x="28" y="274" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="274" textLength="241.92" lengthAdjust="spacingAndGlyphs">ยอดผู้ขาย 20,000 ดอลลาร์</tspan></text></g><g class="diagram-bar" data-node="1"><text x="28" y="342" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="342" textLength="232.23" lengthAdjust="spacingAndGlyphs">ที่ 36 บาทต่อดอลลาร์</tspan></text><text x="28" y="383" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="383" textLength="337.08" lengthAdjust="spacingAndGlyphs">720000 บาท · อัตราแลกเปลี่ยนสมมติ</tspan></text><rect x="28" y="407" width="424" height="28" rx="3" fill="#dedfce"/><rect x="28" y="407" width="424" height="28" rx="3" fill="#006f6b"/><text x="28" y="466" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="466" textLength="300.51" lengthAdjust="spacingAndGlyphs">ยอดผู้ขายเดิม สมมติค่าเงินต่างกัน</tspan></text></g><g class="diagram-bar" data-node="2"><text x="28" y="534" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="534" textLength="172.38" lengthAdjust="spacingAndGlyphs">เงินเพิ่มที่ต้องใช้</tspan></text><text x="28" y="575" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="575" textLength="325.52" lengthAdjust="spacingAndGlyphs">20000 บาท · อัตราแลกเปลี่ยนสมมติ</tspan></text><rect x="28" y="599" width="424" height="28" rx="3" fill="#dedfce"/><rect x="28" y="599" width="11.78" height="28" rx="3" fill="#24463e"/><text x="28" y="658" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="658" textLength="231.42" lengthAdjust="spacingAndGlyphs">ก่อนค่าธรรมเนียมและภาษี</tspan></text></g></svg>
