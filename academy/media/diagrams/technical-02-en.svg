ection="ltr" unicode-bidi="plaintext"><tspan x="850.67" y="212" textLength="188.87" lengthAdjust="spacingAndGlyphs">Parallel current</tspan></text><text x="850.67" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="850.67" y="258" textLength="251.1" lengthAdjust="spacingAndGlyphs">Branch currents add; verify</tspan><tspan x="850.67" y="289" textLength="186.86" lengthAdjust="spacingAndGlyphs">applicable input and</tspan><tspan x="850.67" y="320" textLength="151.79" lengthAdjust="spacingAndGlyphs">protection limits.</tspan></text></g></svg>
