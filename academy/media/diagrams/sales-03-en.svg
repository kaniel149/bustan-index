<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="647" viewBox="0 0 1040 647" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Ready for a final proposal?</title><desc id="desc">Roof leaks trigger survey, conditional scheduling or a hold on final commitment.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="380.7" lengthAdjust="spacingAndGlyphs">Ready for a final proposal?</tspan></text><g class="diagram-card" data-node="0"><rect x="250" y="127" width="540" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="250" y="127" width="540" height="7" fill="#24463e"/><text x="520" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="520" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="212" textLength="225.54" lengthAdjust="spacingAndGlyphs">Is the roof ready?</tspan></text><text x="520" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="258" textLength="440.31" lengthAdjust="spacingAndGlyphs">Leaks reported; replacement planned next year</tspan></text></g><path d="M520 310 V341" stroke="#006f6b" stroke-widt