<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1032" viewBox="0 0 480 1032" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">สายหลักฐานที่ควบคุมได้</title><desc id="desc">ลำดับเอกสารเชื่อมเจตนาออกแบบ เอกสารสอดคล้อง ฉบับทบทวน และการออกใช้อย่างควบคุม</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="273.37" lengthAdjust="spacingAndGlyphs">สายหลักฐานที่ควบคุมได้</tspan></text><g class="diagram-card" data-node="0"><rect x="28" y="125" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="125" width="424" height="7" fill="#24463e"/><text x="240" y="164" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="164" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="213" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="213" textLength="177.47" lengthAdjust="spacingAndGlyphs">เจตนาออกแบบ</tspan></text><text x="240" y="264" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="264" textLength="314.38" lengthAdjust="spacingAndGlyphs">ระบุโหลด โหมด และอุปกรณ์ที่เลือก</tspan></text></g><path d="M240 309 L240 334" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="28" y="343" width="424" height="213" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="343" width="424" height="7" fill="#006f6b"/><text x="240" y="382" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="382" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="240" y="431" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="431" textLength="217.9" lengthAdjust="spacingAndGlyphs">เอกสารสอดคล้อง</tspan></text><text x="240" y="482" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="482" textLength="369.49" lengthAdjust="spacingAndGlyphs">ให้ SLD การคำนวณ และรายการอุปกรณ์</tspan><tspan x="240" y="518" textLength="70.4" lengthAdjust="spacingAndGlyphs">ตรงกัน</tspan></text></g><path d="M240 560 L240 585" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="28" y="594" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="594" width="424" height="7" fill="#24463e"/><text x="240" y="633" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="633" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="240" y="682" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="682" textLength="191.79" lengthAdjust="spacingAndGlyphs">ฉบับผ่านทบทวน</tspan></text><text x="240" y="733" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="733" textLength="355.08" lengthAdjust="spacingAndGlyphs">บันทึกผู้ทบทวน สถานะ และเงื่อนไขค้าง</tspan></text></g><path d="M240 778 L240 803" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="28" y="812" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="812" width="424" height="7" fill="#006f6b"/><text x="240" y="851" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="851" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="240" y="900" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="900" textLength="208.07" lengthAdjust="spacingAndGlyphs">ชุดเอกสารออกใช้</tspan></text><text x="240" y="951" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="951" textLength="346.06" lengthAdjust="spacingAndGlyphs">ส่งฉบับเดียวกันให้ผู้รับผิดชอบทุกฝ่าย</tspan></text></g></svg>
