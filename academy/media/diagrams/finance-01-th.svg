<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="729" viewBox="0 0 1040 729" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">ไฟผลิตได้ไม่เท่ากับไฟที่ลดการซื้อ</title><desc id="desc">ผลิต 12 kWh แบ่งเป็นใช้ตรง 8 kWh กับส่วนเกิน 4 kWh</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="411.53" lengthAdjust="spacingAndGlyphs">ไฟผลิตได้ไม่เท่ากับไฟที่ลดการซื้อ</tspan></text><g class="diagram-bar" data-node="0"><text x="40" y="158" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="158" textLength="126.89" lengthAdjust="spacingAndGlyphs">ผลิตไฟ AC</tspan></text><text x="40" y="201" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="201" textLength="224.68" lengthAdjust="spacingAndGlyphs">12 kWh · หนึ่งชั่วโมงฝึก</tspan></text><rect x="40" y="225" width="960" height="28" rx="3" fill="#dedfce"/><rect x="40" y="225" width="960" height="28" rx="3" fill="#24463e"/><text x="40" y="284" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="284" textLength="198.53" lengthAdjust="spacingAndGlyphs">ชั่วโมงฝึกที่มีเฉพาะ PV</tspan></text></g><g class="diagram-bar" data-node="1"><text x="40" y="354" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="354" textLength="124.11" lengthAdjust="spacingAndGlyphs">ใช้โดยตรง</tspan></text><text x="40" y="397" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="397" textLength="213.12" lengthAdjust="spacingAndGlyphs">8 kWh · หนึ่งชั่วโมงฝึก</tspan></text><rect x="40" y="421" width="960" height="28" rx="3" fill="#dedfce"/><rect x="40" y="421" width="640" height="28" rx="3" fill="#006f6b"/><text x="40" y="480" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="480" textLength="179.05" lengthAdjust="spacingAndGlyphs">ตรงกับโหลด 8 kWh</tspan></text></g><g class="diagram-bar" data-node="2"><text x="40" y="550" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="550" textLength="98" lengthAdjust="spacingAndGlyphs">ส่วนเกิน</tspan></text><text x="40" y="593" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="593" textLength="213.12" lengthAdjust="spacingAndGlyphs">4 kWh · หนึ่งชั่วโมงฝึก</tspan></text><rect x="40" y="617" width="960" height="28" rx="3" fill="#dedfce"/><rect x="40" y="617" width="320" height="28" rx="3" fill="#24463e"/><text x="40" y="676" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="676" textLength="377.37" lengthAdjust="spacingAndGlyphs">ปลายทางอนุญาต แต่ยังไม่ยืนยันค่าตอบแทน</tspan></text></g></svg>
