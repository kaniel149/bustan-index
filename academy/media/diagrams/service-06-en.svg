<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="627" viewBox="0 0 1040 627" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Turn observations into maintenance</title><desc id="desc">A repeating loop connects the baseline, condition comparison, authorized correction and interval review.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="496.14" lengthAdjust="spacingAndGlyphs">Turn observations into maintenance</tspan></text><path d="M474 225 L561 225" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M780 327 L780 386" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M566 493 L479 493" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M260 391 L260 332" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="0"><rect x="50" y="127" width="420" height="196" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="50" y="127" width="420" height="7" fill="#24463e"/><text x="260" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="260" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="260" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="260" y="212" textLength="212.31" lengthAdjust="spacingAndGlyphs">Baseline location</tspan></text><text x="260" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="260" y="258" textLength="376.13" lengthAdjust="spacingAndGlyphs">Keep dated asset and condition records.</tspan></text></g><g class="diagram-card" data-node="1"><rect x="570" y="127" width="420" height="196" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="570" y="127" width="420" height="7" fill="#006f6b"/><text x="780" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="780" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="780" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="780" y="212" textLength="235.7" lengthAdjust="spacingAndGlyphs">Compare condition</tspan></text><text x="780" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="780" y="258" textLength="303.7" lengthAdjust="spacingAndGlyphs">Look for change, recurrence and</tspan><tspan x="780" y="289" textLength="141.29" lengthAdjust="spacingAndGlyphs">consequences.</tspan></text></g><g class="diagram-card" data-node="2"><rect x="570" y="395" width="420" height="196" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="570" y="395" width="420" height="7" fill="#24463e"/><text x="780" y="434" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="780" y="434" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="780" y="480" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="780" y="480" textLength="265.36" lengthAdjust="spacingAndGlyphs">Authorized correction</tspan></text><text x="780" y="526" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="780" y="526" textLength="335.22" lengthAdjust="spacingAndGlyphs">Plan safe access and the applicable</tspan><tspan x="780" y="557" textLength="75.92" lengthAdjust="spacingAndGlyphs">method.</tspan></text></g><g class="diagram-card" data-node="3"><rect x="50" y="395" width="420" height="196" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="50" y="395" width="420" height="7" fill="#006f6b"/><text x="260" y="434" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="260" y="434" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="260" y="480" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="260" y="480" textLength="237.3" lengthAdjust="spacingAndGlyphs">Review the interval</tspan></text><text x="260" y="526" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="260" y="526" textLength="308.34" lengthAdjust="spacingAndGlyphs">Adjust the affected location using</tspan><tspan x="260" y="557" textLength="182.18" lengthAdjust="spacingAndGlyphs">observed evidence.</tspan></text></g></svg>
