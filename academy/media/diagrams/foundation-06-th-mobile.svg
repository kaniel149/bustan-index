<svg xmlns="http://www.w3.org/2000/svg" width="480" height="965" viewBox="0 0 480 965" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">พร้อมเริ่มงานหรือยัง?</title><desc id="desc">แขนงตัดสินใจ: อันตรายไม่ทราบให้หยุด มาตรการขาดให้แก้ แผนที่ทบทวนต้องได้รับอนุมัติจากผู้มีคุณสมบัติ</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="266.07" lengthAdjust="spacingAndGlyphs">พร้อมเริ่มงานหรือยัง?</tspan></text><g class="diagram-card" data-node="0"><rect x="30" y="125" width="420" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="30" y="125" width="420" height="7" fill="#24463e"/><text x="240" y="164" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="164" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="213" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="213" textLength="209.76" lengthAdjust="spacingAndGlyphs">ตรวจก่อนทำงาน</tspan></text><text x="240" y="264" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="264" textLength="351.78" lengthAdjust="spacingAndGlyphs">อันตราย อำนาจหน้าที่ และการควบคุม</tspan></text></g><path d="M27 215 H16 V839" stroke="#006f6b" stroke-width="3" fill="none"/><path d="M16 427 L48 427" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="56" y="337" width="396" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="56" y="337" width="396" height="7" fill="#006f6b"/><text x="254" y="376" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="376" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="254" y="425" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="425" textLength="163.99" lengthAdjust="spacingAndGlyphs">อันตรายไม่ชัด</tspan></text><text x="254" y="476" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="476" textLength="227.7" lengthAdjust="spacingAndGlyphs">หยุดและแจ้งผู้รับผิดชอบ</tspan></text></g><path d="M16 633 L48 633" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="56" y="543" width="396" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="56" y="543" width="396" height="7" fill="#24463e"/><text x="254" y="582" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="582" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="254" y="631" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="631" textLength="162.02" lengthAdjust="spacingAndGlyphs">ขาดมาตรการ</tspan></text><text x="254" y="682" fill="#4a5d52" fon