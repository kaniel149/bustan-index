<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1064" viewBox="0 0 480 1064" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">งานนี้เดินหน้าต่อได้หรือไม่?</title><desc id="desc">คำตัดสินถามว่ายืนยันมาตรการสำคัญหรือยัง พร้อมทางเลือกอนุมัติ พักงาน หรือประเมินใหม่เมื่อสภาพเปลี่ยน</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="310.69" lengthAdjust="spacingAndGlyphs">งานนี้เดินหน้าต่อได้หรือไม่?</tspan></text><g class="diagram-card" data-node="0"><rect x="30" y="125" width="420" height="213" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="30" y="125" width="420" height="7" fill="#24463e"/><text x="240" y="164" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="164" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="213" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="213" textLength="329.66" lengthAdjust="spacingAndGlyphs">ยืนยันมาตรการสำคัญแล้ว?</tspan></text><text x="240" y="264" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="264" textLength="361.24" lengthAdjust="spacingAndGlyphs">ตรวจความสามารถ สภาพงาน และหลัก</tspan><tspan x="240" y="300" textLength="108.02" lengthAdjust="spacingAndGlyphs">ฐานที่ต้องมี</tspan></text></g><path d="M27 231.5 H16 V938" stroke="#006f6b" stroke-width="3" fill="none"/><path d="M16 476.5 L48 476.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="56" y="370" width="396" height="213" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="56" y="370" width="396" height="7" fill="#006f6b"/><text x="254" y="409" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="409" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="254" y="458" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="458" textLength="155.84" lengthAdjust="spacingAndGlyphs">หลักฐานครบ</tspan></text><text x="254" y="509" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="509" textLength="289.96" lengthAdjust="spacingAndGlyphs">เจ้าของอำนาจอาจอนุมัติภายใน</tspan><tspan x="254" y="545" textLength="76.78" lengthAdjust="spacingAndGlyphs">ขอบเขต</tspan></text></g><path d="M16 715.5 L48 715.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="56" y="609" width="396" height="213" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="56" y="609" width="396" height="7" fill="#24463e"/><text x="254" y="648" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="648" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="254" y="697" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="697" textLength="197.96" lengthAdjust="spacingAndGlyphs">มาตรการยังค้าง</tspan></text><text x="254" y="748" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="748" textLength="336.38" lengthAdjust="spacingAndGlyphs">พักงานที่เกี่ยวข้องและมอบหมายการ</tspan><tspan x="254" y="784" textLength="45.1" lengthAdjust="spacingAndGlyphs">แก้ไข</tspan></text></g><path d="M16 938 L48 938" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="56" y="848" width="396" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="56" y="848" width="396" height="7" fill="#006f6b"/><text x="254" y="887" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="887" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="254" y="936" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="936" textLength="194.03" lengthAdjust="spacingAndGlyphs">สภาพงานเปลี่ยน</tspan></text><text x="254" y="987" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="987" textLength="281.6" lengthAdjust="spacingAndGlyphs">หยุดและประเมินใหม่ก่อนทำต่อ</tspan></text></g></svg>
