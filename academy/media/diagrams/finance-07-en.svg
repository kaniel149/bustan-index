<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="695" viewBox="0 0 1040 695" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Currency exposure in a fixed quote</title><desc id="desc">USD 20,000 costs 700,000 THB at 35 or 720,000 THB at 36; the difference is 20,000 THB.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="484.13" lengthAdjust="spacingAndGlyphs">Currency exposure in a fixed quote</tspan></text><g class="diagram-bar" data-node="0"><text x="40" y="154" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="154" textLength="200.15" lengthAdjust="spacingAndGlyphs">At 35 THB/USD</tspan></text><text x="40" y="193" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="193" textLength="404.16" lengthAdjust="spacingAndGlyphs">700000 THB · hypothetical exchange rates</tspan></text><rect x="40" y="214" width="960" height="28" rx="3" fill="#dedfce"/><rect x="40" y="214" width="933.33" height="28" rx="3" fill="#24463e"/><text x="40" y="273" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="273" textLength="269.79" lengthAdjust="spacingAndGlyphs">USD 20,000 supplier amount</tspan></text></g><g class="diagram-bar" data-node="1"><text x="40" y="340" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="340" textLength="200.15" lengthAdjust="spacingAndGlyphs">At 36 THB/USD</tspan></text><text x="40" y="379" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="379" textLength="404.16" lengthAdjust="spacingAndGlyphs">720000 THB · hypothetical exchange rates</tspan></text><rect x="40" y="400" width="960" height="28" rx="3" fill="#dedfce"/><rect x="40" y="400" width="960" height="28" rx="3" fill="#006f6b"/><text x="40" y="459" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="459" textLength="411.05" lengthAdjust="spacingAndGlyphs">Same supplier amount, different assumption</tspan></text></g><g class="diagram-bar" data-node="2"><text x="40" y="526" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="526" textLength="292" lengthAdjust="spacingAndGlyphs">Additional cash needed</tspan></text><text x="40" y="565" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="565" textLength="392.6" lengthAdjust="spacingAndGlyphs">20000 THB · hypothetical exchange rates</tspan></text><rect x="40" y="586" width="960" height="28" rx="3" fill="#dedfce"/><rect x="40" y="586" width="26.67" height="28" rx="3" fill="#24463e"/><text x="40" y="645" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="645" textLength="204.41" lengthAdjust="spacingAndGlyphs">Before fees and taxes</tspan></text></g></svg>
