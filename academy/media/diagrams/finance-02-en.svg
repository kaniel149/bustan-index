<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="399" viewBox="0 0 1040 399" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">From bill savings to cash</title><desc id="desc">A 4,000 THB bill difference minus 500 THB maintenance leaves 3,500 THB operating benefit.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="343.54" lengthAdjust="spacingAndGlyphs">From bill savings to cash</tspan></text><g class="diagram-card" data-node="0"><rect x="40" y="127" width="216" height="236" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="127" width="216" height="7" fill="#24463e"/><text x="148" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="148" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="212" textLength="124.9" lengthAdjust="spacingAndGlyphs">Before bill</tspan></text><text x="148" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="258" textLength="148.37" lengthAdjust="spacingAndGlyphs">12,000 THB per</tspan><tspan x="148" y="289" textLength="58.36" lengthAdjust="spacingAndGlyphs">month</tspan></text></g><path d="M260 245 L279 245" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="288" y="127" width="216" height="236" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="288" y="127" width="216" height="7" fill="#006f6b"/><text x="396" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="396" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="212" textLength="101.48" lengthAdjust="spacingAndGlyphs">After bill</tspan></text><text x="396" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="258" textLength="136.69" lengthAdjust="spacingAndGlyphs">8,000 THB per</tspan><tspan x="396" y="289" textLength="58.36" lengthAdjust="spacingAndGlyphs">month</tspan></text></g><path d="M508 245 L527 245" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="536" y="127" width="216" height="236" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="536" y="127" width="216" height="7" fill="#24463e"/><text x="644" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="644" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="212" textLength="146.69" lengthAdjust="spacingAndGlyphs">Incremental</tspan><tspan x="644" y="252" textLength="160.76" lengthAdjust="spacingAndGlyphs">maintenance</tspan></text><text x="644" y="298" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="298" textLength="119.13" lengthAdjust="spacingAndGlyphs">500 THB per</tspan><tspan x="644" y="329" textLength="58.36" lengthAdjust="spacingAndGlyphs">month</tspan></text></g><path d="M756 245 L775 245" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="784" y="127" width="216" height="236" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="784" y="127" width="216" height="7" fill="#006f6b"/><text x="892" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="892" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="212" textLength="123.3" lengthAdjust="spacingAndGlyphs">Operating</tspan><tspan x="892" y="252" textLength="151.46" lengthAdjust="spacingAndGlyphs">cash benefit</tspan></text><text x="892" y="298" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="298" textLength="155.38" lengthAdjust="spacingAndGlyphs">4,000 minus 500</tspan><tspan x="892" y="329" textLength="123.14" lengthAdjust="spacingAndGlyphs">= 3,500 THB</tspan></text></g></svg>
