<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="390" viewBox="0 0 1040 390" lang="he" xml:lang="he" role="img" aria-labelledby="title desc"><title id="title">ארבע זוויות לסקר</title><desc id="desc">מצב הגג, חשיפה לשמש, הקשר חשמלי וגישה בטוחה הם ארבעה תחומי סקר משלימים.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="265.2" lengthAdjust="spacingAndGlyphs">ארבע זוויות לסקר</tspan></text><g class="diagram-card" data-node="0"><rect x="784" y="127" width="216" height="227" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="784" y="127" width="216" height="7" fill="#24463e"/><text x="892" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="892" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="892" y="212" textLength="117.37" lengthAdjust="spacingAndGlyphs">מצב הגג</tspan></text><text x="892" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="892" y="258" textLength="164.64" lengthAdjust="spacingAndGlyphs">חומר, גיל וראיות</tspan><tspan x="892" y="289" textLength="83.37" lengthAdjust="spacingAndGlyphs">הנדסיות</tspan></text></g><g class="diagram-card" data-node=