hases the agreed</tspan><tspan x="240" y="323" textLength="145.55" lengthAdjust="spacingAndGlyphs">installed scope</tspan></text></g><g class="diagram-card" data-node="1"><rect x="28" y="377" width="424" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="377" width="424" height="7" fill="#006f6b"/><text x="240" y="416" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="416" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="240" y="462" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="462" textLength="56.19" lengthAdjust="spacingAndGlyphs">PPA</tspan></text><text x="240" y="509" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="509" textLength="349.87" lengthAdjust="spacingAndGlyphs">Energy payment follows the specific</tspan><tspan x="240" y="541" textLength="105.16" lengthAdjust="spacingAndGlyphs">agreement</tspan></text></g><g class="diagram-card" data-node="2"><rect x="28" y="595" width="424" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="595" width="424" height="7" fill="#24463e"/><text x="240" y="634" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="634" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="240" y="680" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="680" textLength="76.49" lengthAdjust="spacingAndGlyphs">Lease</tspan></text><text x="240" y="727" 