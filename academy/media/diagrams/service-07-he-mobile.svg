<svg xmlns="http://www.w3.org/2000/svg" width="480" height="863" viewBox="0 0 480 863" lang="he" xml:lang="he" role="img" aria-labelledby="title desc"><title id="title">תקציב פאזה תחת עומס</title><desc id="desc">עמודות משוות תקציב 32 אמפר, בניין 20, בקשת רכב 16 וסך 36.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="288.25" lengthAdjust="spacingAndGlyphs">תקציב פאזה תחת עומס</tspan></text><g class="diagram-bar" data-node="0"><text x="452" y="146" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="452" y="146" textLength="178.1" lengthAdjust="spacingAndGlyphs">תקציב בדוגמה</tspan></text><text x="452" y="184" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="452" y="184" textLength="229.67" lengthAdjust="spacingAndGlyphs">32 אמפר, דוגמת הדרכה</tspan></text><rect x="28" y="205" width="424" height="28" rx="3" fill="#dedfce"/><rect x="75.11" y="205" width="376.89" height="28" rx="3" fill="#24463e"/><text x="452" y="264" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="452" y="264" textLength="317.52" lengthAdjust="spacingAndGlyphs">מגבלת הדרכה נתונה לפאזה זו.</tspan></text></g><g class="diagram-bar" data-node="1"><text x="452" y="329" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="452" y="329" textLength="153.66" lengthAdjust="spacingAndGlyphs">דרישה קיימת</tspan></text><text x="452" y="367" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="452" y="367" textLength="229.67" lengthAdjust="spacingAndGlyphs">20 אמפר, דוגמת הדרכה</tspan></text><rect x="28" y="388" width="424" height="28" rx="3" fill="#dedfce"/><rect x="216.44" y="388" width="235.56" height="28" rx="3" fill="#006f6b"/><text x="452" y="447" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="452" y="447" textLength="291.69" lengthAdjust="spacingAndGlyphs">עומס בניין לפני בקשת הרכב.</tspan></text></g><g class="diagram-bar" data-node="2"><text x="452" y="512" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="452" y="512" textLength="142.48" lengthAdjust="spacingAndGlyphs">בקשת הרכב</tspan></text><text x="452" y="550" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="452" y="550" textLength="229.67" lengthAdjust="spacingAndGlyphs">16 אמפר, דוגמת הדרכה</tspan></text><rect x="28" y="571" width="424" height="28" rx="3" fill="#dedfce"/><rect x="263.56" y="571" width="188.44" height="28" rx="3" fill="#24463e"/><text x="452" y="630" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="452" y="630" textLength="309.75" lengthAdjust="spacingAndGlyphs">זרם מבוקש, לא אספקה מובטחת.</tspan></text></g><g class="diagram-bar" data-node="3"><text x="452" y="695" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="452" y="695" textLength="110.5" lengthAdjust="spacingAndGlyphs">סך מבוקש</tspan></text><text x="452" y="733" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="452" y="733" textLength="229.67" lengthAdjust="spacingAndGlyphs">36 אמפר, דוגמת הדרכה</tspan></text><rect x="28" y="754" width="424" height="28" rx="3" fill="#dedfce"/><rect x="28" y="754" width="424" height="28" rx="3" fill="#006f6b"/><text x="452" y="813" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="452" y="813" textLength="209.12" lengthAdjust="spacingAndGlyphs">20 + 16 = 36 מעל 32.</tspan></text></g></svg>
