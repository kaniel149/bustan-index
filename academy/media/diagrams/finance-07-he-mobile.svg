<svg xmlns="http://www.w3.org/2000/svg" width="480" height="680" viewBox="0 0 480 680" lang="he" xml:lang="he" role="img" aria-labelledby="title desc"><title id="title">חשיפת מטבע בהצעה קבועה</title><desc id="desc">20,000 דולר עולים 700,000 באט בשער 35 או 720,000 בשער 36; ההפרש 20,000 באט.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="340.97" lengthAdjust="spacingAndGlyphs">חשיפת מטבע בהצעה קבועה</tspan></text><g class="diagram-bar" data-node="0"><text x="452" y="146" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="452" y="146" textLength="204.93" lengthAdjust="spacingAndGlyphs">ב־35 באט לדולר</tspan></text><text x="452" y="184" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="452" y="184" textLength="370.36" lengthAdjust="spacingAndGlyphs">700000 באט · שערי חליפין היפותטיים</tspan></text><rect x="28" y="205" width="424" height="28" rx="3" fill="#dedfce"/><rect x="39.78" y="205" width="412.22" height="28" rx="3" fill="#24463e"/><text x="452" y="264" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="452" y="264" textLength="225.75" lengthAdjust="spacingAndGlyphs">סכום ספק: 20,000 דולר</tspan></text></g><g class="diagram-bar" data-node="1"><text x="452" y="329" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="452" y="329" textLength="204.93" lengthAdjust="spacingAndGlyphs">ב־36 באט לדולר</tspan></text><text x="452" y="367" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="452" y="367" textLength="370.36" lengthAdjust="spacingAndGlyphs">720000 באט · שערי חליפין היפותטיים</tspan></text><rect x="28" y="388" width="424" height="28" rx="3" fill="#dedfce"/><rect x="28" y="388" width="424" height="28" rx="3" fill="#006f6b"/><text x="452" y="447" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="452" y="447" textLength="330.96" lengthAdjust="spacingAndGlyphs">אותו סכום ספק, הנחת מטבע אחרת</tspan></text></g><g class="diagram-bar" data-node="2"><text x="452" y="512" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="452" y="512" textLength="252.98" lengthAdjust="spacingAndGlyphs">תוספת מזומן נדרשת</tspan></text><text x="452" y="550" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="452" y="550" textLength="358.8" lengthAdjust="spacingAndGlyphs">20000 באט · שערי חליפין היפותטיים</tspan></text><rect x="28" y="571" width="424" height="28" rx="3" fill="#dedfce"/><rect x="440.22" y="571" width="11.78" height="28" rx="3" fill="#24463e"/><text x="452" y="630" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="452" y="630" textLength="178.5" lengthAdjust="spacingAndGlyphs">לפני עמלות ומסים</tspan></text></g></svg>
