<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1098" viewBox="0 0 480 1098" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">จากอาคารสู่ข้อกำหนดออกแบบ</title><desc id="desc">สี่ขั้นเชื่อมขอบเขตมิเตอร์ หลักฐาน ข้อมูลที่ยังขาด และข้อกำหนดออกแบบ</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="359.36" lengthAdjust="spacingAndGlyphs">จากอาคารสู่ข้อกำหนดออกแบบ</tspan></text><g class="diagram-card" data-node="0"><rect x="28" y="125" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="125" width="424" height="7" fill="#24463e"/><text x="240" y="164" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="164" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="213" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="213" textLength="187.86" lengthAdjust="spacingAndGlyphs">กำหนดขอบเขต</tspan></text><text x="240" y="264" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="264" textLength="312.84" lengthAdjust="spacingAndGlyphs">ระบุอาคาร มิเตอร์ และโหลดที่รวม</tspan></text></g><path d="M240 309 L240 334" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="28" y="343" width="424" height="213" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="343" width="424" height="7" fill="#006f6b"/><text x="240" y="382" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="382" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="240" y="431" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="431" textLength="146.02" lengthAdjust="spacingAndGlyphs">เก็บหลักฐาน</tspan></text><text x="240" y="482" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="482" textLength="350.9" lengthAdjust="spacingAndGlyphs">แยกข้อมูลวัดจริง คำบอกเล่า และแบบ</tspan><tspan x="240" y="518" textLength="70.4" lengthAdjust="spacingAndGlyphs">จำลอง</tspan></text></g><path d="M240 560 L240 585" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="28" y="594" width="424" height="213" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="594" width="424" height="7" fill="#24463e"/><text x="240" y="633" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="633" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="240" y="682" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="682" textLength="203.86" lengthAdjust="spacingAndGlyphs">จัดการข้อมูลขาด</tspan></text><text x="240" y="733" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="733" textLength="372.46" lengthAdjust="spacingAndGlyphs">กำหนดผู้รับผิดชอบและงานถัดไปให้ข้อไม่</tspan><tspan x="240" y="769" textLength="66.88" lengthAdjust="spacingAndGlyphs">แน่นอน</tspan></text></g><path d="M240 811 L240 836" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="28" y="845" width="424" height="213" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="845" width="424" height="7" fill="#006f6b"/><text x="240" y="884" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="884" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="240" y="933" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="933" textLength="179.71" lengthAdjust="spacingAndGlyphs">ออกข้อกำหนด</tspan></text><text x="240" y="984" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="984" textLength="374.88" lengthAdjust="spacingAndGlyphs">บันทึกขอบเขตและข้อจำกัดออกแบบที่ยัง</tspan><tspan x="240" y="1020" textLength="34.54" lengthAdjust="spacingAndGlyphs">เปิด</tspan></text></g></svg>
