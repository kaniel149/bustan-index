<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="647" viewBox="0 0 1040 647" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Can the task proceed?</title><desc id="desc">A capstone decision distinguishes structural, material and EV-scope holds.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="321.7" lengthAdjust="spacingAndGlyphs">Can the task proceed?</tspan></text><g class="diagram-card" data-node="0"><rect x="250" y="127" width="540" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="250" y="127" width="540" height="7" fill="#24463e"/><text x="520" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="520" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="212" textLength="384.67" lengthAdjust="spacingAndGlyphs">Capstone evidence complete?</tspan></text><text x="520" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="258" textLength="393.58" lengthAdjust="spacingAndGlyphs">Check each affected boundary separately.</tspan></text></g><path d="M520 310 V341" stroke="#006f6b" stroke-width="3" fill="none"/><path d="M520 341 H189.33 V366" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="40" y="375" width="298.67" height="236" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="375" width="298.67" height="7" fill="#006f6b"/><text x="189.33" y="414" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="189.33" y="414" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="189.33" y="460" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="189.33" y="460" textLength="252.92" lengthAdjust="spacingAndGlyphs">Missing roof support</tspan></text><text x="189.33" y="506" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="189.33" y="506" textLength="204.31" lengthAdjust="spacingAndGlyphs">Structural owner must</tspan><tspan x="189.33" y="537" textLength="204.35" lengthAdjust="spacingAndGlyphs">resolve the mismatch.</tspan></text></g><path d="M520 341 H520 V366" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="370.67" y="375" width="298.67" height="236" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="370.67" y="375" width="298.67" height="7" fill="#24463e"/><text x="520" y="414" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="414" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="520" y="460" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="460" textLength="152.95" lengthAdjust="spacingAndGlyphs">Unapproved</tspan><tspan x="520" y="500" textLength="137.34" lengthAdjust="spacingAndGlyphs">connectors</tspan></text><text x="520" y="546" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="546" textLength="244.02" lengthAdjust="spacingAndGlyphs">Quarantine until compliant</tspan><tspan x="520" y="577" textLength="192.7" lengthAdjust="spacingAndGlyphs">material is accepted.</tspan></text></g><path d="M520 341 H850.67 V366" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="701.33" y="375" width="298.67" height="236" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="701.33" y="375" width="298.67" height="7" fill="#006f6b"/><text x="850.67" y="414" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="850.67" y="414" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="850.67" y="460" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="850.67" y="460" textLength="220.2" lengthAdjust="spacingAndGlyphs">EV scope change</tspan></text><text x="850.67" y="506" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="850.67" y="506" textLength="210.25" lengthAdjust="spacingAndGlyphs">Hold pending load and</tspan><tspan x="850.67" y="537" textLength="164.64" lengthAdjust="spacingAndGlyphs">protection review.</tspan></text></g></svg>
