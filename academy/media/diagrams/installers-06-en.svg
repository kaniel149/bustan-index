<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="501" viewBox="0 0 1040 501" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">The control-permission chain</title><desc id="desc">Battery observations pass to a matching BMS, separate permissions and supported equipment response.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="402.73" lengthAdjust="spacingAndGlyphs">The control-permission chain</tspan></text><g class="diagram-card" data-node="0"><rect x="40" y="127" width="216" height="338" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="127" width="216" height="7" fill="#24463e"/><text x="148" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="148" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="212" textLength="88.96" lengthAdjust="spacingAndGlyphs">Battery</tspan><tspan x="148" y="252" textLength="159.19" lengthAdjust="spacingAndGlyphs">observations</tspan></text><text x="148" y="298" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="298" textLength="77.07" lengthAdjust="spacingAndGlyphs">Cell and</tspan><tspan x="148" y="329" textLength="113.21" lengthAdjust="spacingAndGlyphs">temperature</tspan><tspan x="148" y="360" textLength="109.75" lengthAdjust="spacingAndGlyphs">information.</tspan></text></g><path d="M260 296 L279 296" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="288" y="127" width="216" height="338" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="288" y="127" width="216" height="7" fill="#006f6b"/><text x="396" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="396" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="212" textLength="113.92" lengthAdjust="spacingAndGlyphs">Matching</tspan><tspan x="396" y="252" textLength="60.85" lengthAdjust="spacingAndGlyphs">BMS</tspan></text><text x="396" y="298" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="298" textLength="123.77" lengthAdjust="spacingAndGlyphs">Interprets the</tspan><tspan x="396" y="329" textLength="171.61" lengthAdjust="spacingAndGlyphs">compatible battery</tspan><tspan x="396" y="360" textLength="60.71" lengthAdjust="spacingAndGlyphs">family.</tspan></text></g><path d="M508 296 L527 296" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="536" y="127" width="216" height="338" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="536" y="127" width="216" height="7" fill="#24463e"/><text x="644" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="644" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="212" textLength="103.31" lengthAdjust="spacingAndGlyphs">Charge/</tspan><tspan x="644" y="252" textLength="121.73" lengthAdjust="spacingAndGlyphs">discharge</tspan><tspan x="644" y="292" textLength="135.74" lengthAdjust="spacingAndGlyphs">permission</tspan></text><text x="644" y="338" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="338" textLength="175.14" lengthAdjust="spacingAndGlyphs">Separate functions</tspan><tspan x="644" y="369" textLength="167.01" lengthAdjust="spacingAndGlyphs">can have different</tspan><tspan x="644" y="400" textLength="61.91" lengthAdjust="spacingAndGlyphs">states.</tspan></text></g><path d="M756 296 L775 296" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="784" y="127" width="216" height="338" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="784" y="127" width="216" height="7" fill="#006f6b"/><text x="892" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="892" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="212" textLength="129.56" lengthAdjust="spacingAndGlyphs">Supported</tspan><tspan x="892" y="252" textLength="131.11" lengthAdjust="spacingAndGlyphs">equipment</tspan><tspan x="892" y="292" textLength="115.49" lengthAdjust="spacingAndGlyphs">response</tspan></text><text x="892" y="338" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="338" textLength="89.88" lengthAdjust="spacingAndGlyphs">Approved</tspan><tspan x="892" y="369" textLength="163.44" lengthAdjust="spacingAndGlyphs">interfaces convey</tspan><tspan x="892" y="400" textLength="112.1" lengthAdjust="spacingAndGlyphs">the required</tspan><tspan x="892" y="431" textLength="68.9" lengthAdjust="spacingAndGlyphs">control.</tspan></text></g></svg>
