<svg xmlns="http://www.w3.org/2000/svg" width="480" height="969" viewBox="0 0 480 969" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">แยกตามความต้องการ ไม่เหมารวมคน</title><desc id="desc">คำถามสำหรับวิลลา รีสอร์ต และร้านอาหารนำไปสู่ความต้องการที่ยืนยันแทนการเหมารวมลูกค้า</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="394.24" lengthAdjust="spacingAndGlyphs">แยกตามความต้องการ ไม่เหมารวม</tspan><tspan x="240" y="121" textLength="34.61" lengthAdjust="spacingAndGlyphs">คน</tspan></text><g class="diagram-card" data-node="0"><rect x="28" y="167" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="167" width="424" height="7" fill="#24463e"/><text x="240" y="206" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="206" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="255" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="255" textLength="65.99" lengthAdjust="spacingAndGlyphs">วิลลา</tspan></text><text x="240" y="306" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="306" textLength="272.36" lengthAdjust="spacingAndGlyphs">ถามการเข้าพักและโหลดสำคัญ</tspan></text></g><g class="diagram-card" data-node="1"><rect x="28" y="367" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="367" width="424" height="7" fill="#006f6b"/><text x="240" y="406" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="406" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="240" y="455" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="455" textLength="89.86" lengthAdjust="spacingAndGlyphs">รีสอร์ต</tspan></text><text x="240" y="506" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="506" textLength="276.54" lengthAdjust="spacingAndGlyphs">ถามงานบริการแขกและมิเตอร์</tspan></text></g><g class="diagram-card" data-node="2"><rect x="28" y="567" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="567" width="424" height="7" fill="#24463e"/><text x="240" y="606" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="606" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="240" y="655" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="655" textLength="126.08" lengthAdjust="spacingAndGlyphs">ร้านอาหาร</tspan></text><text x="240" y="706" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="706" textLength="295.9" lengthAdjust="spacingAndGlyphs">ถามเวลาให้บริการและผลกระทบ</tspan></text></g><g class="diagram-card" data-node="3"><rect x="28" y="767" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="767" width="424" height="7" fill="#006f6b"/><text x="240" y="806" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="806" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="240" y="855" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="855" textLength="257.77" lengthAdjust="spacingAndGlyphs">ความต้องการที่ยืนยัน</tspan></text><text x="240" y="906" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="906" textLength="302.06" lengthAdjust="spacingAndGlyphs">ยืนยันคำตอบกับผู้เกี่ยวข้องจริง</tspan></text></g></svg>
