<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="470" viewBox="0 0 1040 470" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Own the subcontractor interface</title><desc id="desc">Four stages assign a subcontract boundary, interface owners, checking and explicit acceptance.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="442.38" lengthAdjust="spacingAndGlyphs">Own the subcontractor interface</tspan></text><g class="diagram-card" data-node="0"><rect x="40" y="127" width="216" height="307" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="127" width="216" height="7" fill="#24463e"/><text x="148" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="148" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="212" textLength="128.04" lengthAdjust="spacingAndGlyphs">Define the</tspan><tspan x="148" y="252" textLength="117.07" lengthAdjust="spacingAndGlyphs">boundary</tspan></text><text x="148" y="298" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="298" textLength="133.12" lengthAdjust="spacingAndGlyphs">State included</tspan><tspan x="148" y="329" textLength="85.24" lengthAdjust="spacingAndGlyphs">work and</tspan><tspan x="148" y="360" textLength="98.03" lengthAdjust="spacingAndGlyphs">exclusions</tspan></text></g><path d="M260 280.5 L279 280.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="288" y="127" width="216" height="307" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="288" y="127" width="216" height="7" fill="#006f6b"/><text x="396" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="396" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="212" textLength="74.89" lengthAdjust="spacingAndGlyphs">Name</tspan><tspan x="396" y="252" textLength="107.69" lengthAdjust="spacingAndGlyphs">interface</tspan><tspan x="396" y="292" textLength="90.5" lengthAdjust="spacingAndGlyphs">owners</tspan></text><text x="396" y="338" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="338" textLength="148.28" lengthAdjust="spacingAndGlyphs">Assign adjacent</tspan><tspan x="396" y="369" textLength="161.18" lengthAdjust="spacingAndGlyphs">work and handoff</tspan><tspan x="396" y="400" textLength="137.7" lengthAdjust="spacingAndGlyphs">responsibilities</tspan></text></g><path d="M508 280.5 L527 280.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="536" y="127" width="216" height="307" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="536" y="127" width="216" height="7" fill="#24463e"/><text x="644" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="644" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="212" textLength="126.47" lengthAdjust="spacingAndGlyphs">Check the</tspan><tspan x="644" y="252" textLength="68.66" lengthAdjust="spacingAndGlyphs">result</tspan></text><text x="644" y="298" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="298" textLength="141.29" lengthAdjust="spacingAndGlyphs">Inspect against</tspan><tspan x="644" y="329" textLength="168.19" lengthAdjust="spacingAndGlyphs">agreed scope and</tspan><tspan x="644" y="360" textLength="84.04" lengthAdjust="spacingAndGlyphs">evidence</tspan></text></g><path d="M756 280.5 L775 280.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="784" y="127" width="216" height="307" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="784" y="127" width="216" height="7" fill="#006f6b"/><text x="892" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="892" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="212" textLength="85.84" lengthAdjust="spacingAndGlyphs">Accept</tspan><tspan x="892" y="252" textLength="106.09" lengthAdjust="spacingAndGlyphs">explicitly</tspan></text><text x="892" y="298" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="298" textLength="85.22" lengthAdjust="spacingAndGlyphs">Separate</tspan><tspan x="892" y="329" textLength="102.75" lengthAdjust="spacingAndGlyphs">completed,</tspan><tspan x="892" y="360" textLength="119.11" lengthAdjust="spacingAndGlyphs">checked and</tspan><tspan x="892" y="391" textLength="147.13" lengthAdjust="spacingAndGlyphs">accepted states</tspan></text></g></svg>
