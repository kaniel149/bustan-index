irection="ltr" unicode-bidi="plaintext"><tspan x="644" y="269" textLength="137.13" lengthAdjust="spacingAndGlyphs">ตำแหน่งมิเตอร์</tspan><tspan x="644" y="303" textLength="134.4" lengthAdjust="spacingAndGlyphs">กำหนดสิ่งที่วัด</tspan></text></g><g class="diagram-card" data-node="3"><rect x="784" y="131" width="216" height="243" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="784" y="131" width="216" height="7" fill="#006f6b"/><text x="892" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="892" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="219" textLength="83.96" lengthAdjust="spacingAndGlyphs">ติดตาม</tspan></text><text x="892" y="269" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="269" textLength="127.68" lengthAdjust="spacingAndGlyphs">ซอฟต์แวร์แปล</tspan><tspan x="892" y="303" textLength="113.61" lengthAdjust="spacingAndGlyphs">ข้อมูลที่ได้รับ</tspan></text></g></svg>
