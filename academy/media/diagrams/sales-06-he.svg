<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="430" viewBox="0 0 1040 430" lang="he" xml:lang="he" role="img" aria-labelledby="title desc"><title id="title">משווים היקף לפני מחיר</title><desc id="desc">א׳ עולה 300,000 באט; ב׳ בסך 280,000 ועוד 25,000 לגישה מגיעה ל־305,000 להשוואה.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="336.96" lengthAdjust="spacingAndGlyphs">משווים היקף לפני מחיר</tspan></text><g class="diagram-card" data-node="0"><rect x="784" y="127" width="216" height="267" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="784" y="127" width="216" height="7" fill="#24463e"/><text x="892" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="892" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="892" y="212" textLength="117.37" lengthAdjust="spacingAndGlyphs">הצעה א׳</tspan></text><text x="892" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="892" y="258" textLength="128.65" lengthAdjust="spacingAndGlyphs">300,000 באט;</tspan><tspan x="892" y="289" textLength="130.2" lengthAdjust="spacingAndGlyphs">גישה מוסכמת</tspan><tspan x="892" y="320" textLength="62.16" lengthAdjust="spacingAndGlyphs">כלולה</tspan></text></g><g class="diagram-card" data-node="1"><rect x="536" y="127" width="216" height="267" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="536" y="127" width="216" height="7" fill="#006f6b"/><text x="644" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="644" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="644" y="212" textLength="117.37" lengthAdjust="spacingAndGlyphs">הצעה ב׳</tspan></text><text x="644" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="644" y="258" textLength="128.65" lengthAdjust="spacingAndGlyphs">280,000 באט;</tspan><tspan x="644" y="289" textLength="149.73" lengthAdjust="spacingAndGlyphs">גישה לא כלולה</tspan></text></g><g class="diagram-card" data-node="2"><rect x="288" y="127" width="216" height="267" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="288" y="127" width="216" height="7" fill="#24463e"/><text x="396" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="396" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="396" y="212" textLength="155.84" lengthAdjust="spacingAndGlyphs">ב׳ להשוואה</tspan><tspan x="396" y="252" textLength="101.37" lengthAdjust="spacingAndGlyphs">מתואמת</tspan></text><text x="396" y="298" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="396" y="298" textLength="131.67" lengthAdjust="spacingAndGlyphs">מוסיפים עלות</tspan><tspan x="396" y="329" textLength="136.08" lengthAdjust="spacingAndGlyphs">גישה מאומתת:</tspan><tspan x="396" y="360" textLength="111.09" lengthAdjust="spacingAndGlyphs">25,000 באט</tspan></text></g><g class="diagram-card" data-node="3"><rect x="40" y="127" width="216" height="267" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="127" width="216" height="7" fill="#006f6b"/><text x="148" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="148" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="148" y="212" textLength="93.23" lengthAdjust="spacingAndGlyphs">השוואת</tspan><tspan x="148" y="252" textLength="74.97" lengthAdjust="spacingAndGlyphs">ראיות</tspan></text><text x="148" y="298" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="148" y="298" textLength="170.94" lengthAdjust="spacingAndGlyphs">בודקים גם דגמים</tspan><tspan x="148" y="329" textLength="170.73" lengthAdjust="spacingAndGlyphs">, אחריות והחרגות</tspan></text></g></svg>
