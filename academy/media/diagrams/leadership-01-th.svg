<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="454" viewBox="0 0 1040 454" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">ทำให้จุดอนุมัติตรวจสอบได้</title><desc id="desc">สี่ขั้นทำให้จุดอนุมัติชัดเจน ได้แก่ คำตัดสิน เจ้าของ หลักฐานที่ต้องมี และผลที่บันทึก</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="357.55" lengthAdjust="spacingAndGlyphs">ทำให้จุดอนุมัติตรวจสอบได้</tspan></text><g class="diagram-card" data-node="0"><rect x="40" y="131" width="216" height="287" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="131" width="216" height="7" fill="#24463e"/><text x="148" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="148" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="219" textLength="167.92" lengthAdjust="spacingAndGlyphs">ระบุการตัดสิน</tspan><tspan x="148" y="263" textLength="26.11" lengthAdjust="spacingAndGlyphs">ใจ</tspan></text><text x="148" y="313" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="313" textLength="163.17" lengthAdjust="spacingAndGlyphs">ระบุชัดว่างานใดจะ</tspan><tspan x="148" y="347" textLength="95.76" lengthAdjust="spacingAndGlyphs">เดินหน้าต่อ</tspan></text></g><path d="M260 274.5 L279 274.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="288" y="131" width="216" height="287" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="288" y="131" width="216" height="7" fill="#006f6b"/><text x="396" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="396" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="219" textLength="143.77" lengthAdjust="spacingAndGlyphs">กำหนดผู้รับ</tspan><tspan x="396" y="263" textLength="89.86" lengthAdjust="spacingAndGlyphs">ผิดชอบ</tspan></text><text x="396" y="313" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="313" textLength="132.72" lengthAdjust="spacingAndGlyphs">แยกเจ้าของคำ</tspan><tspan x="396" y="347" textLength="103.11" lengthAdjust="spacingAndGlyphs">ตัดสินจากผู้</tspan><tspan x="396" y="381" textLength="80.64" lengthAdjust="spacingAndGlyphs">สนับสนุน</tspan></text></g><path d="M508 274.5 L527 274.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="536" y="131" width="216" height="287" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="536" y="131" width="216" height="7" fill="#24463e"/><text x="644" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="644" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="219" textLength="143.77" lengthAdjust="spacingAndGlyphs">กำหนดหลัก</tspan><tspan x="644" y="263" textLength="48.02" lengthAdjust="spacingAndGlyphs">ฐาน</tspan></text><text x="644" y="313" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="313" textLength="167.37" lengthAdjust="spacingAndGlyphs">ตรวจเกณฑ์ที่ตกลง</tspan><tspan x="644" y="347" textLength="134.4" lengthAdjust="spacingAndGlyphs">และเงื่อนไขค้าง</tspan></text></g><path d="M756 274.5 L775 274.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="784" y="131" width="216" height="287" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="784" y="131" width="216" height="7" fill="#006f6b"/><text x="892" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="892" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="219" textLength="107.83" lengthAdjust="spacingAndGlyphs">บันทึกผล</tspan><tspan x="892" y="263" textLength="71.88" lengthAdjust="spacingAndGlyphs">ตัดสิน</tspan></text><text x="892" y="313" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="313" textLength="159.6" lengthAdjust="spacingAndGlyphs">อนุมัติ พัก หรือส่ง</tspan><tspan x="892" y="347