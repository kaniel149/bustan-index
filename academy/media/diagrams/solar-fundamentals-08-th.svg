<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">แยกคำถามการอนุญาต</title><desc id="desc">สี่เรื่องแยกกัน: เชื่อมต่อ PEA สถานะ ERC ข้อกำหนดอาคารท้องถิ่น และข้อตกลงส่งออก</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="294.84" lengthAdjust="spacingAndGlyphs">แยกคำถามการอนุญาต</tspan></text><g class="diagram-card" data-node="0"><rect x="40" y="131" width="216" height="253" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="131" width="216" height="7" fill="#24463e"/><text x="148" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="148" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="219" textLength="160.06" lengthAdjust="spacingAndGlyphs">เชื่อมต่อโครง</tspan><tspan x="148" y="263" textLength="48.02" lengthAdjust="spacingAndGlyphs">ข่าย</tspan></text><text x="148" y="313" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="313" textLength="129.99" lengthAdjust="spacingAndGlyphs">ยืนยันช่องทาง</tspan><tspan x="148" y="347" textLength="157.1" lengthAdjust="spacingAndGlyphs">โครงการกับ PEA</tspan></text></g><g class="diagram-card" data-node="1"><rect x="288" y="131" width="216" height="253" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="288" y="131" width="216" height="7" fill="#006f6b"/><text x="396" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="396" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="219" textLength="149.95" lengthAdjust="spacingAndGlyphs">สถานะกำกับ</tspan><tspan x="396" y="263" textLength="49.42" lengthAdjust="spacingAndGlyphs">ดูแล</tspan></text><text x="396" y="313" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="313" textLength="147.84" lengthAdjust="spacingAndGlyphs">ตรวจข้อกำหนด</tspan><tspan x="396" y="347" textLength="83.18" lengthAdjust="spacingAndGlyphs">ERC ที่ใช้</tspan></text></g><g class="diagram-card" data-node="2"><rect x="536" y="131" width="216" height="253" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="536" y="131" width="216" height="7" fill="#24463e"/><text x="644" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="644" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="219" textLength="175.5" lengthAdjust="spacingAndGlyphs">อาคารและพื้นที่</tspan></text><text x="644" y="269" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="269" textLength="143.43" lengthAdjust="spacingAndGlyphs">ตรวจหน่วยงาน</tspan><tspan x="644" y="303" textLength="174.72" lengthAdjust="spacingAndGlyphs">ท้องถิ่นที่รับผิดชอบ</tspan></text></g><g class="diagram-card" data-node="3"><rect x="784" y="131" width="216" height="253" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="784" y="131" width="216" height="7" fill="#006f6b"/><text x="892" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="892" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="219" textLength="163.99" lengthAdjust="spacingAndGlyphs">รายได้ส่งออก</tspan></text><text x="892" y="269" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="269" textLength="167.37" lengthAdjust="spacingAndGlyphs">ต้องมีข้อตกลงเป็น</tspan><tspan x="892" y="303" textLength="143.43" lengthAdjust="spacingAndGlyphs">ลายลักษณ์อักษร</tspan></text></g></svg>
