<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="390" viewBox="0 0 1040 390" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Discount the dated cash flows</title><desc id="desc">A 100,000 THB payment followed by two annual 60,000 THB receipts gives roughly 4,132 THB NPV at 10%.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="414.71" lengthAdjust="spacingAndGlyphs">Discount the dated cash flows</tspan></text><g class="diagram-card" data-node="0"><rect x="40" y="127" width="216" height="227" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="127" width="216" height="7" fill="#24463e"/><text x="148" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="148" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="212" textLength="82.78" lengthAdjust="spacingAndGlyphs">Year 0</tspan></text><text x="148" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="258" textLength="165.88" lengthAdjust="spacingAndGlyphs">Pay 100,000 THB</tspan><tspan x="148" y="289" textLength="38.51" lengthAdjust="spacingAndGlyphs">now</tspan></text></g><path d="M260 240.5 L279 240.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="288" y="127" width="216" height="227" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="288" y="127" width="216" height="7" fill="#006f6b"/><text x="396" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="396" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="212" textLength="82.78" lengthAdjust="spacingAndGlyphs">Year 1</tspan></text><text x="396" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="258" textLength="145.99" lengthAdjust="spacingAndGlyphs">Receive 60,000</tspan><tspan x="396" y="289" textLength="131.96" lengthAdjust="spacingAndGlyphs">THB; discount</tspan><tspan x="396" y="320" textLength="45.53" lengthAdjust="spacingAndGlyphs">once</tspan></text></g><path d="M508 240.5 L527 240.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="536" y="127" width="216" height="227" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="536" y="127" width="216" height="7" fill="#24463e"/><text x="644" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="644" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="212" textLength="82.78" lengthAdjust="spacingAndGlyphs">Year 2</tspan></text><text x="644" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="258" textLength="145.99" lengthAdjust="spacingAndGlyphs">Receive 60,000</tspan><tspan x="644" y="289" textLength="131.96" lengthAdjust="spacingAndGlyphs">THB; discount</tspan><tspan x="644" y="320" textLength="47.84" lengthAdjust="spacingAndGlyphs">twice</tspan></text></g><path d="M756 240.5 L775 240.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="784" y="127" width="216" height="227" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="784" y="127" width="216" height="7" fill="#006f6b"/><text x="892" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="892" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="212" textLength="154.78" lengthAdjust="spacingAndGlyphs">NPV at 10%</tspan></text><text x="892" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="258" textLength="155.72" lengthAdjust="spacingAndGlyphs">Approximately +</tspan><tspan x="892" y="289" textLength="100.46" lengthAdjust="spacingAndGlyphs">4,132 THB</tspan></text></g></svg>
