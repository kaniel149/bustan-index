<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="454" viewBox="0 0 1040 454" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">หลักฐานขับเคลื่อนขั้นตอนขาย</title><desc id="desc">คัดกรองนำไปสู่หลักฐานสำรวจ ข้อเสนอชัดเจน และงานถัดไปที่บันทึก</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="395.3" lengthAdjust="spacingAndGlyphs">หลักฐานขับเคลื่อนขั้นตอนขาย</tspan></text><g class="diagram-card" data-node="0"><rect x="40" y="131" width="216" height="287" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="131" width="216" height="7" fill="#24463e"/><text x="148" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="148" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="219" textLength="107.83" lengthAdjust="spacingAndGlyphs">คัดกรอง</tspan></text><text x="148" y="269" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="269" textLength="103.11" lengthAdjust="spacingAndGlyphs">ยืนยันความ</tspan><tspan x="148" y="303" textLength="144.9" lengthAdjust="spacingAndGlyphs">ต้องการ อำนาจ</tspan><tspan x="148" y="337" textLength="107.31" lengthAdjust="spacingAndGlyphs">งบ และเวลา</tspan></text></g><path d="M260 274.5 L279 274.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="288" y="131" width="216" height="287" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="288" y="131" width="216" height="7" fill="#006f6b"/><text x="396" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="396" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="219" textLength="89.86" lengthAdjust="spacingAndGlyphs">สำรวจ</tspan></text><text x="396" y="269" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="269" textLength="162.96" lengthAdjust="spacingAndGlyphs">มอบหมายเก็บหลัก</tspan><tspan x="396" y="303" textLength="95.76" lengthAdjust="spacingAndGlyphs">ฐานเทคนิค</tspan></text></g><path d="M508 274.5 L527 274.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="536" y="131" width="216" height="287" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="536" y="131" width="216" height="7" fill="#24463e"/><text x="644" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="644" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="219" textLength="119.9" lengthAdjust="spacingAndGlyphs">อธิบายข้อ</tspan><tspan x="644" y="263" textLength="62.06" lengthAdjust="spacingAndGlyphs">เสนอ</tspan></text><text x="644" y="313" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="313" textLength="123.69" lengthAdjust="spacingAndGlyphs">แสดงขอบเขต</tspan><tspan x="644" y="347" textLength="174.51" lengthAdjust="spacingAndGlyphs">สมมติฐาน และเรื่อง</tspan><tspan x="644" y="381" textLength="35.91" lengthAdjust="spacingAndGlyphs">ค้าง</tspan></text></g><path d="M756 274.5 L775 274.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="784" y="131" width="216" height="287" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="784" y="131" width="216" height="7" fill="#006f6b"/><text x="892" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="892" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="219" textLength="161.74" lengthAdjust="spacingAndGlyphs">ตกลงขั้นตอน</tspan><tspan x="892" y="263" textLength="62.06" lengthAdjust="spacingAndGlyphs">ต่อไป</tspan></text><text x="892" y="313" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="313" textLength="161.28" lengthAdjust="spacingAndGlyphs">บันทึกผู้รับผิดชอบ</tspan><tspan x="892" y="347" textLength="114.66" lengthAdjust="spacingAndGlyphs">งาน และวันที่</tspan></text></g></svg>
