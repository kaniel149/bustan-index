<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">ชุดส่งมอบที่ตรงกันทั้งชุด</title><desc id="desc">ขอบเขตลงนาม แบบ และคำสั่งซื้อต้องตรงก่อนทีมถัดไปรับชุดส่งมอบ</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="339.46" lengthAdjust="spacingAndGlyphs">ชุดส่งมอบที่ตรงกันทั้งชุด</tspan></text><g class="diagram-card" data-node="0"><rect x="40" y="131" width="216" height="253" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="131" width="216" height="7" fill="#24463e"/><text x="148" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="148" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="219" textLength="151.91" lengthAdjust="spacingAndGlyphs">ขอบเขตที่ลง</tspan><tspan x="148" y="263" textLength="48.02" lengthAdjust="spacingAndGlyphs">นาม</tspan></text><text x="148" y="313" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="313" textLength="165.27" lengthAdjust="spacingAndGlyphs">อุปกรณ์ วงจร และ</tspan><tspan x="148" y="347" textLength="86.73" lengthAdjust="spacingAndGlyphs">ข้อยกเว้น</tspan></text></g><path d="M260 257.5 L279 257.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="288" y="131" width="216" height="253" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="288" y="131" width="216" height="7" fill="#006f6b"/><text x="396" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="396" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="219" textLength="97.44" lengthAdjust="spacingAndGlyphs">แบบทาง</tspan><tspan x="396" y="263" textLength="80.03" lengthAdjust="spacingAndGlyphs">เทคนิค</tspan></text><text x="396" y="313" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="313" textLength="167.37" lengthAdjust="spacingAndGlyphs">ตรงกับขอบเขตผล</tspan><tspan x="396" y="347" textLength="161.49" lengthAdjust="spacingAndGlyphs">การทำงานที่สัญญา</tspan></text></g><path d="M508 257.5 L527 257.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="536" y="131" width="216" height="253" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="536" y="131" width="216" height="7" fill="#24463e"/><text x="644" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="644" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="219" textLength="173.82" lengthAdjust="spacingAndGlyphs">คำสั่งซื้อผู้ขาย</tspan></text><text x="644" y="269" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="269" textLength="166.95" lengthAdjust="spacingAndGlyphs">ตรงรุ่นและจำนวน</tspan><tspan x="644" y="303" textLength="67.2" lengthAdjust="spacingAndGlyphs">ที่อนุมัติ</tspan></text></g><path d="M756 257.5 L775 257.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="784" y="131" width="216" height="253" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="784" y="131" width="216" height="7" fill="#006f6b"/><text x="892" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="892" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="219" textLength="161.74" lengthAdjust="spacingAndGlyphs">รับมอบข้อมูล</tspan><tspan x="892" y="263" textLength="49.42" lengthAdjust="spacingAndGlyphs">แล้ว</tspan></text><text x="892" y="313" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="313" textLength="134.4" lengthAdjust="spacingAndGlyphs">ผู้รับผิดชอบรับ</tspan><tspan x="892" y="347" textLength="131.67" lengthAdjust="spacingAndGlyphs">ทราบเรื่องค้าง</tspan></text></g></svg>
