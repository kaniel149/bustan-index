<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">แยกตามความต้องการ ไม่เหมารวมคน</title><desc id="desc">คำถามสำหรับวิลลา รีสอร์ต และร้านอาหารนำไปสู่ความต้องการที่ยืนยันแทนการเหมารวมลูกค้า</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="494.83" lengthAdjust="spacingAndGlyphs">แยกตามความต้องการ ไม่เหมารวมคน</tspan></text><g class="diagram-card" data-node="0"><rect x="40" y="131" width="216" height="253" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="131" width="216" height="7" fill="#24463e"/><text x="148" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="148" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="219" textLength="65.99" lengthAdjust="spacingAndGlyphs">วิลลา</tspan></text><text x="148" y="269" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="269" textLength="159.81" lengthAdjust="spacingAndGlyphs">ถามการเข้าพักและ</tspan><tspan x="148" y="303" textLength="100.17" lengthAdjust="spacingAndGlyphs">โหลดสำคัญ</tspan></text></g><g class="diagram-card" data-node="1"><rect x="288" y="131" width="216" height="253" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="288" y="131" width="216" height="7" fill="#006f6b"/><text x="396" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="396" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="219" textLength="89.86" lengthAdjust="spacingAndGlyphs">รีสอร์ต</tspan></text><text x="396" y="269" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="269" textLength="171.57" lengthAdjust="spacingAndGlyphs">ถามงานบริการแขก</tspan><tspan x="396" y="303" textLength="92.4" lengthAdjust="spacingAndGlyphs">และมิเตอร์</tspan></text></g><g class="diagram-card" data-node="2"><rect x="536" y="131" width="216" height="253" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="536" y="131" width="216" height="7" fill="#24463e"/><text x="644" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="644" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="219" textLength="126.08" lengthAdjust="spacingAndGlyphs">ร้านอาหาร</tspan></text><text x="644" y="269" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="269" textLength="160.23" lengthAdjust="spacingAndGlyphs">ถามเวลาให้บริการ</tspan><tspan x="644" y="303" textLength="122.22" lengthAdjust="spacingAndGlyphs">และผลกระทบ</tspan></text></g><g class="diagram-card" data-node="3"><rect x="784" y="131" width="216" height="253" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="784" y="131" width="216" height="7" fill="#006f6b"/><text x="892" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="892" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="219" textLength="167.92" lengthAdjust="spacingAndGlyphs">ความต้องการ</tspan><tspan x="892" y="263" textLength="89.86" lengthAdjust="spacingAndGlyphs">ที่ยืนยัน</tspan></text><text x="892" y="313" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="313" textLength="161.28" lengthAdjust="spacingAndGlyphs">ยืนยันคำตอบกับผู้</tspan><tspan x="892" y="347" textLength="127.05" lengthAdjust="spacingAndGlyphs">เกี่ยวข้องจริง</tspan></text></g></svg>
