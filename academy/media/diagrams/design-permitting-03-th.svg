<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="729" viewBox="0 0 1040 729" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">ตรวจคัดกรองแรงดันในอากาศเย็น</title><desc id="desc">แท่งแรงดันสำหรับฝึกเปรียบเทียบสิบเอ็ดแผงที่ 573.1 โวลต์ ขีดจำกัดสมมติ 600 โวลต์ และสิบสองแผงที่ 625.2 โวลต์</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="459.26" lengthAdjust="spacingAndGlyphs">ตรวจคัดกรองแรงดันในอากาศเย็น</tspan></text><g class="diagram-bar" data-node="0"><text x="40" y="158" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="158" textLength="88.51" lengthAdjust="spacingAndGlyphs">11 แผง</tspan></text><text x="40" y="201" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="201" textLength="234.29" lengthAdjust="spacingAndGlyphs">573.1 โวลต์ · ตัวอย่างฝึก</tspan></text><rect x="40" y="225" width="960" height="28" rx="3" fill="#dedfce"/><rect x="40" y="225" width="880" height="28" rx="3" fill="#24463e"/><text x="40" y="284" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="284" textLength="334.74" lengthAdjust="spacingAndGlyphs">11 × 52.1 โวลต์ ยังต้องตรวจด้านอื่น</tspan></text></g><g class="diagram-bar" data-node="1"><text x="40" y="354" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="354" textLength="209.76" lengthAdjust="spacingAndGlyphs">ขีดจำกัดตัวอย่าง</tspan></text><text x="40" y="397" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="397" textLength="216.9" lengthAdjust="spacingAndGlyphs">600 โวลต์ · ตัวอย่างฝึก</tspan></text><rect x="40" y="421" width="960" height="28" rx="3" fill="#dedfce"/><rect x="40" y="421" width="921.31" height="28" rx="3" fill="#006f6b"/><text x="40" y="480" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="480" textLength="489.09" lengthAdjust="spacingAndGlyphs">ค่าสูงสุดของอินเวอร์เตอร์สมมติ ไม่ใช่ค่ามาตรฐานทั่วไป</tspan></text></g><g class="diagram-bar" data-node="2"><text x="40" y="550" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="550" textLength="88.51" lengthAdjust="spacingAndGlyphs">12 แผง</tspan></text><text x="40" y="593" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="593" textLength="234.29" lengthAdjust="spacingAndGlyphs">625.2 โวลต์ · ตัวอย่างฝึก</tspan></text><rect x="40" y="617" width="960" height="28" rx="3" fill="#dedfce"/><rect x="40" y="617" width="960" height="28" rx="3" fill="#24463e"/><text x="40" y="676" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="676" textLength="340.83" lengthAdjust="spacingAndGlyphs">12 × 52.1 โวลต์ เกินขีดจำกัดตัวอย่าง</tspan></text></g></svg>
