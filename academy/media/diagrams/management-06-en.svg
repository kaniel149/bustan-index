agram-card" data-node="2"><rect x="536" y="127" width="216" height="338" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="536" y="127" width="216" height="7" fill="#24463e"/><text x="644" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="644" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="212" textLength="104.54" lengthAdjust="spacingAndGlyphs">Reserve</tspan><tspan x="644" y="252" textLength="88.93" lengthAdjust="spacingAndGlyphs">service</tspan><tspan x="644" y="292" textLength="126.42" lengthAdjust="spacingAndGlyphs">headroom</tspan></text><text x="644" y="338" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="338" textLength="144.77" lengthAdjust="spacingAndGlyphs">Include existing</tspan><tspan x="644" y="369" textLength="159.96" lengthAdjust="spacingAndGlyphs">customers, travel</tspan><tspan x="644" y="400" textLength="35.03" lengthAdjust="spacingAndGlyphs">and</tspan><tspan x="644" y="431" textLength="137.74" lengthAdjust="spacingAndGlyphs">documentation</tspan></text></g><path d="M756 296 L775 296" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="784" y="127" width="216" height="338" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="784" y="127" width="216" height="7" fill="#006f6b"/><text x="892" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="892" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="212" textLength="151.41" lengthAdjust="spacingAndGlyphs">Commit and</tspan><tspan x="892" y="252" textLength="109.23" lengthAdjust="spacingAndGlyphs">measure</tspan></text><text x="892" y="298" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="298" textLength="130.73" lengthAdjust="spacingAndGlyphs">Track delivery</tspan><tspan x="892" y="329" textLength="116.8" lengthAdjust="spacingAndGlyphs">quality, cash</tspan><tspan x="892" y="360" textLength="127.28" lengthAdjust="spacingAndGlyphs">exposure and</tspan><tspan x="892" y="391" textLength="71.19" lengthAdjust="spacingAndGlyphs">lessons</tspan></text></g></svg>
