<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1065" viewBox="0 0 480 1065" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">จากอุปกรณ์ติดตั้งสู่ส่งมอบ</title><desc id="desc">สี่ขั้นส่งมอบเชื่อมอุปกรณ์จริง ผลทดสอบเฉพาะเครื่อง การปิดงานค้าง และความรู้เจ้าของ</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="305.82" lengthAdjust="spacingAndGlyphs">จากอุปกรณ์ติดตั้งสู่ส่งมอบ</tspan></text><g class="diagram-card" data-node="0"><rect x="28" y="125" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="125" width="424" height="7" fill="#24463e"/><text x="240" y="164" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="164" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="213" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="213" textLength="215.65" lengthAdjust="spacingAndGlyphs">ยืนยันอุปกรณ์จริง</tspan></text><text x="240" y="264" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="264" textLength="346.72" lengthAdjust="spacingAndGlyphs">จับคู่รุ่น หมายเลขเครื่อง และตำแหน่ง</tspan></text></g><path d="M240 309 L240 334" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="28" y="343" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="343" width="424" height="7" fill="#006f6b"/><text x="240" y="382" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="382" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="240" y="431" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="431" textLength="241.21" lengthAdjust="spacingAndGlyphs">แนบหลักฐานทดสอบ</tspan></text><text x="240" y="482" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="482" textLength="293.92" lengthAdjust="spacingAndGlyphs">เชื่อมผลกับอุปกรณ์และฉบับจริง</tspan></text></g><path d="M240 527 L240 552" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="28" y="561" width="424" height="213" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="561" width="424" height="7" fill="#24463e"/><text x="240" y="600" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="600" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="240" y="649" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="649" textLength="179.99" lengthAdjust="spacingAndGlyphs">ปิดรายการค้าง</tspan></text><text x="240" y="700" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="700" textLength="369.16" lengthAdjust="spacingAndGlyphs">แยกข้อหยุดงานสำคัญจากงานคงเหลือที่</tspan><tspan x="240" y="736" textLength="56.32" lengthAdjust="spacingAndGlyphs">ตกลง</tspan></text></g><path d="M240 778 L240 803" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="28" y="812" width="424" height="213" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="812" width="424" height="7" fill="#006f6b"/><text x="240" y="851" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="851" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="240" y="900" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="900" textLength="155.84" lengthAdjust="spacingAndGlyphs">ส่งต่อความรู้</tspan></text><text x="240" y="951" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="951" textLength="355.08" lengthAdjust="spacingAndGlyphs">มอบเอกสารตามติดตั้งจริงและผู้ติดต่อ</tspan><tspan x="240" y="987" textLength="65.78" lengthAdjust="spacingAndGlyphs">บริการ</tspan></text></g></svg>
