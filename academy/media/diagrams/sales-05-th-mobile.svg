<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1007" viewBox="0 0 480 1007" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">นำรายได้ส่งออกเข้าแบบจำลองได้หรือยัง?</title><desc id="desc">รายได้ส่งออกขึ้นกับหลักฐานของสถานที่นั้น ไม่ใช่เพียงมีประกาศทั่วไป</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="388.56" lengthAdjust="spacingAndGlyphs">นำรายได้ส่งออกเข้าแบบจำลองได้</tspan><tspan x="240" y="121" textLength="108.16" lengthAdjust="spacingAndGlyphs">หรือยัง?</tspan></text><g class="diagram-card" data-node="0"><rect x="30" y="167" width="420" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="30" y="167" width="420" height="7" fill="#24463e"/><text x="240" y="206" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="206" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="255" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="255" textLength="222.39" lengthAdjust="spacingAndGlyphs">มีหลักฐานหรือไม่?</tspan></text><text x="240" y="306" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="306" textLength="364.32" lengthAdjust="spacingAndGlyphs">ตรวจบัญชี การอนุมัติ และเงื่อนไขรับซื้อ</tspan></text></g><path d="M27 257 H16 V881" stroke="#006f6b" stroke-width="3" fill="none"/><path d="M16 469 L48 469" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="56" y="379" width="396" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="56" y="379" width="396" height="7" fill="#006f6b"/><text x="254" y="418" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="418" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="254" y="467" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="467" textLength="176.06" lengthAdjust="spacingAndGlyphs">มีเพียงประกาศ</tspan></text><text x="254" y="518" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="518" textLength="269.28" lengthAdjust="spacingAndGlyphs">ยังไม่ยืนยันสิทธิของสถานที่นี้</tspan></text></g><path d="M16 675 L48 675" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="56" y="585" width="396" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="56" y="585" width="396" height="7" fill="#24463e"/><text x="254" y="624" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="624" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="254" y="673" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="673" textLength="259.18" lengthAdjust="spacingAndGlyphs">สัญญาที่ตรวจสอบแล้ว</tspan></text><text x="254" y="724" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="724" textLength="188.1" lengthAdjust="spacingAndGlyphs">ใช้เงื่อนไขที่มีผลจริง</tspan></text></g><path d="M16 881 L48 881" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="56" y="791" width="396" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="56" y="791" width="396" height="7" fill="#006f6b"/><text x="254" y="830" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="830" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="254" y="879" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="879" textLength="208.07" lengthAdjust="spacingAndGlyphs">รายได้ยังไม่ยืนยัน</tspan></text><text x="254" y="930" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="930" textLength="273.68" lengthAdjust="spacingAndGlyphs">ไม่รวมในกรณีฐาน ติดตามแยก</tspan></text></g></svg>
