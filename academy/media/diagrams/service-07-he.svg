<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="881" viewBox="0 0 1040 881" lang="he" xml:lang="he" role="img" aria-labelledby="title desc"><title id="title">תקציב פאזה תחת עומס</title><desc id="desc">עמודות משוות תקציב 32 אמפר, בניין 20, בקשת רכב 16 וסך 36.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="332.59" lengthAdjust="spacingAndGlyphs">תקציב פאזה תחת עומס</tspan></text><g class="diagram-bar" data-node="0"><text x="1000" y="154" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="154" textLength="192.35" lengthAdjust="spacingAndGlyphs">תקציב בדוגמה</tspan></text><text x="1000" y="193" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="193" textLength="229.67" lengthAdjust="spacingAndGlyphs">32 אמפר, דוגמת הדרכה</tspan></text><rect x="40" y="214" width="960" height="28" rx="3" fill="#dedfce"/><rect x="146.67" y="214" width="853.33" height="28" rx="3" fill="#24463e"/><text x="1000" y="273" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="273" textLength="317.52" lengthAdjust="spacingAndGlyphs">מגבלת הדרכה נתונה לפאזה זו.</tspan></text></g><g class="diagram-bar" data-node="1"><text x="1000" y="340" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="340" textLength="165.95" lengthAdjust="spacingAndGlyphs">דרישה קיימת</tspan></text><text x="1000" y="379" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="379" textLength="229.67" lengthAdjust="spacingAndGlyphs">20 אמפר, דוגמת הדרכה</tspan></text><rect x="40" y="400" width="960" height="28" rx="3" fill="#dedfce"/><rect x="466.67" y="400" width="533.33" height="28" rx="3" fill="#006f6b"/><text x="1000" y="459" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="459" textLength="291.69" lengthAdjust="spacingAndGlyphs">עומס בניין לפני בקשת הרכב.</tspan></text></g><g class="diagram-bar" data-node="2"><text x="1000" y="526" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="526" textLength="153.88" lengthAdjust="spacingAndGlyphs">בקשת הרכב</tspan></text><text x="1000" y="565" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="565" textLength="229.67" lengthAdjust="spacingAndGlyphs">16 אמפר, דוגמת הדרכה</tspan></text><rect x="40" y="586" width="960" height="28" rx="3" fill="#dedfce"/><rect x="573.33" y="586" width="426.67" height="28" rx="3" fill="#24463e"/><text x="1000" y="645" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="645" textLength="309.75" lengthAdjust="spacingAndGlyphs">זרם מבוקש, לא אספקה מובטחת.</tspan></text></g><g class="diagram-bar" data-node="3"><text x="1000" y="712" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="712" textLength="119.34" lengthAdjust="spacingAndGlyphs">סך מבוקש</tspan></text><text x="1000" y="751" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="751" textLength="229.67" lengthAdjust="spacingAndGlyphs">36 אמפר, דוגמת הדרכה</tspan></text><rect x="40" y="772" width="960" height="28" rx="3" fill="#dedfce"/><rect x="40" y="772" width="960" height="28" rx="3" fill="#006f6b"/><text x="1000" y="831" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="831" textLength="209.12" lengthAdjust="spacingAndGlyphs">20 + 16 = 36 מעל 32.</tspan></text></g></svg>
