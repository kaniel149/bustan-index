<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1033" viewBox="0 0 480 1033" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Why is charge low?</title><desc id="desc">A low-current observation branches to input conditions, control limitation and a device-fault hypothesis.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="241.17" lengthAdjust="spacingAndGlyphs">Why is charge low?</tspan></text><g class="diagram-card" data-node="0"><rect x="30" y="121" width="420" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="30" y="121" width="420" height="7" fill="#24463e"/><text x="240" y="160" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="160" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="206" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="206" textLength="292.57" lengthAdjust="spacingAndGlyphs">Low current observed?</tspan></text><text x="240" y="253" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="253" textLength="338.93" lengthAdjust="spacingAndGlyphs">Interpret the operating state before</tspan><tspan x="240" y="285" textLength="165.22" lengthAdjust="spacingAndGlyphs">assigning a fault.</tspan></text></g><path d="M27 220 H16 V898" stroke="#006f6b" stroke-width="3" fill="none"/><path d="M16 450 L48 450" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="56" y="351" width="396" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="56" y="351" width="396" height="7" fill="#006f6b"/><text x="254" y="390" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="390" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="254" y="436" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="436" textLength="215.46" lengthAdjust="spacingAndGlyphs">Input constrained</tspan></text><text x="254" y="483" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="483" textLength="333.94" lengthAdjust="spacingAndGlyphs">Check relevant environmental and</tspan><tspan x="254" y="515" textLength="148.06" lengthAdjust="spacingAndGlyphs">input evidence.</tspan></text></g><path d="M16 674 L48 674" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="56" y="575" width="396" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="56" y="575" width="396" height="7" fill="#24463e"/><text x="254" y="614" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="614" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="254" y="660" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="660" textLength="209.14" lengthAdjust="spacingAndGlyphs">Control limitation</tspan></text><text x="254" y="707" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="707" textLength="316.87" lengthAdjust="spacingAndGlyphs">Full battery or approved external</tspan><tspan x="254" y="739" textLength="185.99" lengthAdjust="spacingAndGlyphs">limit may explain it.</tspan></text></g><path d="M16 898 L48 898" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="56" y="799" width="396" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="56" y="799" width="396" height="7" fill="#006f6b"/><text x="254" y="838" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="838" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="254" y="884" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="884" textLength="288.83" lengthAdjust="spacingAndGlyphs">Device fault hypothesis</tspan></text><text x="254" y="931" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="931" textLength="303.56" lengthAdjust="spacingAndGlyphs">Seek model-specific diagnostic</tspan><tspan x="254" y="963" textLength="289.94" lengthAdjust="spacingAndGlyphs">evidence before replacement.</tspan></text></g></svg>
