<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="454" viewBox="0 0 1040 454" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">อ่านข้อมูลสี่จุดในสเปก</title><desc id="desc">เกณฑ์เปรียบเทียบสี่ด้าน: กำลังพิกัด สัมประสิทธิ์อุณหภูมิ ขนาดและแรงกระทำ เงื่อนไขรับประกัน</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="291.1" lengthAdjust="spacingAndGlyphs">อ่านข้อมูลสี่จุดในสเปก</tspan></text><g class="diagram-card" data-node="0"><rect x="40" y="131" width="216" height="287" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="131" width="216" height="7" fill="#24463e"/><text x="148" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="148" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="219" textLength="125.8" lengthAdjust="spacingAndGlyphs">กำลังพิกัด</tspan></text><text x="148" y="269" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="269" textLength="148.26" lengthAdjust="spacingAndGlyphs">วัดภายใต้เงื่อนไข</tspan><tspan x="148" y="303" textLength="103.11" lengthAdjust="spacingAndGlyphs">ทดสอบระบุ</tspan></text></g><g class="diagram-card" data-node="1"><rect x="288" y="131" width="216" height="287" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="288" y="131" width="216" height="7" fill="#006f6b"/><text x="396" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="396" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="219" textLength="137.87" lengthAdjust="spacingAndGlyphs">สัมประสิทธิ์</tspan><tspan x="396" y="263" textLength="89.86" lengthAdjust="spacingAndGlyphs">อุณหภูมิ</tspan></text><text x="396" y="313" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="313" textLength="162.96" lengthAdjust="spacingAndGlyphs">ผลผลิตเปลี่ยนตาม</tspan><tspan x="396" y="347" textLength="113.61" lengthAdjust="spacingAndGlyphs">อุณหภูมิเซลล์</tspan></text></g><g class="diagram-card" data-node="2"><rect x="536" y="131" width="216" height="287" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="536" y="131" width="216" height="7" fill="#24463e"/><text x="644" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="644" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="219" textLength="158.93" lengthAdjust="spacingAndGlyphs">ขนาดและแรง</tspan><tspan x="644" y="263" textLength="83.96" lengthAdjust="spacingAndGlyphs">กระทำ</tspan></text><text x="644" y="313" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="313" textLength="137.13" lengthAdjust="spacingAndGlyphs">ตรวจเทียบแบบ</tspan><tspan x="644" y="347" textLength="103.11" lengthAdjust="spacingAndGlyphs">หลังคาจริง</tspan></text></g><g class="diagram-card" data-node="3"><rect x="784" y="131" width="216" height="287" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="784" y="131" width="216" height="7" fill="#006f6b"/><text x="892" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="892" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="219" textLength="124.11" lengthAdjust="spacingAndGlyphs">เงื่อนไขรับ</tspan><tspan x="892" y="263" textLength="83.96" lengthAdjust="spacingAndGlyphs">ประกัน</tspan></text><text x="892" y="313" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="313" textLength="81.9" lengthAdjust="spacingAndGlyphs">สินค้าและ</tspan><tspan x="892" y="347" textLength="139.02" lengthAdjust="spacingAndGlyphs">ประสิทธิภาพรับ</tspan><tspan x="892" y="381" textLength="125.58" lengthAdjust="spacingAndGlyphs">ประกันต่างกัน</tspan></text></g></svg>
