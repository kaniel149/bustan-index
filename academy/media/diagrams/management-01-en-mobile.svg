<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1105" viewBox="0 0 480 1105" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Manage dependencies across the project</title><desc id="desc">A project flow moves from deliverables to predecessors, execution coordination and evidence-based milestones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="405.98" lengthAdjust="spacingAndGlyphs">Manage dependencies across the</tspan><tspan x="240" y="117" textLength="81.15" lengthAdjust="spacingAndGlyphs">project</tspan></text><g class="diagram-card" data-node="0"><rect x="28" y="159" width="424" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="159" width="424" height="7" fill="#24463e"/><text x="240" y="198" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="198" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="244" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="244" textLength="238.82" lengthAdjust="spacingAndGlyphs">Define deliverables</tspan></text><text x="240" y="291" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="291" textLength="352.33" lengthAdjust="spacingAndGlyphs">Make scope and acceptance criteria</tspan><tspan x="240" y="323" textLength="67.23" lengthAdjust="spacingAndGlyphs">explicit</tspan></text></g><path d="M240 361 L240 386" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="28" y="395" width="424" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="395" width="424" height="7" fill="#006f6b"/><text x="240" y="434" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="434" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="240" y="480" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="480" textLength="280.97" lengthAdjust="spacingAndGlyphs">Connect predecessors</tspan></text><text x="240" y="527" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="527" textLength="349.91" lengthAdjust="spacingAndGlyphs">Identify what each activity must wait</tspan><tspan x="240" y="559" textLength="25.67" lengthAdjust="spacingAndGlyphs">for</tspan></text></g><path d="M240 597 L240 622" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="28" y="631" width="424" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="631" width="424" height="7" fill="#24463e"/><text x="240" y="670" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="670" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="240" y="716" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="716" textLength="265.38" lengthAdjust="spacingAndGlyphs">Coordinate execution</tspan></text><text x="240" y="763" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="763" textLength="337.68" lengthAdjust="spacingAndGlyphs">Track owners, actual progress and</tspan><tspan x="240" y="795" textLength="196.92" lengthAdjust="spacingAndGlyphs">changed constraints</tspan></text></g><path d="M240 833 L240 858" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="28" y="867" width="424" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="867" width="424" height="7" fill="#006f6b"/><text x="240" y="906" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="906" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="240" y="952" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="952" textLength="213.83" lengthAdjust="spacingAndGlyphs">Verify milestones</tspan></text><text x="240" y="999" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="999" textLength="313.21" lengthAdjust="spacingAndGlyphs">Close with agreed evidence and</tspan><tspan x="240" y="1031" textLength="243.58" lengthAdjust="spacingAndGlyphs">remaining-action records</tspan></text></g></svg>
