<svg xmlns="http://www.w3.org/2000/svg" width="480" height="863" viewBox="0 0 480 863" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">A phase budget under pressure</title><desc id="desc">Bars compare 32 A budget, 20 A building demand, 16 A EV request and 36 A total.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="378.99" lengthAdjust="spacingAndGlyphs">A phase budget under pressure</tspan></text><g class="diagram-bar" data-node="0"><text x="28" y="146" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="146" textLength="189.38" lengthAdjust="spacingAndGlyphs">Scenario budget</tspan></text><text x="28" y="184" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="184" textLength="207.11" lengthAdjust="spacingAndGlyphs">32 A, training example</tspan></text><rect x="28" y="205" width="424" height="28" rx="3" fill="#dedfce"/><rect x="28" y="205" width="376.89" height="28" rx="3" fill="#24463e"/><text x="28" y="264" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="264" textLength="337.55" lengthAdjust="spacingAndGlyphs">Supplied training limit for this phase.</tspan></text></g><g class="diagram-bar" data-node="1"><text x="28" y="329" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="329" textLength="192.24" lengthAdjust="spacingAndGlyphs">Existing demand</tspan></text><text x="28" y="367" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="367" textLength="207.11" lengthAdjust="spacingAndGlyphs">20 A, training example</tspan></text><rect x="28" y="388" width="424" height="28" rx="3" fill="#dedfce"/><rect x="28" y="388" width="235.56" height="28" rx="3" fill="#006f6b"/><text x="28" y="447" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="447" textLength="336.44" lengthAdjust="spacingAndGlyphs">Building load before the EV request.</tspan></text></g><g class="diagram-bar" data-node="2"><text x="28" y="512" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="512" textLength="128.67" lengthAdjust="spacingAndGlyphs">EV request</tspan></text><text x="28" y="550" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="550" textLength="207.11" lengthAdjust="spacingAndGlyphs">16 A, training example</tspan></text><rect x="28" y="571" width="424" height="28" rx="3" fill="#dedfce"/><rect x="28" y="571" width="188.44" height="28" rx="3" fill="#24463e"/><text x="28" y="630" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="630" textLength="409.96" lengthAdjust="spacingAndGlyphs">Requested current, not guaranteed delivery.</tspan></text></g><g class="diagram-bar" data-node="3"><text x="28" y="695" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="695" textLength="182.16" lengthAdjust="spacingAndGlyphs">Requested total</tspan></text><text x="28" y="733" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="733" textLength="207.11" lengthAdjust="spacingAndGlyphs">36 A, training example</tspan></text><rect x="28" y="754" width="424" height="28" rx="3" fill="#dedfce"/><rect x="28" y="754" width="424" height="28" rx="3" fill="#006f6b"/><text x="28" y="813" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="813" textLength="286.15" lengthAdjust="spacingAndGlyphs">20 + 16 = 36 A exceeds 32 A.</tspan></text></g></svg>
