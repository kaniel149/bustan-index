<svg xmlns="http://www.w3.org/2000/svg" width="480" height="777" viewBox="0 0 480 777" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Where does conversion happen?</title><desc id="desc">AC conversion inside the vehicle is compared with external DC conversion and shared system constraints.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="403.54" lengthAdjust="spacingAndGlyphs">Where does conversion happen?</tspan></text><g class="diagram-card" data-node="0"><rect x="28" y="121" width="424" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="121" width="424" height="7" fill="#24463e"/><text x="240" y="160" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="160" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="206" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="206" textLength="154.55" lengthAdjust="spacingAndGlyphs">AC charging</tspan></text><text x="240" y="253" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="253" textLength="308.75" lengthAdjust="spacingAndGlyphs">The vehicle’s onboard charger</tspan><tspan x="240" y="285" textLength="276.54" lengthAdjust="spacingAndGlyphs">converts supplied AC to DC.</tspan></text></g><g class="diagram-card" data-node="1"><rect x="28" y="339" width="424" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="339" width="424" height="7" fill="#006f6b"/><text x="240" y="378" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="378" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="240" y="424" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="424" textLength="156.1" lengthAdjust="spacingAndGlyphs">DC charging</tspan></text><text x="240" y="471" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="471" textLength="369.4" lengthAdjust="spacingAndGlyphs">External charging equipment provides</tspan><tspan x="240" y="503" textLength="275.33" lengthAdjust="spacingAndGlyphs">controlled DC to the vehicle.</tspan></text></g><g class="diagram-card" data-node="2"><rect x="28" y="557" width="424" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="557" width="424" height="7" fill="#24463e"/><text x="240" y="596" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="596" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="240" y="642" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="642" textLength="251.54" lengthAdjust="spacingAndGlyphs">Whole-system limits</tspan></text><text x="240" y="689" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="689" textLength="338.95" lengthAdjust="spacingAndGlyphs">Vehicle, equipment, connector and</tspan><tspan x="240" y="721" textLength="237.38" lengthAdjust="spacingAndGlyphs">site must be compatible.</tspan></text></g></svg>
