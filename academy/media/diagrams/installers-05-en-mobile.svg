<svg xmlns="http://www.w3.org/2000/svg" width="480" height="977" viewBox="0 0 480 977" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Different protective duties</title><desc id="desc">Four parallel cards distinguish overcurrent, residual current, surge protection and bonding/earthing.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="306.69" lengthAdjust="spacingAndGlyphs">Different protective duties</tspan></text><g class="diagram-card" data-node="0"><rect x="28" y="121" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="121" width="424" height="7" fill="#24463e"/><text x="240" y="160" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="160" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="206" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="206" textLength="148.23" lengthAdjust="spacingAndGlyphs">Overcurrent</tspan></text><text x="240" y="253" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="253" textLength="357.26" lengthAdjust="spacingAndGlyphs">Review ratings and fault interruption.</tspan></text></g><g class="diagram-card" data-node="1"><rect x="28" y="321" width="424" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="321" width="424" height="7" fill="#006f6b"/><text x="240" y="360" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="360" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="240" y="406" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="406" textLength="204.48" lengthAdjust="spacingAndGlyphs">Residual current</tspan></text><text x="240" y="453" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="453" textLength="326.66" lengthAdjust="spacingAndGlyphs">Exact product and system govern</tspan><tspan x="240" y="485" textLength="92.97" lengthAdjust="spacingAndGlyphs">selection.</tspan></text></g><g class="diagram-card" data-node="2"><rect x="28" y="539" width="424" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="539" width="424" height="7" fill="#24463e"/><text x="240" y="578" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="578" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="240" y="624" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="624" textLength="206.08" lengthAdjust="spacingAndGlyphs">Surge protection</tspan></text><text x="240" y="671" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="671" textLength="287.5" lengthAdjust="spacingAndGlyphs">Coordinate with the approved</tspan><tspan x="240" y="703" textLength="173.73" lengthAdjust="spacingAndGlyphs">protection design.</tspan></text></g><g class="diagram-card" data-node="3"><rect x="28" y="757" width="424" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="757" width="424" height="7" fill="#006f6b"/><text x="240" y="796" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="796" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="240" y="842" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="842" textLength="267.04" lengthAdjust="spacingAndGlyphs">Bonding and earthing</tspan></text><text x="240" y="889" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="889" textLength="289.98" lengthAdjust="spacingAndGlyphs">Verify intended paths in every</tspan><tspan x="240" y="921" textLength="159.06" lengthAdjust="spacingAndGlyphs">operating mode.</tspan></text></g></svg>
