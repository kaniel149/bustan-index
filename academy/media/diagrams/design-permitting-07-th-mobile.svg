<svg xmlns="http://www.w3.org/2000/svg" width="480" height="826" viewBox="0 0 480 826" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">หกการตัดสินใจ หลักฐานแยกกัน</title><desc id="desc">สามกลุ่มแยกการเชื่อมต่อและการควบคุม สถานะการขายและ ERC และหลักฐานอาคารกับการตรวจ</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="363.15" lengthAdjust="spacingAndGlyphs">หกการตัดสินใจ หลักฐานแยกกัน</tspan></text><g class="diagram-card" data-node="0"><rect x="28" y="125" width="424" height="213" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="125" width="424" height="7" fill="#24463e"/><text x="240" y="164" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="164" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="213" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="213" textLength="229.41" lengthAdjust="spacingAndGlyphs">กริดและการทำงาน</tspan></text><text x="240" y="264" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="264" textLength="352.02" lengthAdjust="spacingAndGlyphs">อนุญาตเชื่อมต่อ PEA และควบคุมไม่ส่ง</tspan><tspan x="240" y="300" textLength="167.64" lengthAdjust="spacingAndGlyphs">ออกเมื่อเกี่ยวข้อง</tspan></text></g><g class="diagram-card" data-node="1"><rect x="28" y="358" width="424" height="213" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="358" width="424" height="7" fill="#006f6b"/><text x="240" y="397" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="397" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="240" y="446" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="446" textLength="319.55" lengthAdjust="spacingAndGlyphs">การขายและสถานะพลังงาน</tspan></text><text x="240" y="497" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="497" textLength="311.3" lengthAdjust="spacingAndGlyphs">ข้อตกลงขายไฟ และใบอนุญาตหรือ</tspan><tspan x="240" y="533" textLength="232.78" lengthAdjust="spacingAndGlyphs">กระบวนการยกเว้น ERC</tspan></text></g><g class="diagram-card" data-node="2"><rect x="28" y="591" width="424" height="213" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="591" width="424" height="7" fill="#24463e"/><text x="240" y="630" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="630" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="240" y="679" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="679" textLength="241.49" lengthAdjust="spacingAndGlyphs">อาคารและการตรวจ</tspan></text><text x="240" y="730" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="730" textLength="355.08" lengthAdjust="spacingAndGlyphs">การรับรองอาคารและวิชาชีพ รวมการ</tspan><tspan x="240" y="766" textLength="128.48" lengthAdjust="spacingAndGlyphs">ตรวจรับไฟฟ้า</tspan></text></g></svg>
