<svg xmlns="http://www.w3.org/2000/svg" width="480" height="815" viewBox="0 0 480 815" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Three independent electrical checks</title><desc id="desc">Three parallel checks compare current capacity, voltage drop and fault clearing. Passing one does not establish the others.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="341.27" lengthAdjust="spacingAndGlyphs">Three independent electrical</tspan><tspan x="240" y="117" textLength="84.15" lengthAdjust="spacingAndGlyphs">checks</tspan></text><g class="diagram-card" data-node="0"><rect x="28" y="159" width="424" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="159" width="424" height="7" fill="#24463e"/><text x="240" y="198" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="198" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="244" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="244" textLength="163.87" lengthAdjust="spacingAndGlyphs">Carry current</tspan></text><text x="240" y="291" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="291" textLength="368.19" lengthAdjust="spacingAndGlyphs">Installation conditions affect allowable</tspan><tspan x="240" y="323" textLength="173.69" lengthAdjust="spacingAndGlyphs">conductor loading</tspan></text></g><g class="diagram-card" data-node="1"><rect x="28" y="377" width="424" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="377" width="424" height="7" fill="#006f6b"/><text x="240" y="416" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="416" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="240" y="462" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="462" textLength="221.72" lengthAdjust="spacingAndGlyphs">Limit voltage drop</tspan></text><text x="240" y="509" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="509" textLength="374.4" lengthAdjust="spacingAndGlyphs">Length and resistance affect operating</tspan><tspan x="240" y="541" textLength="62.35" lengthAdjust="spacingAndGlyphs">losses</tspan></text></g><g class="diagram-card" data-node="2"><rect x="28" y="595" width="424" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="595" width="424" height="7" fill="#24463e"/><text x="240" y="634" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="634" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="240" y="680" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="680" textLength="142.06" lengthAdjust="spacingAndGlyphs">Clear faults</tspan></text><text x="240" y="727" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="727" textLength="347.45" lengthAdjust="spacingAndGlyphs">Protection and earthing must match</tspan><tspan x="240" y="759" textLength="206.76" lengthAdjust="spacingAndGlyphs">each operating mode</tspan></text></g></svg>
