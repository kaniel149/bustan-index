<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="421" viewBox="0 0 1040 421" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Where does conversion happen?</title><desc id="desc">AC conversion inside the vehicle is compared with external DC conversion and shared system constraints.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="465.63" lengthAdjust="spacingAndGlyphs">Where does conversion happen?</tspan></text><g class="diagram-card" data-node="0"><rect x="40" y="127" width="298.67" height="258" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="127" width="298.67" height="7" fill="#24463e"/><text x="189.33" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="189.33" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="189.33" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="189.33" y="212" textLength="154.55" lengthAdjust="spacingAndGlyphs">AC charging</tspan></text><text x="189.33" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="189.33" y="258" textLength="217.64" lengthAdjust="spacingAndGlyphs">The vehicle’s onboard</tspan><tspan x="189.33" y="289" textLength="240.51" lengthAdjust="spacingAndGlyphs">charger converts supplied</tspan><tspan x="189.33" y="320" textLength="94.65" lengthAdjust="spacingAndGlyphs">AC to DC.</tspan></text></g><g class="diagram-card" data-node="1"><rect x="370.67" y="127" width="298.67" height="258" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="370.67" y="127" width="298.67" height="7" fill="#006f6b"/><text x="520" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="520" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="212" textLength="156.1" lengthAdjust="spacingAndGlyphs">DC charging</tspan></text><text x="520" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="258" textLength="163.44" lengthAdjust="spacingAndGlyphs">External charging</tspan><tspan x="520" y="289" textLength="183.29" lengthAdjust="spacingAndGlyphs">equipment provides</tspan><tspan x="520" y="320" textLength="256.94" lengthAdjust="spacingAndGlyphs">controlled DC to the vehicle</tspan><tspan x="520" y="351" textLength="5.88" lengthAdjust="spacingAndGlyphs">.</tspan></text></g><g class="diagram-card" data-node="2"><rect x="701.33" y="127" width="298.67" height="258" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="701.33" y="127" width="298.67" height="7" fill="#24463e"/><text x="850.67" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="850.67" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="850.67" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="850.67" y="212" textLength="251.54" lengthAdjust="spacingAndGlyphs">Whole-system limits</tspan></text><text x="850.67" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="850.67" y="258" textLength="184.55" lengthAdjust="spacingAndGlyphs">Vehicle, equipment,</tspan><tspan x="850.67" y="289" textLength="252.29" lengthAdjust="spacingAndGlyphs">connector and site must be</tspan><tspan x="850.67" y="320" textLength="107.42" lengthAdjust="spacingAndGlyphs">compatible.</tspan></text></g></svg>
