<svg xmlns="http://www.w3.org/2000/svg" width="480" height="826" viewBox="0 0 480 826" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">พลังงาน กำลัง และโหมดทำงาน</title><desc id="desc">สามขอบเขตออกแบบแยกพลังงานใช้ได้ กำลังพร้อมกัน และโหมดกริดหรือสำรอง</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="365.04" lengthAdjust="spacingAndGlyphs">พลังงาน กำลัง และโหมดทำงาน</tspan></text><g class="diagram-card" data-node="0"><rect x="28" y="125" width="424" height="213" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="125" width="424" height="7" fill="#24463e"/><text x="240" y="164" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="164" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="213" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="213" textLength="137.87" lengthAdjust="spacingAndGlyphs">งบพลังงาน</tspan></text><text x="240" y="264" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="264" textLength="358.6" lengthAdjust="spacingAndGlyphs">พลังงานใช้ได้กำหนดระยะเวลาตามแบบ</tspan><tspan x="240" y="300" textLength="70.4" lengthAdjust="spacingAndGlyphs">จำลอง</tspan></text></g><g class="diagram-card" data-node="1"><rect x="28" y="358" width="424" height="213" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="358" width="424" height="7" fill="#006f6b"/><text x="240" y="397" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="397" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="240" y="446" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="446" textLength="179.71" lengthAdjust="spacingAndGlyphs">ขีดจำกัดกำลัง</tspan></text><text x="240" y="497" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="497" textLength="350.9" lengthAdjust="spacingAndGlyphs">โหลดพร้อมกันต้องอยู่ในความสามารถ</tspan><tspan x="240" y="533" textLength="112.64" lengthAdjust="spacingAndGlyphs">ของอุปกรณ์</tspan></text></g><g class="diagram-card" data-node="2"><rect x="28" y="591" width="424" height="213" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="591" width="424" height="7" fill="#24463e"/><text x="240" y="630" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="630" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="240" y="679" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="679" textLength="160.06" lengthAdjust="spacingAndGlyphs">ขอบเขตโหมด</tspan></text><text x="240" y="730" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="730" textLength="366.83" lengthAdjust="spacingAndGlyphs">ระบบกริด ไฟดับ และ EV ต้องมีหลักฐาน</tspan><tspan x="240" y="766" textLength="38.72" lengthAdjust="spacingAndGlyphs">แยก</tspan></text></g></svg>
