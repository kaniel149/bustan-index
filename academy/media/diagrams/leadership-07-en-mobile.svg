<svg xmlns="http://www.w3.org/2000/svg" width="480" height="959" viewBox="0 0 480 959" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Progress is more than paid</title><desc id="desc">Four distinct status categories compare installation, tested performance, required acceptance and contractual payment.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="323.32" lengthAdjust="spacingAndGlyphs">Progress is more than paid</tspan></text><g class="diagram-card" data-node="0"><rect x="28" y="121" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="121" width="424" height="7" fill="#24463e"/><text x="240" y="160" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="160" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="206" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="206" textLength="248.17" lengthAdjust="spacingAndGlyphs">Physical completion</tspan></text><text x="240" y="253" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="253" textLength="333.96" lengthAdjust="spacingAndGlyphs">Equipment installed against scope</tspan></text></g><g class="diagram-card" data-node="1"><rect x="28" y="321" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="321" width="424" height="7" fill="#006f6b"/><text x="240" y="360" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="360" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="240" y="406" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="406" textLength="260.67" lengthAdjust="spacingAndGlyphs">Verified performance</tspan></text><text x="240" y="453" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="453" textLength="364.61" lengthAdjust="spacingAndGlyphs">Required tests linked to actual assets</tspan></text></g><g class="diagram-card" data-node="2"><rect x="28" y="521" width="424" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="521" width="424" height="7" fill="#24463e"/><text x="240" y="560" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="560" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="240" y="606" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="606" textLength="265.38" lengthAdjust="spacingAndGlyphs">Required acceptance</tspan></text><text x="240" y="653" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="653" textLength="370.68" lengthAdjust="spacingAndGlyphs">Authority and client conditions tracked</tspan><tspan x="240" y="685" textLength="101.49" lengthAdjust="spacingAndGlyphs">separately</tspan></text></g><g class="diagram-card" data-node="3"><rect x="28" y="739" width="424" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="739" width="424" height="7" fill="#006f6b"/><text x="240" y="778" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="778" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="240" y="824" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="824" textLength="259.12" lengthAdjust="spacingAndGlyphs">Contractual payment</tspan></text><text x="240" y="871" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="871" textLength="356" lengthAdjust="spacingAndGlyphs">Payment follows the agreed contract</tspan><tspan x="240" y="903" textLength="94.14" lengthAdjust="spacingAndGlyphs">milestone</tspan></text></g></svg>
