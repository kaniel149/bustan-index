<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="410" viewBox="0 0 1040 410" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">สร้างคำอธิบายด้านเศรษฐศาสตร์</title><desc id="desc">ปริมาณพลังงานเข้าสู่วิธีคิดบิลที่ยืนยัน ต่อด้วยภาระเงินสดจริงและผลลัพธ์ลูกค้าที่มีเงื่อนไข</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="442.1" lengthAdjust="spacingAndGlyphs">สร้างคำอธิบายด้านเศรษฐศาสตร์</tspan></text><g class="diagram-card" data-node="0"><rect x="40" y="131" width="216" height="243" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="131" width="216" height="7" fill="#24463e"/><text x="148" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="148" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="219" textLength="155.84" lengthAdjust="spacingAndGlyphs">บัญชีพลังงาน</tspan></text><text x="148" y="269" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="269" textLength="165.48" lengthAdjust="spacingAndGlyphs">แยกใช้ตรง ซื้อจาก</tspan><tspan x="148" y="303" textLength="152.04" lengthAdjust="spacingAndGlyphs">กริด และส่วนเกิน</tspan></text></g><path d="M260 252.5 L279 252.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="288" y="131" width="216" height="243" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="288" y="131" width="216" height="7" fill="#006f6b"/><text x="396" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="396" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="219" textLength="107.83" lengthAdjust="spacingAndGlyphs">วิธีคิดบิล</tspan></text><text x="396" y="269" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="269" textLength="143.43" lengthAdjust="spacingAndGlyphs">ใช้อัตราค่าไฟและ</tspan><tspan x="396" y="303" textLength="146.58" lengthAdjust="spacingAndGlyphs">เงื่อนไขส่งออกที่</tspan><tspan x="396" y="337" textLength="90.72" lengthAdjust="spacingAndGlyphs">ตรวจแล้ว</tspan></text></g><path d="M508 252.5 L527 252.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="536" y="131" width="216" height="243" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="536" y="131" width="216" height="7" fill="#24463e"/><text x="644" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="644" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="219" textLength="140.12" lengthAdjust="spacingAndGlyphs">ภาระเงินสด</tspan></text><text x="644" y="269" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="269" textLength="166.95" lengthAdjust="spacingAndGlyphs">รวมต้นทุนจริงและ</tspan><tspan x="644" y="303" textLength="157.08" lengthAdjust="spacingAndGlyphs">การจ่ายตามสัญญา</tspan></text></g><path d="M756 252.5 L775 252.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="784" y="131" width="216" height="243" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="784" y="131" width="216" height="7" fill="#006f6b"/><text x="892" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="892" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="219" textLength="155.84" lengthAdjust="spacingAndGlyphs">ผลลัพธ์ลูกค้า</tspan></text><text x="892" y="269" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="269" textLength="152.46" lengthAdjust="spacingAndGlyphs">อธิบายสมมติฐาน</tspan><tspan x="892" y="303" textLength="145.95" lengthAdjust="spacingAndGlyphs">ช่วงผล และหลัก</tspan><tspan x="892" y="337" textLength="85.26" lengthAdjust="spacingAndGlyphs">ฐานที่ขาด</tspan></text></g></svg>
