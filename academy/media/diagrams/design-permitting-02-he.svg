<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="695" viewBox="0 0 1040 695" lang="he" xml:lang="he" role="img" aria-labelledby="title desc"><title id="title">הצללה משנה את האומדן</title><desc id="desc">שלוש עמודות מציגות 15,000, 14,100 ו־12,900 קוט״ש בשנה בהנחות הצללה שונות לתרגול.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="361.92" lengthAdjust="spacingAndGlyphs">הצללה משנה את האומדן</tspan></text><g class="diagram-bar" data-node="0"><text x="1000" y="154" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="154" textLength="234.75" lengthAdjust="spacingAndGlyphs">ללא הפסד הצללה</tspan></text><text x="1000" y="193" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="193" textLength="342.37" lengthAdjust="spacingAndGlyphs">15000 קוט״ש לשנה · דוגמת תרגול</tspan></text><rect x="40" y="214" width="960" height="28" rx="3" fill="#dedfce"/><rect x="40" y="214" width="960" height="28" rx="3" fill="#24463e"/><text x="1000" y="273" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="273" textLength="334.32" lengthAdjust="spacingAndGlyphs">ייחוס לתרגול לפני הנחת ההצללה</tspan></text></g><g class="diagram-bar" data-node="1"><text x="1000" y="340" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="340" textLength="222.28" lengthAdjust="spacingAndGlyphs">הפסד הצללה 6%</tspan></text><text x="1000" y="379" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="379" textLength="342.37" lengthAdjust="spacingAndGlyphs">14100 קוט״ש לשנה · דוגמת תרגול</tspan></text><rect x="40" y="400" width="960" height="28" rx="3" fill="#dedfce"/><rect x="97.6" y="400" width="902.4" height="28" rx="3" fill="#006f6b"/><text x="1000" y="459" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="459" textLength="133.73" lengthAdjust="spacingAndGlyphs">15,000 × 0.94</tspan></text></g><g class="diagram-bar" data-node="2"><text x="1000" y="526" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="526" textLength="237.89" lengthAdjust="spacingAndGlyphs">הפסד הצללה 14%</tspan></text><text x="1000" y="565" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="565" textLength="342.37" lengthAdjust="spacingAndGlyphs">12900 קוט״ש לשנה · דוגמת תרגול</tspan></text><rect x="40" y="586" width="960" height="28" rx="3" fill="#dedfce"/><rect x="174.4" y="586" width="825.6" height="28" rx="3" fill="#24463e"/><text x="1000" y="645" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="645" textLength="133.73" lengthAdjust="spacingAndGlyphs">15,000 × 0.86</tspan></text></g></svg>
