<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="359" viewBox="0 0 1040 359" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Two independent roof checks</title><desc id="desc">Three cards compare structural load path, waterproofing path and evidence before concealment.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="407.72" lengthAdjust="spacingAndGlyphs">Two independent roof checks</tspan></text><g class="diagram-card" data-node="0"><rect x="40" y="127" width="298.67" height="196" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="127" width="298.67" height="7" fill="#24463e"/><text x="189.33" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="189.33" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="189.33" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="189.33" y="212" textLength="124.96" lengthAdjust="spacingAndGlyphs">Load path</tspan></text><text x="189.33" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="189.33" y="258" textLength="256.85" lengthAdjust="spacingAndGlyphs">Attachments transfer forces</tspan><tspan x="189.33" y="289" textLength="218.4" lengthAdjust="spacingAndGlyphs">into accepted structure.</tspan></text></g><g class="diagram-card" data-node="1"><rect x="370.67" y="127" width="298.67" height="196" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="370.67" y="127" width="298.67" height="7" fill="#006f6b"/><text x="520" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="520" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="212" textLength="137.4" lengthAdjust="spacingAndGlyphs">Water path</tspan></text><text x="520" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="258" textLength="185.68" lengthAdjust="spacingAndGlyphs">Approved seals and</tspan><tspan x="520" y="289" textLength="234.8" lengthAdjust="spacingAndGlyphs">drainage protect the roof.</tspan></text></g><g class="diagram-card" data-node="2"><rect x="701.33" y="127" width="298.67" height="196" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="701.33" y="127" width="298.67" height="7" fill="#24463e"/><text x="850.67" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="850.67" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="850.67" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="850.67" y="212" textLength="209.2" lengthAdjust="spacingAndGlyphs">Hidden evidence</tspan></text><text x="850.67" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="850.67" y="258" textLength="179.84" lengthAdjust="spacingAndGlyphs">Record both before</tspan><tspan x="850.67" y="289" textLength="216.05" lengthAdjust="spacingAndGlyphs">modules conceal them.</tspan></text></g></svg>
