<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="430" viewBox="0 0 1040 430" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">From installed asset to handover</title><desc id="desc">Four handover steps connect actual equipment, asset-specific tests, open-item closure and owner knowledge.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="452.84" lengthAdjust="spacingAndGlyphs">From installed asset to handover</tspan></text><g class="diagram-card" data-node="0"><rect x="40" y="127" width="216" height="267" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="127" width="216" height="7" fill="#24463e"/><text x="148" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="148" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="212" textLength="154.55" lengthAdjust="spacingAndGlyphs">Verify actual</tspan><tspan x="148" y="252" textLength="131.11" lengthAdjust="spacingAndGlyphs">equipment</tspan></text><text x="148" y="298" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="298" textLength="126.13" lengthAdjust="spacingAndGlyphs">Match model,</tspan><tspan x="148" y="329" textLength="173.99" lengthAdjust="spacingAndGlyphs">serial and installed</tspan><tspan x="148" y="360" textLength="72.37" lengthAdjust="spacingAndGlyphs">location</tspan></text></g><path d="M260 260.5 L279 260.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="288" y="127" width="216" height="267" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="288" y="127" width="216" height="7" fill="#006f6b"/><text x="396" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="396" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="212" textLength="132.73" lengthAdjust="spacingAndGlyphs">Attach test</tspan><tspan x="396" y="252" textLength="112.38" lengthAdjust="spacingAndGlyphs">evidence</tspan></text><text x="396" y="298" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="298" textLength="164.7" lengthAdjust="spacingAndGlyphs">Link results to the</tspan><tspan x="396" y="329" textLength="153.01" lengthAdjust="spacingAndGlyphs">actual asset and</tspan><tspan x="396" y="360" textLength="72.35" lengthAdjust="spacingAndGlyphs">revision</tspan></text></g><path d="M508 260.5 L527 260.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="536" y="127" width="216" height="267" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="536" y="127" width="216" height="7" fill="#24463e"/><text x="644" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="644" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="212" textLength="101.42" lengthAdjust="spacingAndGlyphs">Resolve</tspan><tspan x="644" y="252" textLength="118.67" lengthAdjust="spacingAndGlyphs">punch list</tspan></text><text x="644" y="298" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="298" textLength="150.59" lengthAdjust="spacingAndGlyphs">Separate critical</tspan><tspan x="644" y="329" textLength="169.32" lengthAdjust="spacingAndGlyphs">holds from agreed</tspan><tspan x="644" y="360" textLength="142.4" lengthAdjust="spacingAndGlyphs">remaining work</tspan></text></g><path d="M756 260.5 L775 260.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="784" y="127" width="216" height="267" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="784" y="127" width="216" height="7" fill="#006f6b"/><text x="892" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="892" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="212" textLength="104.54" lengthAdjust="spacingAndGlyphs">Transfer</tspan><tspan x="892" y="252" textLength="134.22" lengthAdjust="spacingAndGlyphs">knowledge</tspan></text><text x="892" y="298" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="298" textLength="142.7" lengthAdjust="spacingAndGlyphs">Give owner as-</tspan><tspan x="892" y="329" textLength="155.32" lengthAdjust="spacingAndGlyphs">built records and</tspan><tspan x="892" y="360" textLength="150.59" lengthAdjust="spacingAndGlyphs">service contacts</tspan></text></g></svg>
