<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="627" viewBox="0 0 1040 627" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Reassess when conditions change</title><desc id="desc">A safety cycle defines the task, assesses hazards, verifies readiness and returns to review when conditions change.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="480.54" lengthAdjust="spacingAndGlyphs">Reassess when conditions change</tspan></text><path d="M474 225 L561 225" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M780 327 L780 386" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M566 493 L479 493" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M260 391 L260 332" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="0"><rect x="50" y="127" width="420" height="196" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="50" y="127" width="420" height="7" fill="#24463e"/><text x="260" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="260" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="260" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="260" y="212" textLength="187.41" lengthAdjust="spacingAndGlyphs">Define the task</tspan></text><text x="260" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="260" y="258" textLength="342.26" lengthAdjust="spacingAndGlyphs">Identify location, people and affected</tspan><tspan x="260" y="289" textLength="80.51" lengthAdjust="spacingAndGlyphs">activities</tspan></text></g><g class="diagram-card" data-node="1"><rect x="570" y="127" width="420" height="196" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="570" y="127" width="420" height="7" fill="#006f6b"/><text x="780" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="780" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="780" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="780" y="212" textLength="198.24" lengthAdjust="spacingAndGlyphs">Assess hazards</tspan></text><text x="780" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="780" y="258" textLength="365.69" lengthAdjust="spacingAndGlyphs">Use competent review and site-specific</tspan><tspan x="780" y="289" textLength="73.52" lengthAdjust="spacingAndGlyphs">controls</tspan></text></g><g class="diagram-card" data-node="2"><rect x="570" y="395" width="420" height="196" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="570" y="395" width="420" height="7" fill="#24463e"/><text x="780" y="434" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="780" y="434" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="780" y="480" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="780" y="480" textLength="201.36" lengthAdjust="spacingAndGlyphs">Verify readiness</tspan></text><text x="780" y="526" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="780" y="526" textLength="346.77" lengthAdjust="spacingAndGlyphs">Confirm controls, communication and</tspan><tspan x="780" y="557" textLength="221.8" lengthAdjust="spacingAndGlyphs">response arrangements</tspan></text></g><g class="diagram-card" data-node="3"><rect x="50" y="395" width="420" height="196" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="50" y="395" width="420" height="7" fill="#006f6b"/><text x="260" y="434" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="260" y="434" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="260" y="480" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="260" y="480" textLength="201.45" lengthAdjust="spacingAndGlyphs">Stop and review</tspan></text><text x="260" y="526" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="260" y="526" textLength="349.23" lengthAdjust="spacingAndGlyphs">Changed conditions return the task to</tspan><tspan x="260" y="557" textLength="112.04" lengthAdjust="spacingAndGlyphs">assessment</tspan></text></g></svg>
