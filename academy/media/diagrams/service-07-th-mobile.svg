<svg xmlns="http://www.w3.org/2000/svg" width="480" height="903" viewBox="0 0 480 903" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">งบเฟสที่เกินคำขอ</title><desc id="desc">แท่งเทียบงบ 32 A อาคาร 20 A EV ขอ 16 A และรวม 36 A.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="206.04" lengthAdjust="spacingAndGlyphs">งบเฟสที่เกินคำขอ</tspan></text><g class="diagram-bar" data-node="0"><text x="28" y="150" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="150" textLength="151.84" lengthAdjust="spacingAndGlyphs">งบในตัวอย่าง</tspan></text><text x="28" y="191" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="191" textLength="150.78" lengthAdjust="spacingAndGlyphs">32 A ตัวอย่างฝึก</tspan></text><rect x="28" y="215" width="424" height="28" rx="3" fill="#dedfce"/><rect x="28" y="215" width="376.89" height="28" rx="3" fill="#24463e"/><text x="28" y="274" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="274" textLength="233.1" lengthAdjust="spacingAndGlyphs">ขีดสมมติที่ให้สำหรับเฟสนี้.</tspan></text></g><g class="diagram-bar" data-node="1"><text x="28" y="342" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="342" textLength="196.3" lengthAdjust="spacingAndGlyphs">ความต้องการเดิม</tspan></text><text x="28" y="383" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="383" textLength="150.78" lengthAdjust="spacingAndGlyphs">20 A ตัวอย่างฝึก</tspan></text><rect x="28" y="407" width="424" height="28" rx="3" fill="#dedfce"/><rect x="28" y="407" width="235.56" height="28" rx="3" fill="#006f6b"/><text x="28" y="466" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="466" textLength="217.64" lengthAdjust="spacingAndGlyphs">โหลดอาคารก่อน EV ขอ.</tspan></text></g><g class="diagram-bar" data-node="2"><text x="28" y="534" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="534" textLength="108.52" lengthAdjust="spacingAndGlyphs">คำขอ EV</tspan></text><text x="28" y="575" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="575" textLength="150.78" lengthAdjust="spacingAndGlyphs">16 A ตัวอย่างฝึก</tspan></text><rect x="28" y="599" width="424" height="28" rx="3" fill="#dedfce"/><rect x="28" y="599" width="188.44" height="28" rx="3" fill="#24463e"/><text x="28" y="658" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="658" textLength="234.15" lengthAdjust="spacingAndGlyphs">กระแสที่ขอ ไม่รับรองจ่าย.</tspan></text></g><g class="diagram-bar" data-node="3"><text x="28" y="726" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="726" textLength="99.84" lengthAdjust="spacingAndGlyphs">รวมที่ขอ</tspan></text><text x="28" y="767" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="767" textLength="150.78" lengthAdjust="spacingAndGlyphs">36 A ตัวอย่างฝึก</tspan></text><rect x="28" y="791" width="424" height="28" rx="3" fill="#dedfce"/><rect x="28" y="791" width="424" height="28" rx="3" fill="#006f6b"/><text x="28" y="850" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="850" textLength="240.91" lengthAdjust="spacingAndGlyphs">20 + 16 = 36 A เกิน 32 A.</tspan></text></g></svg>
