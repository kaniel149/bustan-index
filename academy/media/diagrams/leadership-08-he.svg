<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="695" viewBox="0 0 1040 695" lang="he" xml:lang="he" role="img" aria-labelledby="title desc"><title id="title">קיבולת שירות לפני הבטחות</title><desc id="desc">שלוש עמודות משוות שישים שעות מחויבות, שמונים שעות כשירות זמינות ותשעים שעות לאחר קבלת עבודה חדשה.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="397.8" lengthAdjust="spacingAndGlyphs">קיבולת שירות לפני הבטחות</tspan></text><g class="diagram-bar" data-node="0"><text x="1000" y="154" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="154" textLength="234.75" lengthAdjust="spacingAndGlyphs">התחייבויות קיימות</tspan></text><text x="1000" y="193" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="193" textLength="309.13" lengthAdjust="spacingAndGlyphs">60 שעות כשירות · דוגמת תרגול</tspan></text><rect x="40" y="214" width="960" height="28" rx="3" fill="#dedfce"/><rect x="360" y="214" width="640" height="28" rx="3" fill="#24463e"/><text x="1000" y="273" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="273" textLength="327.81" lengthAdjust="spacingAndGlyphs">שירות, עבודת אתר, נסיעות ותיעוד</tspan></text></g><g class="diagram-bar" data-node="1"><text x="1000" y="34