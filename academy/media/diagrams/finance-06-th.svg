<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="729" viewBox="0 0 1040 729" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">เงินที่มีเทียบกับหนี้ถึงกำหนด</title><desc id="desc">CFADS รายปี 120,000 หรือ 80,000 บาท เทียบภาระหนี้ 100,000 บาท</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="377.52" lengthAdjust="spacingAndGlyphs">เงินที่มีเทียบกับหนี้ถึงกำหนด</tspan></text><g class="diagram-bar" data-node="0"><text x="40" y="158" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="158" textLength="283.89" lengthAdjust="spacingAndGlyphs">เงินพร้อมชำระกรณีฐาน</tspan></text><text x="40" y="201" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="201" textLength="177.34" lengthAdjust="spacingAndGlyphs">120000 บาทต่อปีฝึก</tspan></text><rect x="40" y="225" width="960" height="28" rx="3" fill="#dedfce"/><rect x="40" y="225" width="960" height="28" rx="3" fill="#24463e"/><text x="40" y="284" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="284" textLength="211.66" lengthAdjust="spacingAndGlyphs">CFADS รายปีตามนิยาม</tspan></text></g><g class="diagram-bar" data-node="1"><text x="40" y="354" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="354" textLength="299.89" lengthAdjust="spacingAndGlyphs">ภาระชำระหนี้ตามกำหนด</tspan></text><text x="40" y="397" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="397" textLength="177.34" lengthAdjust="spacingAndGlyphs">100000 บาทต่อปีฝึก</tspan></text><rect x="40" y="421" width="960" height="28" rx="3" fill="#dedfce"/><rect x="40" y="421" width="800" height="28" rx="3" fill="#006f6b"/><text x="40" y="480" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="480" textLength="301.98" lengthAdjust="spacingAndGlyphs">เงินต้น 80,000 + ดอกเบี้ย 20,000</tspan></text></g><g class="diagram-bar" data-node="2"><text x="40" y="550" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="550" textLength="267.32" lengthAdjust="spacingAndGlyphs">เงินพร้อมชำระกรณีแย่</tspan></text><text x="40" y="593" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="593" textLength="165.78" lengthAdjust="spacingAndGlyphs">80000 บาทต่อปีฝึก</tspan></text><rect x="40" y="617" width="960" height="28" rx="3" fill="#dedfce"/><rect x="40" y="617" width="640" height="28" rx="3" fill="#24463e"/><text x="40" y="676" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="676" textLength="228.48" lengthAdjust="spacingAndGlyphs">งวดและนิยามเงินเดียวกัน</tspan></text></g></svg>
