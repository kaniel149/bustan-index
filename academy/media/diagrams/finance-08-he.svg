<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="390" viewBox="0 0 1040 390" lang="he" xml:lang="he" role="img" aria-labelledby="title desc"><title id="title">מפרידים רגישות מתרחישים</title><desc id="desc">התועלת התפעולית בבסיס היא 120,000 באט; שני שינויים שליליים במקביל מורידים אותה ל־60,000.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="389.06" lengthAdjust="spacingAndGlyphs">מפרידים רגישות מתרחישים</tspan></text><g class="diagram-card" data-node="0"><rect x="701.33" y="127" width="298.67" height="227" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="701.33" y="127" width="298.67" height="7" fill="#24463e"/><text x="850.67" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="850.67" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="850.67" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="850.67" y="212" textLength="155.84" lengthAdjust="spacingAndGlyphs">תרחיש בסיס</tspan></text><text x="850.67" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="850.67" y="258" textLength="198.37" lengthAdjust="spacingAndGlyphs">150,000 תועלת פחות</tspan><tspan x="850.67" y="289" textLength="236.8" lengthAdjust="spacingAndGlyphs">30,000 הוצאה = 120,000</tspan><tspan x="850.67" y="320" textLength="40.95" lengthAdjust="spacingAndGlyphs">באט</tspan></text></g><g class="diagram-card" data-node="1"><rect x="370.67" y="127" width="298.67" height="227" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="370.67" y="127" width="298.67" height="7" fill="#006f6b"/><text x="520" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="520" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="520" y="212" textLength="182.24" lengthAdjust="spacingAndGlyphs">הרעה משולבת</tspan></text><text x="520" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="520" y="258" textLength="198.37" lengthAdjust="spacingAndGlyphs">100,000 תועלת פחות</tspan><tspan x="520" y="289" textLength="225.12" lengthAdjust="spacingAndGlyphs">40,000 הוצאה = 60,000</tspan><tspan x="520" y="320" textLength="40.95" lengthAdjust="spacingAndGlyphs">באט</tspan></text></g><g class="diagram-card" data-node="2"><rect x="40" y="127" width="298.67" height="227" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="127" width="298.67" height="7" fill="#24463e"/><text x="189.33" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="189.33" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="189.33" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="pla