<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="729" viewBox="0 0 1040 729" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">ความเสี่ยงค่าเงินในราคาเหมาจ่าย</title><desc id="desc">20,000 ดอลลาร์เป็น 700,000 บาทที่อัตรา 35 หรือ 720,000 ที่ 36 ต่างกัน 20,000 บาท</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="436.18" lengthAdjust="spacingAndGlyphs">ความเสี่ยงค่าเงินในราคาเหมาจ่าย</tspan></text><g class="diagram-bar" data-node="0"><text x="40" y="158" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="158" textLength="250.81" lengthAdjust="spacingAndGlyphs">ที่ 35 บาทต่อดอลลาร์</tspan></text><text x="40" y="201" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="201" textLength="337.08" lengthAdjust="spacingAndGlyphs">700000 บาท · อัตราแลกเปลี่ยนสมมติ</tspan></text><rect x="40" y="225" width="960" height="28" rx="3" fill="#dedfce"/><rect x="40" y="225" width="933.33" height="28" rx="3" fill="#24463e"/><text x="40" y="284" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="284" textLength="241.92" lengthAdjust="spacingAndGlyphs">ยอดผู้ขาย 20,000 ดอลลาร์</tspan></text></g><g class="diagram-bar" data-node="1"><text x="40" y="354" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="354" textLength="250.81" lengthAdjust="spacingAndGlyphs">ที่ 36 บาทต่อดอลลาร์</tspan></text><text x="40" y="397" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="397" textLength="337.08" lengthAdjust="spacingAndGlyphs">720000 บาท · อัตราแลกเปลี่ยนสมมติ</tspan></text><rect x="40" y="421" width="960" height="28" rx="3" fill="#dedfce"/><rect x="40" y="421" width="960" height="28" rx="3" fill="#006f6b"/><text x="40" y="480" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="480" textLength="300.51" lengthAdjust="spacingAndGlyphs">ยอดผู้ขายเดิม สมมติค่าเงินต่างกัน</tspan></text></g><g class="diagram-bar" data-node="2"><text x="40" y="550" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="550" textLength="186.17" lengthAdjust="spacingAndGlyphs">เงินเพิ่มที่ต้องใช้</tspan></text><text x="40" y="593" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="593" textLength="325.52" lengthAdjust="spacingAndGlyphs">20000 บาท · อัตราแลกเปลี่ยนสมมติ</tspan></text><rect x="40" y="617" width="960" height="28" rx="3" fill="#dedfce"/><rect x="40" y="617" width="26.67" height="28" rx="3" fill="#24463e"/><text x="40" y="676" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="676" textLength="231.42" lengthAdjust="spacingAndGlyphs">ก่อนค่าธรรมเนียมและภาษี</tspan></text></g></svg>
