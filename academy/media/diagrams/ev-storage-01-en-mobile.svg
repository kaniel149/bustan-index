<svg xmlns="http://www.w3.org/2000/svg" width="480" height="777" viewBox="0 0 480 777" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Three different battery questions</title><desc id="desc">Three cards separate energy capacity, simultaneous power capability and control compatibility.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="389.43" lengthAdjust="spacingAndGlyphs">Three different battery questions</tspan></text><g class="diagram-card" data-node="0"><rect x="28" y="121" width="424" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="121" width="424" height="7" fill="#24463e"/><text x="240" y="160" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="160" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="206" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="206" textLength="160.84" lengthAdjust="spacingAndGlyphs">Energy: kWh</tspan></text><text x="240" y="253" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="253" textLength="354.79" lengthAdjust="spacingAndGlyphs">How much energy is available under</tspan><tspan x="240" y="285" textLength="207.17" lengthAdjust="spacingAndGlyphs">stated assumptions?</tspan></text></g><g class="diagram-card" data-node="1"><rect x="28" y="339" width="424" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="339" width="424" height="7" fill="#006f6b"/><text x="240" y="378" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="378" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="240" y="424" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="424" textLength="135.85" lengthAdjust="spacingAndGlyphs">Power: kW</tspan></text><text x="240" y="471" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="471" textLength="333.98" lengthAdjust="spacingAndGlyphs">Which simultaneous loads can the</tspan><tspan x="240" y="503" textLength="166.8" lengthAdjust="spacingAndGlyphs">system support?</tspan></text></g><g class="diagram-card" data-node="2"><rect x="28" y="557" width="424" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="557" width="424" height="7" fill="#24463e"/><text x="240" y="596" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="596" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="240" y="642" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="642" textLength="252.83" lengthAdjust="spacingAndGlyphs">Control compatibility</tspan></text><text x="240" y="689" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="689" textLength="283.89" lengthAdjust="spacingAndGlyphs">Do battery, BMS and inverter</tspan><tspan x="240" y="721" textLength="179.04" lengthAdjust="spacingAndGlyphs">interfaces match?</tspan></text></g></svg>
