" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="689" textLength="349.87" lengthAdjust="spacingAndGlyphs">Subtract operating and replacement</tspan><tspan x="240" y="721" textLength="51.35" lengthAdjust="spacingAndGlyphs">costs</tspan></text></g><path d="M240 759 L240 784" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="28" y="793" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="793" width="424" height="7" fill="#006f6b"/><text x="240" y="832" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="832" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="240" y="878" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="878" textLength="263.78" lengthAdjust="spacingAndGlyphs">Scenario comparison</tspan></text><text x="240" y="925" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="925" textLength="346.21" lengthAdjust="spacingAndGlyphs">Check timing, risk and assumptions</tspan></text></g></svg>
