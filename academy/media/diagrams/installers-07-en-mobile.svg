<svg xmlns="http://www.w3.org/2000/svg" width="480" height="723" viewBox="0 0 480 723" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Choose the backup priority</title><desc id="desc">Critical-only backup lasts four idealized hours; adding EV reduces it to 1.33, with power checked separately.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="321.78" lengthAdjust="spacingAndGlyphs">Choose the backup priority</tspan></text><g class="diagram-card" data-node="0"><rect x="28" y="121" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="121" width="424" height="7" fill="#24463e"/><text x="240" y="160" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="160" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="206" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="206" textLength="220.12" lengthAdjust="spacingAndGlyphs">Critical loads only</tspan></text><text x="240" y="253" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="253" textLength="253.42" lengthAdjust="spacingAndGlyphs">1.5 kW: idealized 4 hours.</tspan></text></g><g class="diagram-card" data-node="1"><rect x="28" y="321" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="321" width="424" height="7" fill="#006f6b"/><text x="240" y="360" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="360" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="240" y="406" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="406" textLength="190.47" lengthAdjust="spacingAndGlyphs">Critical plus EV</tspan></text><text x="240" y="453" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="453" textLength="284.04" lengthAdjust="spacingAndGlyphs">4.5 kW: idealized 1.33 hours.</tspan></text></g><g class="diagram-card" data-node="2"><rect x="28" y="521" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="521" width="424" height="7" fill="#24463e"/><text x="240" y="560" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="560" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="240" y="606" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="606" textLength="204.48" lengthAdjust="spacingAndGlyphs">Power capability</tspan></text><text x="240" y="653" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="653" textLength="311.92" lengthAdjust="spacingAndGlyphs">Check inverter limits separately.</tspan></text></g></svg>
