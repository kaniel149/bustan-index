<svg xmlns="http://www.w3.org/2000/svg" width="480" height="903" viewBox="0 0 480 903" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">กระทบยอดกรณีฝึก</title><desc id="desc">ผลิต 14 ใช้ตรง 11 นำเข้า 3 ส่วนเกิน 3 kWh การใช้ตรงอยู่ในสองสมดุล</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="219.29" lengthAdjust="spacingAndGlyphs">กระทบยอดกรณีฝึก</tspan></text><g class="diagram-bar" data-node="0"><text x="28" y="150" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="150" textLength="118.56" lengthAdjust="spacingAndGlyphs">โซลาร์ผลิต</tspan></text><text x="28" y="191" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="191" textLength="70.55" lengthAdjust="spacingAndGlyphs">14 kWh</tspan></text><rect x="28" y="215" width="424" height="28" rx="3" fill="#dedfce"/><rect x="28" y="215" width="424" height="28" rx="3" fill="#24463e"/><text x="28" y="274" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="274" textLength="176.4" lengthAdjust="spacingAndGlyphs">รวมในช่วงตัวอย่าง</tspan></text></g><g class="diagram-bar" data-node="1"><text x="28" y="342" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" dir