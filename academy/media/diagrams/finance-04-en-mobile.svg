<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1013" viewBox="0 0 480 1013" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Keep replacement cash visible</title><desc id="desc">Initial 300,000 THB CAPEX, annual 10,000 THB OPEX and an assumed year-eight 80,000 THB replacement.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="366.85" lengthAdjust="spacingAndGlyphs">Keep replacement cash visible</tspan></text><g class="diagram-card" data-node="0"><rect x="28" y="121" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="121" width="424" height="7" fill="#24463e"/><text x="240" y="160" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="160" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="206" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="206" textLength="168.59" lengthAdjust="spacingAndGlyphs">Initial CAPEX</tspan></text><text x="240" y="253" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="253" textLength="261.87" lengthAdjust="spacingAndGlyphs">300,000 THB training input</tspan></text></g><path d="M240 305 L240 330" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="28" y="339" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="339" width="424" height="7" fill="#006f6b"/><text x="240" y="378" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="378" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="240" y="424" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="424" textLength="173.31" lengthAdjust="spacingAndGlyphs">Annual OPEX</tspan></text><text x="240" y="471" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="471" textLength="220.29" lengthAdjust="spacingAndGlyphs">10,000 THB each year</tspan></text></g><path d="M240 523 L240 548" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="28" y="557" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="557" width="424" height="7" fill="#24463e"/><text x="240" y="596" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="596" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="240" y="642" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="642" textLength="245.14" lengthAdjust="spacingAndGlyphs">Year 8 replacement</tspan></text><text x="240" y="689" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="689" textLength="253.29" lengthAdjust="spacingAndGlyphs">80,000 THB scenario cost</tspan></text></g><path d="M240 741 L240 766" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="28" y="775" width="424" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="775" width="424" height="7" fill="#006f6b"/><text x="240" y="814" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="814" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="240" y="860" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="860" textLength="204.48" lengthAdjust="spacingAndGlyphs">Evidence review</tspan></text><text x="240" y="907" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="907" textLength="310.73" lengthAdjust="spacingAndGlyphs">Check warranty, exclusions and</tspan><tspan x="240" y="939" textLength="185.9" lengthAdjust="spacingAndGlyphs">replacement scope</tspan></text></g></svg>
