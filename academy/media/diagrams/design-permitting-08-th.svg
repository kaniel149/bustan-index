<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="454" viewBox="0 0 1040 454" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">จากอุปกรณ์ติดตั้งสู่ส่งมอบ</title><desc id="desc">สี่ขั้นส่งมอบเชื่อมอุปกรณ์จริง ผลทดสอบเฉพาะเครื่อง การปิดงานค้าง และความรู้เจ้าของ</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="352.87" lengthAdjust="spacingAndGlyphs">จากอุปกรณ์ติดตั้งสู่ส่งมอบ</tspan></text><g class="diagram-card" data-node="0"><rect x="40" y="131" width="216" height="287" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="131" width="216" height="7" fill="#24463e"/><text x="148" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="148" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="219" textLength="161.74" lengthAdjust="spacingAndGlyphs">ยืนยันอุปกรณ์</tspan><tspan x="148" y="263" textLength="53.91" lengthAdjust="spacingAndGlyphs">จริง</tspan></text><text x="148" y="313" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="313" textLength="155.4" lengthAdjust="spacingAndGlyphs">จับคู่รุ่น หมายเลข</tspan><tspan x="148" y="347" textLength="175.56" lengthAdjust="spacingAndGlyphs">เครื่อง และตำแหน่ง</tspan></text></g><path d="M260 274.5 L279 274.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="288" y="131" width="216" height="287" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="288" y="131" width="216" height="7" fill="#006f6b"/><text x="396" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="396" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="219" textLength="151.35" lengthAdjust="spacingAndGlyphs">แนบหลักฐาน</tspan><tspan x="396" y="263" textLength="89.86" lengthAdjust="spacingAndGlyphs">ทดสอบ</tspan></text><text x="396" y="313" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="313" textLength="167.37" lengthAdjust="spacingAndGlyphs">เชื่อมผลกับอุปกรณ์</tspan><tspan x="396" y="347" textLength="113.19" lengthAdjust="spacingAndGlyphs">และฉบับจริง</tspan></text></g><path d="M508 274.5 L527 274.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="536" y="131" width="216" height="287" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="536" y="131" width="216" height="7" fill="#24463e"/><text x="644" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="644" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="219" textLength="131.98" lengthAdjust="spacingAndGlyphs">ปิดรายการ</tspan><tspan x="644" y="263" textLength="48.02" lengthAdjust="spacingAndGlyphs">ค้าง</tspan></text><text x="644" y="313" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="313" textLength="140.07" lengthAdjust="spacingAndGlyphs">แยกข้อหยุดงาน</tspan><tspan x="644" y="347" textLength="152.46" lengthAdjust="spacingAndGlyphs">สำคัญจากงานคง</tspan><tspan x="644" y="381" textLength="113.61" lengthAdjust="spacingAndGlyphs">เหลือที่ตกลง</tspan></text></g><path d="M756 274.5 L775 274.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="784" y="131" width="216" height="287" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="784" y="131" width="216" height="7" fill="#006f6b"/><text x="892" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="892" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="219" textLength="155.84" lengthAdjust="spacingAndGlyphs">ส่งต่อความรู้</tspan></text><text x="892" y="269" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="269" textLength="171.99" lengthAdjust="spacingAndGlyphs">มอบเอกสารตามติด</tspan><tspan x="892" y="303" textLength="166.95" lengthAdjust="spacingAndGlyphs">ตั้งจริงและผู้ติดต่อ</tspan><tspan x="892" y="337" textLength="62.79" lengthAdjust="spacingAndGlyphs">บริการ</tspan></text></g></svg>
