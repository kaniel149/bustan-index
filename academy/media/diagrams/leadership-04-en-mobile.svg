<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1033" viewBox="0 0 480 1033" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Can this work proceed?</title><desc id="desc">A decision asks whether critical controls are verified, with alternatives to release, hold or reassess changed conditions.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="290.79" lengthAdjust="spacingAndGlyphs">Can this work proceed?</tspan></text><g class="diagram-card" data-node="0"><rect x="30" y="121" width="420" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="30" y="121" width="420" height="7" fill="#24463e"/><text x="240" y="160" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="160" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="206" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="206" textLength="312.78" lengthAdjust="spacingAndGlyphs">Critical controls verified?</tspan></text><text x="240" y="253" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="253" textLength="342.56" lengthAdjust="spacingAndGlyphs">Check competence, conditions and</tspan><tspan x="240" y="285" textLength="174.9" lengthAdjust="spacingAndGlyphs">required evidence</tspan></text></g><path d="M27 220 H16 V898" stroke="#006f6b" stroke-width="3" fill="none"/><path d="M16 450 L48 450" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="56" y="351" width="396" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="56" y="351" width="396" height="7" fill="#006f6b"/><text x="254" y="390" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="390" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="254" y="436" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="436" textLength="237.28" lengthAdjust="spacingAndGlyphs">Evidence complete</tspan></text><text x="254" y="483" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="483" textLength="297.24" lengthAdjust="spacingAndGlyphs">Authorized owner may release</tspan><tspan x="254" y="515" textLength="121.09" lengthAdjust="spacingAndGlyphs">within scope</tspan></text></g><path d="M16 674 L48 674" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="56" y="575" width="396" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="56" y="575" width="396" height="7" fill="#24463e"/><text x="254" y="614" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="614" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="254" y="660" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="660" textLength="235.7" lengthAdjust="spacingAndGlyphs">Control unresolved</tspan></text><text x="254" y="707" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="707" textLength="294.87" lengthAdjust="spacingAndGlyphs">Hold affected work and assign</tspan><tspan x="254" y="739" textLength="160.2" lengthAdjust="spacingAndGlyphs">corrective action</tspan></text></g><path d="M16 898 L48 898" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="56" y="799" width="396" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="56" y="799" width="396" height="7" fill="#006f6b"/><text x="254" y="838" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="838" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="254" y="884" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="884" textLength="248.23" lengthAdjust="spacingAndGlyphs">Conditions changed</tspan></text><text x="254" y="931" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="931" textLength="250.82" lengthAdjust="spacingAndGlyphs">Stop and reassess before</tspan><tspan x="254" y="963" textLength="100.28" lengthAdjust="spacingAndGlyphs">continuing</tspan></text></g></svg>
