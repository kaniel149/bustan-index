<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="430" viewBox="0 0 1040 430" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Inside the PV principle</title><desc id="desc">Light brings energy, charges separate, current flows in a suitable circuit, and system equipment makes the power usable.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="310.6" lengthAdjust="spacingAndGlyphs">Inside the PV principle</tspan></text><g class="diagram-card" data-node="0"><rect x="40" y="127" width="216" height="267" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="127" width="216" height="7" fill="#24463e"/><text x="148" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="148" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="212" textLength="152.98" lengthAdjust="spacingAndGlyphs">Light arrives</tspan></text><text x="148" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="258" textLength="129.59" lengthAdjust="spacingAndGlyphs">Photons carry</tspan><tspan x="148" y="289" textLength="64.2" lengthAdjust="spacingAndGlyphs">energy</tspan></text></g><path d="M260 260.5 L279 260.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="288" y="127" width="216" height="267" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="288" y="127" width="216" height="7" fill="#006f6b"/><text x="396" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="396" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="212" textLength="106.11" lengthAdjust="spacingAndGlyphs">Charges</tspan><tspan x="396" y="252" textLength="109.26" lengthAdjust="spacingAndGlyphs">separate</tspan></text><text x="396" y="298" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="298" textLength="140.05" lengthAdjust="spacingAndGlyphs">Semiconductor</tspan><tspan x="396" y="329" textLength="147.1" lengthAdjust="spacingAndGlyphs">junction creates</tspan><tspan x="396" y="360" textLength="79.36" lengthAdjust="spacingAndGlyphs">direction</tspan></text></g><path d="M508 260.5 L527 260.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="536" y="127" width="216" height="267" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="536" y="127" width="216" height="7" fill="#24463e"/><text x="644" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="644" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="212" textLength="165.45" lengthAdjust="spacingAndGlyphs">Current flows</tspan></text><text x="644" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="258" textLength="158.82" lengthAdjust="spacingAndGlyphs">A suitable closed</tspan><tspan x="644" y="289" textLength="158.78" lengthAdjust="spacingAndGlyphs">circuit is required</tspan></text></g><path d="M756 260.5 L775 260.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="784" y="127" width="216" height="267" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="784" y="127" width="216" height="7" fill="#006f6b"/><text x="892" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="892" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="212" textLength="107.71" lengthAdjust="spacingAndGlyphs">Power is</tspan><tspan x="892" y="252" textLength="60.88" lengthAdjust="spacingAndGlyphs">used</tspan></text><text x="892" y="298" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="298" textLength="173.94" lengthAdjust="spacingAndGlyphs">System equipment</tspan><tspan x="892" y="329" textLength="86.37" lengthAdjust="spacingAndGlyphs">manages</tspan><tspan x="892" y="360" textLength="101.54" lengthAdjust="spacingAndGlyphs">conversion</tspan></text></g></svg>
