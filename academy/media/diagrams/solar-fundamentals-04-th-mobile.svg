<svg xmlns="http://www.w3.org/2000/svg" width="480" height="727" viewBox="0 0 480 727" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">สถาปัตยกรรมระบบสามแบบ</title><desc id="desc">เปรียบเทียบเชื่อมโครงข่าย ไฮบริด และนอกโครงข่ายเป็นรูปแบบ ไม่ใช่ขั้นต่อเนื่อง</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="324.75" lengthAdjust="spacingAndGlyphs">สถาปัตยกรรมระบบสามแบบ</tspan></text><g class="diagram-card" data-node="0"><rect x="28" y="125" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="125" width="424" height="7" fill="#24463e"/><text x="240" y="164" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="164" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="213" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="213" textLength="172.13" lengthAdjust="spacingAndGlyphs">เชื่อมโครงข่าย</tspan></text><text x="240" y="264" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="264" textLength="294.58" lengthAdjust="spacingAndGlyphs">ต่อโครงข่าย ไม่ได้มีสำรองเสมอ</tspan></text></g><g class="diagram-card" data-node="1"><rect x="28" y="325" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="325" width="424" height="7" fill="#006f6b"/><text x="240" y="364" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="364" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="240" y="413" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="413" textLength="80.03" lengthAdjust="spacingAndGlyphs">ไฮบริด</tspan></text><text x="240" y="464" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="464" textLength="342.76" lengthAdjust="spacingAndGlyphs">เก็บพลังงานที่เข้ากันและตั้งค่าควบคุม</tspan></text></g><g class="diagram-card" data-node="2"><rect x="28" y="525" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="525" width="424" height="7" fill="#24463e"/><text x="240" y="564" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="564" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="240" y="613" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="613" textLength="163.99" lengthAdjust="spacingAndGlyphs">นอกโครงข่าย</tspan></text><text x="240" y="664" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="664" textLength="333.74" lengthAdjust="spacingAndGlyphs">สมดุลพลังงานโดยไม่มีโครงข่ายปกติ</tspan></text></g></svg>
