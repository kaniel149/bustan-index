<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1107" viewBox="0 0 480 1107" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Make priorities observable</title><desc id="desc">A repeating control cycle observes demand, applies priorities, allocates EV charging and verifies response.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="315.66" lengthAdjust="spacingAndGlyphs">Make priorities observable</tspan></text><g class="diagram-card" data-node="0"><rect x="40" y="121" width="400" height="238" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="121" width="400" height="7" fill="#24463e"/><text x="240" y="160" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="160" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="206" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="206" textLength="301.35" lengthAdjust="spacingAndGlyphs">Observe generation and</tspan><tspan x="240" y="246" textLength="101.45" lengthAdjust="spacingAndGlyphs">demand</tspan></text><text x="240" y="293" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="293" textLength="326.63" lengthAdjust="spacingAndGlyphs">Use current measurements at the</tspan><tspan x="240" y="325" textLength="171.27" lengthAdjust="spacingAndGlyphs">correct boundary.</tspan></text></g><path d="M240 363 L240 388" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="40" y="397" width="400" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="397" width="400" height="7" fill="#006f6b"/><text x="240" y="436" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="436" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="240" y="482" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="482" textLength="279.45" lengthAdjust="spacingAndGlyphs">Apply agreed priorities</tspan></text><text x="240" y="529" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="529" textLength="275.26" lengthAdjust="spacingAndGlyphs">Respect essential loads and</tspan><tspan x="240" y="561" textLength="250.8" lengthAdjust="spacingAndGlyphs">approved battery reserve.</tspan></text></g><path d="M240 599 L240 624" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="40" y="633" width="400" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="633" width="400" height="7" fill="#24463e"/><text x="240" y="672" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="672" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="240" y="718" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="718" textLength="260.75" lengthAdjust="spacingAndGlyphs">Allocate EV charging</tspan></text><text x="240" y="765" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="765" textLength="319.31" lengthAdjust="spacingAndGlyphs">Remain within approved site and</tspan><tspan x="240" y="797" textLength="135.78" lengthAdjust="spacingAndGlyphs">product limits.</tspan></text></g><path d="M240 835 L240 860" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="40" y="869" width="400" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="869" width="400" height="7" fill="#006f6b"/><text x="240" y="908" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="908" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="240" y="954" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="954" textLength="277.91" lengthAdjust="spacingAndGlyphs">Verify actual response</tspan></text><text x="240" y="1001" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="1001" textLength="308.2" lengthAdjust="spacingAndGlyphs">Compare commanded behavior</tspan><tspan x="240" y="1033" textLength="239.8" lengthAdjust="spacingAndGlyphs">with observed operation.</tspan></text></g><path d="M444 968 H464 V240 H449" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/></svg>
