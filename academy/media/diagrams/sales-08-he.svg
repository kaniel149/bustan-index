<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="695" viewBox="0 0 1040 695" lang="he" xml:lang="he" role="img" aria-labelledby="title desc"><title id="title">הנחה קטנה, השפעה גדולה</title><desc id="desc">עמודות מציגות מחיר מקורי 400,000, מחיר מוזל 360,000 ועלות ישירה קבועה 320,000 באט.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="390.94" lengthAdjust="spacingAndGlyphs">הנחה קטנה, השפעה גדולה</tspan></text><g class="diagram-bar" data-node="0"><text x="1000" y="154" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="154" textLength="147.7" lengthAdjust="spacingAndGlyphs">מחיר מקורי</tspan></text><text x="1000" y="193" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="193" textLength="273.02" lengthAdjust="spacingAndGlyphs">400000 באט · דוגמת תרגול</tspan></text><rect x="40" y="214" width="960" height="28" rx="3" fill="#dedfce"/><rect x="40" y="214" width="960" height="28" rx="3" fill="#24463e"/><text x="1000" y="273" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="273" textLength="122.64" lengthAdjust="spacingAndGlyphs">הצעת תרגול</tspan></text></g><g class="diagram-bar" data-node="1"><text x="1000" y="340" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="340" textLength="226.61" lengthAdjust="spacingAndGlyphs">מחיר לאחר הנחה</tspan></text><text x="1000" y="379" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="379" textLength="273.02" lengthAdjust="spacingAndGlyphs">360000 באט · דוגמת תרגול</tspan></text><rect x="40" y="400" width="960" height="28" rx="3" fill="#dedfce"/><rect x="136" y="400" width="864" height="28" rx="3" fill="#006f6b"/><text x="1000" y="459" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="459" textLength="245.53" lengthAdjust="spacingAndGlyphs">הנחה של 10%; אותו היקף</tspan></text></g><g class="diagram-bar" data-node="2"><text x="1000" y="526" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="526" textLength="147.7" lengthAdjust="spacingAndGlyphs">עלות ישירה</tspan></text><text x="1000" y="565" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="565" textLength="273.02" lengthAdjust="spacingAndGlyphs">320000 באט · דוגמת תרגול</tspan></text><rect x="40" y="586" width="960" height="28" rx="3" fill="#dedfce"/><rect x="232" y="586" width="768" height="28" rx="3" fill="#24463e"/><text x="1000" y="645" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="645" textLength="205.8" lengthAdjust="spacingAndGlyphs">קבועה לצורך הדוגמה</tspan></text></g></svg>
