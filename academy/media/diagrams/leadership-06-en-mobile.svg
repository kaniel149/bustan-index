<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1103" viewBox="0 0 480 1103" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Classify before changing the baseline</title><desc id="desc">A classification decision separates new scope, defect correction and uncertain risk exposure.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="341.33" lengthAdjust="spacingAndGlyphs">Classify before changing the</tspan><tspan x="240" y="117" textLength="100.7" lengthAdjust="spacingAndGlyphs">baseline</tspan></text><g class="diagram-card" data-node="0"><rect x="30" y="159" width="420" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="30" y="159" width="420" height="7" fill="#24463e"/><text x="240" y="198" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="198" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="244" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="244" textLength="203.58" lengthAdjust="spacingAndGlyphs">What changed?</tspan></text><text x="240" y="291" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="291" textLength="363.4" lengthAdjust="spacingAndGlyphs">Compare the request with the agreed</tspan><tspan x="240" y="323" textLength="81.93" lengthAdjust="spacingAndGlyphs">baseline</tspan></text></g><path d="M27 258 H16 V968" stroke="#006f6b" stroke-width="3" fill="none"/><path d="M16 504 L48 504" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="56" y="389" width="396" height="230" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="56" y="389" width="396" height="7" fill="#006f6b"/><text x="254" y="428" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="428" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="254" y="474" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="474" textLength="138.94" lengthAdjust="spacingAndGlyphs">New scope</tspan></text><text x="254" y="521" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="521" textLength="259.4" lengthAdjust="spacingAndGlyphs">Assess technical, cost and</tspan><tspan x="254" y="553" textLength="238.52" lengthAdjust="spacingAndGlyphs">schedule impacts before</tspan><tspan x="254" y="585" textLength="125.95" lengthAdjust="spacingAndGlyphs">authorization</tspan></text></g><path d="M16 744 L48 744" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="56" y="645" width="396" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="56" y="645" width="396" height="7" fill="#24463e"/><text x="254" y="684" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="684" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="254" y="730" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="730" textLength="212.28" lengthAdjust="spacingAndGlyphs">Defect correction</tspan></text><text x="254" y="777" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="777" textLength="305.82" lengthAdjust="spacingAndGlyphs">Restore an agreed requirement</tspan><tspan x="254" y="809" textLength="285.05" lengthAdjust="spacingAndGlyphs">through the responsible party</tspan></text></g><path d="M16 968 L48 968" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="56" y="869" width="396" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="56" y="869" width="396" height="7" fill="#006f6b"/><text x="254" y="908" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="908" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="254" y="954" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="954" textLength="243.51" lengthAdjust="spacingAndGlyphs">Uncertain exposure</tspan></text><text x="254" y="1001" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="1001" textLength="294.87" lengthAdjust="spacingAndGlyphs">Record risk owner, trigger and</tspan><tspan x="254" y="1033" textLength="90.49" lengthAdjust="spacingAndGlyphs">response</tspan></text></g></svg>
