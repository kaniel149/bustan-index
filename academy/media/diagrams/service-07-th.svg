<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="925" viewBox="0 0 1040 925" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">งบเฟสที่เกินคำขอ</title><desc id="desc">แท่งเทียบงบ 32 A อาคาร 20 A EV ขอ 16 A และรวม 36 A.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="237.74" lengthAdjust="spacingAndGlyphs">งบเฟสที่เกินคำขอ</tspan></text><g class="diagram-bar" data-node="0"><text x="40" y="158" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="158" textLength="163.99" lengthAdjust="spacingAndGlyphs">งบในตัวอย่าง</tspan></text><text x="40" y="201" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="201" textLength="150.78" lengthAdjust="spacingAndGlyphs">32 A ตัวอย่างฝึก</tspan></text><rect x="40" y="225" width="960" height="28" rx="3" fill="#dedfce"/><rect x="40" y="225" width="853.33" height="28" rx="3" fill="#24463e"/><text x="40" y="284" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="284" textLength="233.1" lengthAdjust="spacingAndGlyphs">ขีดสมมติที่ให้สำหรับเฟสนี้.</tspan></text></g><g class="diagram-bar" data-node="1"><text x="40" y="354" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="354" textLength="212" lengthAdjust="spacingAndGlyphs">ความต้องการเดิม</tspan></text><text x="40" y="397" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="397" textLength="150.78" lengthAdjust="spacingAndGlyphs">20 A ตัวอย่างฝึก</tspan></text><rect x="40" y="421" width="960" height="28" rx="3" fill="#dedfce"/><rect x="40" y="421" width="533.33" height="28" rx="3" fill="#006f6b"/><text x="40" y="480" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="480" textLength="217.64" lengthAdjust="spacingAndGlyphs">โหลดอาคารก่อน EV ขอ.</tspan></text></g><g class="diagram-bar" data-node="2"><text x="40" y="550" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="550" textLength="117.21" lengthAdjust="spacingAndGlyphs">คำขอ EV</tspan></text><text x="40" y="593" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="593" textLength="150.78" lengthAdjust="spacingAndGlyphs">16 A ตัวอย่างฝึก</tspan></text><rect x="40" y="617" width="960" height="28" rx="3" fill="#dedfce"/><rect x="40" y="617" width="426.67" height="28" rx="3" fill="#24463e"/><text x="40" y="676" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="676" textLength="234.15" lengthAdjust="spacingAndGlyphs">กระแสที่ขอ ไม่รับรองจ่าย.</tspan></text></g><g class="diagram-bar" data-node="3"><text x="40" y="746" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anc