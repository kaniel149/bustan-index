yphs">משך מחושב</tspan></text></g><g class="diagram-card" data-node="1"><rect x="370.67" y="127" width="298.67" height="196" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="370.67" y="127" width="298.67" height="7" fill="#006f6b"/><text x="520" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="520" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="520" y="212" textLength="153.88" lengthAdjust="spacingAndGlyphs">תקרת הספק</tspan></text><text x="520" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="520" y="258" textLength="249.69" lengthAdjust="spacingAndGlyphs">עומסים בו־זמניים חייבים</tspan><tspan x="520" y="289" textLength="220.92" lengthAdjust="spacingAndGlyphs">להתאים ליכולות הציוד</tspan></text></g><g class="diagram-card" data-node="2"><rect x="40" y="127" width="298.67" height="196" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="127" width="298.67" height="7" fill="#24463e"/><text x="189.33" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="189.33" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="189.33" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="189.33" y="212" textLength="218.46" lengthAdjust="spacingAndGlyphs">גבול מצב עבודה</tspan></text><text x="189.33" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-se