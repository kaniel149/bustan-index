<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="454" viewBox="0 0 1040 454" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">ปรับขอบเขตให้เทียบกันก่อนราคา</title><desc id="desc">A ราคา 300,000 บาท ส่วน B 280,000 บวกงานเข้าถึง 25,000 รวม 305,000 เพื่อเทียบ</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="433.37" lengthAdjust="spacingAndGlyphs">ปรับขอบเขตให้เทียบกันก่อนราคา</tspan></text><g class="diagram-card" data-node="0"><rect x="40" y="131" width="216" height="287" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="131" width="216" height="7" fill="#24463e"/><text x="148" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="148" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="219" textLength="124.59" lengthAdjust="spacingAndGlyphs">ข้อเสนอ A</tspan></text><text x="148" y="269" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="269" textLength="163.93" lengthAdjust="spacingAndGlyphs">300,000 บาท รวม</tspan><tspan x="148" y="303" textLength="158.55" lengthAdjust="spacingAndGlyphs">งานเข้าถึงที่ตกลง</tspan></text></g><g class="diagram-card" data-node="1"><rect x="288" y="131" width="216" height="287" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="288" y="131" width="216" height="7" fill="#006f6b"/><text x="396" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="396" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="219" textLength="124.59" lengthAdjust="spacingAndGlyphs">ข้อเสนอ B</tspan></text><text x="396" y="269" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="269" textLength="143.14" lengthAdjust="spacingAndGlyphs">280,000 บาท ไม่</tspan><tspan x="396" y="303" textLength="131.67" lengthAdjust="spacingAndGlyphs">รวมงานเข้าถึง</tspan></text></g><g class="diagram-card" data-node="2"><rect x="536" y="131" width="216" height="287" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="536" y="131" width="216" height="7" fill="#24463e"/><text x="644" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="644" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="219" textLength="168.68" lengthAdjust="spacingAndGlyphs">B เมื่อปรับเพื่อ</tspan><tspan x="644" y="263" textLength="62.06" lengthAdjust="spacingAndGlyphs">เทียบ</tspan></text><text x="644" y="313" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="313" textLength="154.14" lengthAdjust="spacingAndGlyphs">บวกค่างานเข้าถึง</tspan><tspan x="644" y="347" textLength="160.86" lengthAdjust="spacingAndGlyphs">ยืนยันแล้ว 25,000</tspan><tspan x="644" y="381" textLength="35.91" lengthAdjust="spacingAndGlyphs">บาท</tspan></text></g><g class="diagram-card" data-node="3"><rect x="784" y="131" width="216" height="287" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="784" y="131" width="216" height="7" fill="#006f6b"/><text x="892" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="892" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="219" textLength="163.99" lengthAdjust="spacingAndGlyphs">เทียบหลักฐาน</tspan></text><text x="892" y="269" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="269" textLength="149.31" lengthAdjust="spacingAndGlyphs">ตรวจรุ่น การรับ</tspan><tspan x="892" y="303" textLength="128.1" lengthAdjust="spacingAndGlyphs">ประกัน และข้อ</tspan><tspan x="892" y="337" textLength="100.17" lengthAdjust="spacingAndGlyphs">ยกเว้นด้วย</tspan></text></g></svg>
