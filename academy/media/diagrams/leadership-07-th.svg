<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="454" viewBox="0 0 1040 454" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">ความก้าวหน้ามีมากกว่าการจ่าย</title><desc id="desc">สี่สถานะแยกการติดตั้ง ผลผ่านทดสอบ การรับรองที่ต้องมี และการจ่ายตามสัญญา</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="413.4" lengthAdjust="spacingAndGlyphs">ความก้าวหน้ามีมากกว่าการจ่าย</tspan></text><g class="diagram-card" data-node="0"><rect x="40" y="131" width="216" height="287" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="131" width="216" height="7" fill="#24463e"/><text x="148" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="148" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="219" textLength="144.05" lengthAdjust="spacingAndGlyphs">งานกายภาพ</tspan><tspan x="148" y="263" textLength="62.06" lengthAdjust="spacingAndGlyphs">เสร็จ</tspan></text><text x="148" y="313" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="313" textLength="156.87" lengthAdjust="spacingAndGlyphs">ติดตั้งอุปกรณ์ตาม</tspan><tspan x="148" y="347" textLength="73.29" lengthAdjust="spacingAndGlyphs">ขอบเขต</tspan></text></g><g class="diagram-card" data-node="1"><rect x="288" y="131" width="216" height="287" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="288" y="131" width="216" height="7" fill="#006f6b"/><text x="396" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="396" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="219" textLength="119.9" lengthAdjust="spacingAndGlyphs">ผลทำงาน</tspan><tspan x="396" y="263" textLength="121.31" lengthAdjust="spacingAndGlyphs">ยืนยันแล้ว</tspan></text><text x="396" y="313" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="313" textLength="161.28" lengthAdjust="spacingAndGlyphs">ผลทดสอบที่ต้องมี</tspan><tspan x="396" y="347" textLength="161.28" lengthAdjust="spacingAndGlyphs">ผูกกับอุปกรณ์จริง</tspan></text></g><g class="diagram-card" data-node="2"><rect x="536" y="131" width="216" height="287" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="536" y="131" width="216" height="7" fill="#24463e"/><text x="644" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="644" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="219" textLength="155.84" lengthAdjust="spacingAndGlyphs">การรับรองที่</tspan><tspan x="644" y="263" textLength="80.03" lengthAdjust="spacingAndGlyphs">จำเป็น</tspan></text><text x="644" y="313" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="313" textLength="128.73" lengthAdjust="spacingAndGlyphs">ติดตามเงื่อนไข</tspan><tspan x="644" y="347" textLength="171.57" lengthAdjust="spacingAndGlyphs">หน่วยงานและลูกค้า</tspan><tspan x="644" y="381" textLength="63.84" lengthAdjust="spacingAndGlyphs">แยกกัน</tspan></text></g><g class="diagram-card" data-node="3"><rect x="784" y="131" width="216" height="287" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="784" y="131" width="216" height="7" fill="#006f6b"/><text x="892" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="892" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="219" textLength="144.05" lengthAdjust="spacingAndGlyphs">การจ่ายตาม</tspan><tspan x="892" y="263" textLength="65.99" lengthAdjust="spacingAndGlyphs">สัญญา</tspan></text><text x="892" y="313" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="313" textLength="174.93" lengthAdjust="spacingAndGlyphs">จ่ายตามหมุดหมายที่</tspan><tspan x="892" y="347" textLength="122.64" lengthAdjust="spacingAndGlyphs">ตกลงในสัญญา</tspan></text></g></svg>
