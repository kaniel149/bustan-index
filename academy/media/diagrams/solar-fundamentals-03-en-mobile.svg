<svg xmlns="http://www.w3.org/2000/svg" width="480" height="959" viewBox="0 0 480 959" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Four jobs around the module</title><desc id="desc">Conversion, protection, measurement and monitoring are separate system functions.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="345.9" lengthAdjust="spacingAndGlyphs">Four jobs around the module</tspan></text><g class="diagram-card" data-node="0"><rect x="28" y="121" width="424" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="121" width="424" height="7" fill="#24463e"/><text x="240" y="160" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="160" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="206" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="206" textLength="98.31" lengthAdjust="spacingAndGlyphs">Convert</tspan></text><text x="240" y="253" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="253" textLength="264.18" lengthAdjust="spacingAndGlyphs">Inverter manages electrical</tspan><tspan x="240" y="285" textLength="106.37" lengthAdjust="spacingAndGlyphs">conversion</tspan></text></g><g class="diagram-card" data-node="1"><rect x="28" y="339" width="424" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="339" width="424" height="7" fill="#006f6b"/><text x="240" y="378" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="378" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="240" y="424" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="424" textLength="88.96" lengthAdjust="spacingAndGlyphs">Protect</tspan></text><text x="240" y="471" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="471" textLength="329.08" lengthAdjust="spacingAndGlyphs">Selected devices address defined</tspan><tspan x="240" y="503" textLength="52.58" lengthAdjust="spacingAndGlyphs">faults</tspan></text></g><g class="diagram-card" data-node="2"><rect x="28" y="557" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="557" width="424" height="7" fill="#24463e"/><text x="240" y="596" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="596" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="240" y="642" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="642" textLength="109.23" lengthAdjust="spacingAndGlyphs">Measure</tspan></text><text x="240" y="689" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="689" textLength="331.56" lengthAdjust="spacingAndGlyphs">Meter location defines the reading</tspan></text></g><g class="diagram-card" data-node="3"><rect x="28" y="757" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="757" width="424" height="7" fill="#006f6b"/><text x="240" y="796" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="796" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="240" y="842" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="842" textLength="93.62" lengthAdjust="spacingAndGlyphs">Monitor</tspan></text><text x="240" y="889" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="889" textLength="374.26" lengthAdjust="spacingAndGlyphs">Software interprets available telemetry</tspan></text></g></svg>
