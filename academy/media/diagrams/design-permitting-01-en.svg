<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="492" viewBox="0 0 1040 492" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">From property to design brief</title><desc id="desc">Four stages connect meter scope, evidence, unresolved gaps and the design brief.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="400.8" lengthAdjust="spacingAndGlyphs">From property to design brief</tspan></text><g class="diagram-card" data-node="0"><rect x="40" y="127" width="216" height="329" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="127" width="216" height="7" fill="#24463e"/><text x="148" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="148" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="212" textLength="81.15" lengthAdjust="spacingAndGlyphs">Define</tspan><tspan x="148" y="252" textLength="117.07" lengthAdjust="spacingAndGlyphs">boundary</tspan></text><text x="148" y="298" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="298" textLength="156.49" lengthAdjust="spacingAndGlyphs">Identify property,</tspan><tspan x="148" y="329" textLength="94.58" lengthAdjust="spacingAndGlyphs">meter and</tspan><tspan x="148" y="360" textLength="134.27" lengthAdjust="spacingAndGlyphs">included loads</tspan></text></g><path d="M260 291.5 L279 291.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="288" y="127" width="216" height="329" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="288" y="127" width="216" height="7" fill="#006f6b"/><text x="396" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="396" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="212" textLength="85.81" lengthAdjust="spacingAndGlyphs">Collect</tspan><tspan x="396" y="252" textLength="112.38" lengthAdjust="spacingAndGlyphs">evidence</tspan></text><text x="396" y="298" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="298" textLength="85.22" lengthAdjust="spacingAndGlyphs">Separate</tspan><tspan x="396" y="329" textLength="99.25" lengthAdjust="spacingAndGlyphs">measured,</tspan><tspan x="396" y="360" textLength="119.11" lengthAdjust="spacingAndGlyphs">reported and</tspan><tspan x="396" y="391" textLength="80.54" lengthAdjust="spacingAndGlyphs">modeled</tspan><tspan x="396" y="422" textLength="103.87" lengthAdjust="spacingAndGlyphs">information</tspan></text></g><path d="M508 291.5 L527 291.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="536" y="127" width="216" height="329" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.