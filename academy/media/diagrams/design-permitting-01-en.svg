ext x="892" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="258" textLength="170.5" lengthAdjust="spacingAndGlyphs">Record scope and</tspan><tspan x="892" y="289" textLength="170.46" lengthAdjust="spacingAndGlyphs">unresolved design</tspan><tspan x="892" y="320" textLength="101.54" lengthAdjust="spacingAndGlyphs">constraints</tspan></text></g></svg>
