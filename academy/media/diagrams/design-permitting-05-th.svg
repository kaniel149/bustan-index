<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="376" viewBox="0 0 1040 376" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">พลังงาน กำลัง และโหมดทำงาน</title><desc id="desc">สามขอบเขตออกแบบแยกพลังงานใช้ได้ กำลังพร้อมกัน และโหมดกริดหรือสำรอง</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="421.2" lengthAdjust="spacingAndGlyphs">พลังงาน กำลัง และโหมดทำงาน</tspan></text><g class="diagram-card" data-node="0"><rect x="40" y="131" width="298.67" height="209" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="131" width="298.67" height="7" fill="#24463e"/><text x="189.33" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="189.33" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="189.33" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="189.33" y="219" textLength="137.87" lengthAdjust="spacingAndGlyphs">งบพลังงาน</tspan></text><text x="189.33" y="269" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="189.33" y="269" textLength="227.43" lengthAdjust="spacingAndGlyphs">พลังงานใช้ได้กำหนดระยะ</tspan><tspan x="189.33" y="303" textLength="182.07" lengthAdjust="spacingAndGlyphs">เวลาตามแบบจำลอง</tspan></text></g><g class="diagram-card" data-node="1"><rect x="370.67" y="131" width="298.67" height="209" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="370.67" y="131" width="298.67" height="7" fill="#006f6b"/><text x="520" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="520" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="219" textLength="179.71" lengthAdjust="spacingAndGlyphs">ขีดจำกัดกำลัง</tspan></text><text x="520" y="269" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="269" textLength="213.78" lengthAdjust="spacingAndGlyphs">โหลดพร้อมกันต้องอยู่ใน</tspan><tspan x="520" y="303" textLength="228.69" lengthAdjust="spacingAndGlyphs">ความสามารถของอุปกรณ์</tspan></text></g><g class="diagram-card" data-node="2"><rect x="701.33" y="131" width="298.67" height="209" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="701.33" y="131" width="298.67" height="7" fill="#24463e"/><text x="850.67" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="850.67" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="850.67" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="850.67" y="219" textLength="160.06" lengthAdjust="spacingAndGlyphs">ขอบเขตโหมด</tspan></text><text x="850.67" y="269" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="850.67" y="269" textLength="214.28" lengthAdjust="spacingAndGlyphs">ระบบกริด ไฟดับ และ EV</tspan><tspan x="850.67" y="303" textLength="166.95" lengthAdjust="spacingAndGlyphs">ต้องมีหลักฐานแยก</tspan></text></g></svg>
