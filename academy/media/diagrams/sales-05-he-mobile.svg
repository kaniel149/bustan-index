<svg xmlns="http://www.w3.org/2000/svg" width="480" height="997" viewBox="0 0 480 997" lang="he" xml:lang="he" role="img" aria-labelledby="title desc"><title id="title">האם לכלול הכנסה מייצוא?</title><desc id="desc">הכנסת ייצוא תלויה בראיות לנכס המסוים, ולא בעצם קיומה של הודעה כללית.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="346.92" lengthAdjust="spacingAndGlyphs">האם לכלול הכנסה מייצוא?</tspan></text><g class="diagram-card" data-node="0"><rect x="30" y="121" width="420" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="30" y="121" width="420" height="7" fill="#24463e"/><text x="240" y="160" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="160" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="206" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="240" y="206" textLength="133.66" lengthAdjust="spacingAndGlyphs">יש ראיות?</tspan></text><text x="240" y="253" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="240" y="253" textLength="343.64" lengthAdjust="spacingAndGlyphs">בדיקת חשבון, אישור ותנאי רכישה</tspan></text></g><path d="M453 211 H464 V862" stroke="#006f6b" stroke-width="3" fill="none"/><path d="M464 423 L432 423" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="28" y="333" width="396" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="333" width="396" height="7" fill="#006f6b"/><text x="226" y="372" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="226" y="372" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="226" y="418" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="226" y="418" textLength="254.97" lengthAdjust="spacingAndGlyphs">הודעה כללית בלבד</tspan></text><text x="226" y="465" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="226" y="465" textLength="313.72" lengthAdjust="spacingAndGlyphs">אינה מוכיחה זכאות לנכס הזה</tspan></text></g><path d="M464 638 L432 638" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="28" y="539" width="396" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="539" width="396" height="7" fill="#24463e"/><text x="226" y="578" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="226" y="578" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="226" y="624" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="226" y="624" textLength="163.99" lengthAdjust="spacingAndGlyphs">הסכם מאומת</tspan></text><text x="226" y="671" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="226" y="671" textLength="296.56" lengthAdjust="spacingAndGlyphs">משתמשים בתנאיו הרלוונטיים</tspan><tspan x="226" y="703" textLength="65.12" lengthAdjust="spacingAndGlyphs">בפועל</tspan></text></g><path d="M464 862 L432 862" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="28" y="763" width="396" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="763" width="396" height="7" fill="#006f6b"/><text x="226" y="802" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="226" y="802" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="226" y="848" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="226" y="848" textLength="226.61" lengthAdjust="spacingAndGlyphs">הכנסה לא פתורה</tspan></text><text x="226" y="895" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="226" y="895" textLength="315.26" lengthAdjust="spacingAndGlyphs">מחריגים מתרחיש בסיס; עוקבים</tspan><tspan x="226" y="927" textLength="71.5" lengthAdjust="spacingAndGlyphs">בנפרד</tspan></text></g></svg>
