<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="399" viewBox="0 0 1040 399" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Three different release stages</title><desc id="desc">Construction completion leads to commissioning readiness, then a separate authorized release.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="414.65" lengthAdjust="spacingAndGlyphs">Three different release stages</tspan></text><g class="diagram-card" data-node="0"><rect x="40" y="127" width="298.67" height="236" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="127" width="298.67" height="7" fill="#24463e"/><text x="189.33" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="189.33" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="189.33" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="189.33" y="212" textLength="157.61" lengthAdjust="spacingAndGlyphs">Construction</tspan><tspan x="189.33" y="252" textLength="113.92" lengthAdjust="spacingAndGlyphs">complete</tspan></text><text x="189.33" y="298" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="189.33" y="298" textLength="240.53" lengthAdjust="spacingAndGlyphs">Installed work matches its</tspan><tspan x="189.33" y="329" textLength="183.35" lengthAdjust="spacingAndGlyphs">documented scope.</tspan></text></g><path d="M342.67 245 L361.67 245" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="370.67" y="127" width="298.67" height="236" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="370.67" y="127" width="298.67" height="7" fill="#006f6b"/><text x="520" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="520" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="212" textLength="121.78" lengthAdjust="spacingAndGlyphs">Ready for</tspan><tspan x="520" y="252" textLength="185.66" lengthAdjust="spacingAndGlyphs">commissioning</tspan></text><text x="520" y="298" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="298" textLength="212.58" lengthAdjust="spacingAndGlyphs">Evidence and safe test</tspan><tspan x="520" y="329" textLength="225.39" lengthAdjust="spacingAndGlyphs">conditions are available.</tspan></text></g><path d="M673.33 245 L692.33 245" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="701.33" y="127" width="298.67" height="236" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="701.33" y="127" width="298.67" height="7" fill="#24463e"/><text x="850.67" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="850.67" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="850.67" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="850.67" y="212" textLength="234.16" lengthAdjust="spacingAndGlyphs">Authorized release</tspan></text><text x="850.67" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="850.67" y="258" textLength="239.38" lengthAdjust="spacingAndGlyphs">Required acceptance and</tspan><tspan x="850.67" y="289" textLength="239.36" lengthAdjust="spacingAndGlyphs">permissions are resolved.</tspan></text></g></svg>
