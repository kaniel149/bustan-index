<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="627" viewBox="0 0 1040 627" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Close the maintenance loop</title><desc id="desc">The maintenance cycle links performance observation, evidence triage, qualified action and verified service records.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="386.91" lengthAdjust="spacingAndGlyphs">Close the maintenance loop</tspan></text><path d="M474 225 L561 225" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M780 327 L780 386" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M566 493 L479 493" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M260 391 L260 332" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="0"><rect x="50" y="127" width="420" height="196" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="50" y="127" width="420" height="7" fill="#24463e"/><text x="260" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="260" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="260" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="260" y="212" textLength="271.59" lengthAdjust="spacingAndGlyphs">Observe performance</tspan></text><text x="260" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="260" y="258" textLength="357.32" lengthAdjust="spacingAndGlyphs">Compare signals with the documented</tspan><tspan x="260" y="289" textLength="78.2" lengthAdjust="spacingAndGlyphs">baseline</tspan></text></g><g class="diagram-card" data-node="1"><rect x="570" y="127" width="420" height="196" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="570" y="127" width="420" height="7" fill="#006f6b"/><text x="780" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="780" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="780" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="780" y="212" textLength="199.82" lengthAdjust="spacingAndGlyphs">Triage evidence</tspan></text><text x="780" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="780" y="258" textLength="334.03" lengthAdjust="spacingAndGlyphs">Check data quality and prioritize the</tspan><tspan x="780" y="289" textLength="49.01" lengthAdjust="spacingAndGlyphs">issue</tspan></text></g><g class="diagram-card" data-node="2"><rect x="570" y="395" width="420" height="196" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="570" y="395" width="420" height="7" fill="#24463e"/><text x="780" y="434" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="780" y="434" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="780" y="480" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="780" y="480" textLength="279.48" lengthAdjust="spacingAndGlyphs">Assign qualified action</tspan></text><text x="780" y="526" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="780" y="526" textLength="341" lengthAdjust="spacingAndGlyphs">Coordinate access, competence and</tspan><tspan x="780" y="557" textLength="214.81" lengthAdjust="spacingAndGlyphs">manufacturer guidance</tspan></text></g><g class="diagram-card" data-node="3"><rect x="50" y="395" width="420" height="196" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="50" y="395" width="420" height="7" fill="#006f6b"/><text x="260" y="434" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="260" y="434" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="260" y="480" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="260" y="480" textLength="213.91" lengthAdjust="spacingAndGlyphs">Verify and record</tspan></text><text x="260" y="526" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="260" y="526" textLength="366.68" lengthAdjust="spacingAndGlyphs">Confirm outcome and retain the service</tspan><tspan x="260" y="557" textLength="61.85" lengthAdjust="spacingAndGlyphs">history</tspan></text></g></svg>
