<svg xmlns="http://www.w3.org/2000/svg" width="480" height="979" viewBox="0 0 480 979" lang="he" xml:lang="he" role="img" aria-labelledby="title desc"><title id="title">מה משמעות השקט?</title><desc id="desc">שקט בניטור מתפצל להסלמת סכנה, בדיקת תקשורת ומצב חשמלי שטרם אומת.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="239.84" lengthAdjust="spacingAndGlyphs">מה משמעות השקט?</tspan></text><g class="diagram-card" data-node="0"><rect x="30" y="121" width="420" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="30" y="121" width="420" height="7" fill="#24463e"/><text x="240" y="160" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="160" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="206" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="240" y="206" textLength="196.56" lengthAdjust="spacingAndGlyphs">הניטור נעצר?</tspan></text><text x="240" y="253" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="240" y="253" textLength="323.18" lengthAdjust="spacingAndGlyphs">מפרידים סכנות, תקשורת וראיות</tspan><tspan x="240" y="285" textLength="63.36" lengthAdjust="spacingAndGlyphs">חשמל.</tspan></text></g><path d="M453 220 H464 V853" stroke="#006f6b" stroke-width="3" fill="none"/><path d="M464 441 L432 441" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="28" y="351" width="396" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="351" width="396" height="7" fill="#006f6b"/><text x="226" y="390" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="226" y="390" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="226" y="436" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="226" y="436" textLength="155.84" lengthAdjust="spacingAndGlyphs">דווחה סכנה</tspan></text><text x="226" y="483" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="226" y="483" textLength="343.64" lengthAdjust="spacingAndGlyphs">מסלימים לפי תוכנית חירום באתר.</tspan></text></g><path d="M464 647 L432 647" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="28" y="557" width="396" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="557" width="396" height="7" fill="#24463e"/><text x="226" y="596" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="226" y="596" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="226" y="642" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="226" y="642" textLength="200.21" lengthAdjust="spacingAndGlyphs">נתיב מידע חסר</tspa