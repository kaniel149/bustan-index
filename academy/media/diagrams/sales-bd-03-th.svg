<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="454" viewBox="0 0 1040 454" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">เทียบความสัมพันธ์ด้านการจ่ายเงิน</title><desc id="desc">EPC PPA และเช่าต่างกันในสิ่งที่ซื้อ ต้องเทียบเจ้าของ บริการ ระยะเวลา และภาระเมื่อจบ</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="451.15" lengthAdjust="spacingAndGlyphs">เทียบความสัมพันธ์ด้านการจ่ายเงิน</tspan></text><g class="diagram-card" data-node="0"><rect x="40" y="131" width="216" height="287" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="131" width="216" height="7" fill="#24463e"/><text x="148" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="148" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="219" textLength="150.96" lengthAdjust="spacingAndGlyphs">ซื้อแบบ EPC</tspan></text><text x="148" y="269" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="269" textLength="149.52" lengthAdjust="spacingAndGlyphs">ลูกค้าซื้อขอบเขต</tspan><tspan x="148" y="303" textLength="120.96" lengthAdjust="spacingAndGlyphs">ติดตั้งที่ตกลง</tspan></text></g><g class="diagram-card" data-node="1"><rect x="288" y="131" width="216" height="287" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="288" y="131" width="216" height="7" fill="#006f6b"/><text x="396" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="396" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="219" textLength="56.19" lengthAdjust="spacingAndGlyphs">PPA</tspan></text><text x="396" y="269" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="269" textLength="170.52" lengthAdjust="spacingAndGlyphs">จ่ายค่าพลังงานตาม</tspan><tspan x="396" y="303" textLength="100.38" lengthAdjust="spacingAndGlyphs">สัญญาเฉพาะ</tspan></text></g><g class="diagram-card" data-node="2"><rect x="536" y="131" width="216" height="287" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="536" y="131" width="216" height="7" fill="#24463e"/><text x="644" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="644" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="219" textLength="38.19" lengthAdjust="spacingAndGlyphs">เช่า</tspan></text><text x="644" y="269" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="269" textLength="152.88" lengthAdjust="spacingAndGlyphs">ค่าเช่าตามเงื่อนไข</tspan><tspan x="644" y="303" textLength="129.99" lengthAdjust="spacingAndGlyphs">สินทรัพย์ที่ระบุ</tspan></text></g><g class="diagram-card" data-node="3"><rect x="784" y="131" width="216" height="287" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="784" y="131" width="216" height="7" fill="#006f6b"/><text x="892" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="892" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="219" textLength="163.99" lengthAdjust="spacingAndGlyphs">ฐานเทียบร่วม</tspan><tspan x="892" y="263" textLength="35.94" lengthAdjust="spacingAndGlyphs">กัน</tspan></text><text x="892" y="313" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="313" textLength="137.55" lengthAdjust="spacingAndGlyphs">เจ้าของ บริการ</tspan><tspan x="892" y="347" textLength="170.31" lengthAdjust="spacingAndGlyphs">ระยะเวลา และภาระ</tspan><tspan x="892" y="381" textLength="59.85" lengthAdjust="spacingAndGlyphs">เมื่อจบ</tspan></text></g></svg>
