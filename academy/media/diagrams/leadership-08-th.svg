<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="729" viewBox="0 0 1040 729" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">ตรวจความจุบริการก่อนสัญญา</title><desc id="desc">แท่งสามแท่งเทียบงานผูกพันหกสิบชั่วโมง เวลาผู้มีคุณสมบัติแปดสิบชั่วโมง และเก้าสิบชั่วโมงหลังรับงานใหม่</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="399.67" lengthAdjust="spacingAndGlyphs">ตรวจความจุบริการก่อนสัญญา</tspan></text><g class="diagram-bar" data-node="0"><text x="40" y="158" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="158" textLength="163.99" lengthAdjust="spacingAndGlyphs">งานผูกพันเดิม</tspan></text><text x="40" y="201" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="201" textLength="325.15" lengthAdjust="spacingAndGlyphs">60 ชั่วโมงผู้มีคุณสมบัติ · ตัวอย่างฝึก</tspan></text><rect x="40" y="225" width="960" height="28" rx="3" fill="#dedfce"/><rect x="40" y="225" width="640" height="28" rx="3" fill="#24463e"/><text x="40" y="284" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="284" textLength="343.35" lengthAdjust="spacingAndGlyphs">บริการ งานหน้างาน เดินทาง และบันทึก</tspan></text></g><g class="diagram-bar" data-node="1"><text x="40" y="354" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="354" textLength="241.77" lengthAdjust="spacingAndGlyphs">ชั่วโมงทีมมีคุณสมบัติ</tspan></text><text x="40" y="397" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="397" textLength="325.15" lengthAdjust="spacingAndGlyphs">80 ชั่วโมงผู้มีคุณสมบัติ · ตัวอย่างฝึก</tspan></text><rect x="40" y="421" width="960" height="28" rx="3" fill="#dedfce"/><rect x="40" y="421" width="853.33" height="28" rx="3" fill="#006f6b"/><text x="40" y="480" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="480" textLength="355.95" lengthAdjust="spacingAndGlyphs">ชั่วโมงผู้มีคุณสมบัติที่ใช้ได้ในช่วงตัวอย่าง</tspan></text></g><g class="diagram-bar" data-node="2"><text x="40" y="550" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="550" textLength="146.02" lengthAdjust="spacingAndGlyphs">รวมงานใหม่</tspan></text><text x="40" y="593" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="593" textLength="325.15" lengthAdjust="spacingAndGlyphs">90 ชั่วโมงผู้มีคุณสมบัติ · ตัวอย่างฝึก</tspan></text><rect x="40" y="617" width="960" height="28" rx="3" fill="#dedfce"/><rect x="40" y="617" width="960" height="28" rx="3" fill="#24463e"/><text x="40" y="676" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="676" textLength="318.65" lengthAdjust="spacingAndGlyphs">เดิม 60 บวกงานเสนอใหม่