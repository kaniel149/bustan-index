<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="430" viewBox="0 0 1040 430" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Close each fault separately</title><desc id="desc">Three cards show one verified communication closure and two unresolved battery and physical paths.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="376.49" lengthAdjust="spacingAndGlyphs">Close each fault separately</tspan></text><g class="diagram-card" data-node="0"><rect x="40" y="127" width="298.67" height="267" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="127" width="298.67" height="7" fill="#24463e"/><text x="189.33" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="189.33" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="189.33" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="189.33" y="212" textLength="209.08" lengthAdjust="spacingAndGlyphs">Communications</tspan><tspan x="189.33" y="252" textLength="103" lengthAdjust="spacingAndGlyphs">restored</tspan></text><text x="189.33" y="298" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="189.33" y="298" textLength="246.41" lengthAdjust="spacingAndGlyphs">Current plausible data and</tspan><tspan x="189.33" y="329" textLength="258.05" lengthAdjust="spacingAndGlyphs">notification delivery verified.</tspan></text></g><g class="diagram-card" data-node="1"><rect x="370.67" y="127" width="298.67" height="267" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="370.67" y="127" width="298.67" height="7" fill="#006f6b"/><text x="520" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="520" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="212" textLength="246.63" lengthAdjust="spacingAndGlyphs">Battery assessment</tspan><tspan x="520" y="252" textLength="62.45" lengthAdjust="spacingAndGlyphs">open</tspan></text><text x="520" y="298" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="298" textLength="201.92" lengthAdjust="spacingAndGlyphs">Preserve permissions</tspan><tspan x="520" y="329" textLength="228.86" lengthAdjust="spacingAndGlyphs">pending specialist cause</tspan><tspan x="520" y="360" textLength="66.55" lengthAdjust="spacingAndGlyphs">review.</tspan></text></g><g class="diagram-card" data-node="2"><rect x="701.33" y="127" width="298.67" height="267" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="701.33" y="127" width="298.67" height="7" fill="#24463e"/><text x="850.67" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="850.67" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="850.67" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="850.67" y="212" textLength="234.1" lengthAdjust="spacingAndGlyphs">Physical restriction</tspan><tspan x="850.67" y="252" textLength="62.45" lengthAdjust="spacingAndGlyphs">open</tspan></text><text x="850.67" y="298" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="850.67" y="298" textLength="239.36" lengthAdjust="spacingAndGlyphs">Authorized correction and</tspan><tspan x="850.67" y="329" textLength="179.82" lengthAdjust="spacingAndGlyphs">acceptance are still</tspan><tspan x="850.67" y="360" textLength="82.91" lengthAdjust="spacingAndGlyphs">required.</tspan></text></g></svg>
