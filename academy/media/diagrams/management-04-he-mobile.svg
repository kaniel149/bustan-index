<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1049" viewBox="0 0 480 1049" lang="he" xml:lang="he" role="img" aria-labelledby="title desc"><title id="title">סוגרים את מעגל התחזוקה</title><desc id="desc">מעגל התחזוקה מחבר תצפית ביצועים, מיון ראיות, פעולה כשירה ותיעוד שירות מאומת.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="333.13" lengthAdjust="spacingAndGlyphs">סוגרים את מעגל התחזוקה</tspan></text><g class="diagram-card" data-node="0"><rect x="40" y="121" width="400" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="121" width="400" height="7" fill="#24463e"/><text x="240" y="160" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="160" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="206" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="240" y="206" textLength="194.31" lengthAdjust="spacingAndGlyphs">תצפית ביצועים</tspan></text><text x="240" y="253" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="240" y="253" textLength="288.42" lengthAdjust="spacingAndGlyphs">משווים אותות לבסיס המתועד</tspan></text></g><path d="M240 305 L240 330" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#ar