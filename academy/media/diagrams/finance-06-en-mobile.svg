<svg xmlns="http://www.w3.org/2000/svg" width="480" height="680" viewBox="0 0 480 680" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Cash available versus debt due</title><desc id="desc">Annual CFADS of 120,000 or 80,000 THB compared with 100,000 THB debt service.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="377.45" lengthAdjust="spacingAndGlyphs">Cash available versus debt due</tspan></text><g class="diagram-bar" data-node="0"><text x="28" y="146" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="146" textLength="231.32" lengthAdjust="spacingAndGlyphs">Base cash available</tspan></text><text x="28" y="184" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="184" textLength="273" lengthAdjust="spacingAndGlyphs">120000 THB per training year</tspan></text><rect x="28" y="205" width="424" height="28" rx="3" fill="#dedfce"/><rect x="28" y="205" width="424" height="28" rx="3" fill="#24463e"/><text x="28" y="264" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="264" textLength="218.34" lengthAdjust="spacingAndGlyphs">Defined annual CFADS</tspan></text></g><g class="diagram-bar" data-node="1"><text x="28" y="329" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="329" textLength="270.35" lengthAdjust="spacingAndGlyphs">Scheduled debt service</tspan></text><text x="28" y="367" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="367" textLength="273" lengthAdjust="spacingAndGlyphs">100000 THB per training year</tspan></text><rect x="28" y="388" width="424" height="28" rx="3" fill="#dedfce"/><rect x="28" y="388" width="353.33" height="28" rx="3" fill="#006f6b"/><text x="28" y="447" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="447" textLength="315.88" lengthAdjust="spacingAndGlyphs">80,000 principal + 20,000 interest</tspan></text></g><g class="diagram-bar" data-node="2"><text x="28" y="512" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="512" textLength="286.21" lengthAdjust="spacingAndGlyphs">Downside cash available</tspan></text><text x="28" y="550" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="550" textLength="261.44" lengthAdjust="spacingAndGlyphs">80000 THB per training year</tspan></text><rect x="28" y="571" width="424" height="28" rx="3" fill="#dedfce"/><rect x="28" y="571" width="282.67" height="28" rx="3" fill="#24463e"/><text x="28" y="630" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="630" textLength="300.15" lengthAdjust="spacingAndGlyphs">Same period and cash definition</tspan></text></g></svg>
