<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1098" viewBox="0 0 480 1098" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">ประเมินใหม่เมื่อสภาพงานเปลี่ยน</title><desc id="desc">วงจรความปลอดภัยกำหนดงาน ประเมินอันตราย ยืนยันพร้อม และกลับไปทบทวนเมื่อสภาพเปลี่ยน</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="360.44" lengthAdjust="spacingAndGlyphs">ประเมินใหม่เมื่อสภาพงานเปลี่ยน</tspan></text><g class="diagram-card" data-node="0"><rect x="40" y="125" width="400" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="125" width="400" height="7" fill="#24463e"/><text x="240" y="164" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="164" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="213" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="213" textLength="137.87" lengthAdjust="spacingAndGlyphs">กำหนดงาน</tspan></text><text x="240" y="264" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="264" textLength="342.32" lengthAdjust="spacingAndGlyphs">ระบุสถานที่ คน และกิจกรรมที่กระทบ</tspan></text></g><path d="M240 309 L240 334" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="40" y="343" width="400" height="213" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="343" width="400" height="7" fill="#006f6b"/><text x="240" y="382" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="382" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="240" y="431" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="431" textLength="194.03" lengthAdjust="spacingAndGlyphs">ประเมินอันตราย</tspan></text><text x="240" y="482" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="482" textLength="280.06" lengthAdjust="spacingAndGlyphs">ใช้ผู้มีความสามารถทบทวนและ</tspan><tspan x="240" y="518" textLength="185.02" lengthAdjust="spacingAndGlyphs">มาตรการเฉพาะพื้นที่</tspan></text></g><path d="M240 560 L240 585" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="40" y="594" width="400" height="213" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="594" width="400" height="7" fill="#24463e"/><text x="240" y="633" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="633" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="240" y="682" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="682" textLength="209.76" lengthAdjust="spacingAndGlyphs">ยืนยันความพร้อม</tspan></text><text x="240" y="733" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="733" textLength="334.18" lengthAdjust="spacingAndGlyphs">ยืนยันมาตรการ การสื่อสาร และแผน</tspan><tspan x="240" y="769" textLength="98.56" lengthAdjust="spacingAndGlyphs">ตอบสนอง</tspan></text></g><path d="M240 811 L240 836" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="40" y="845" width="400" height="213" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="845" width="400" height="7" fill="#006f6b"/><text x="240" y="884" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="884" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="240" y="933" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="933" textLength="187.29" lengthAdjust="spacingAndGlyphs">หยุดและทบทวน</tspan></text><text x="240" y="984" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="984" textLength="285.12" lengthAdjust="spacingAndGlyphs">สภาพเปลี่ยนต้องนำงานกลับไป</tspan><tspan x="240" y="1020" textLength="72.16" lengthAdjust="spacingAndGlyphs">ประเมิน</tspan></text></g><path d="M444 951.5 H464 V215 H449" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/></svg>
