<svg xmlns="http://www.w3.org/2000/svg" width="480" height="711" viewBox="0 0 480 711" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">เงาบังเปลี่ยนประมาณการ</title><desc id="desc">แท่งสามแท่งแสดง 15,000, 14,100 และ 12,900 กิโลวัตต์ชั่วโมงต่อปีตามสมมติฐานเงาบังสำหรับฝึก</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="287.16" lengthAdjust="spacingAndGlyphs">เงาบังเปลี่ยนประมาณการ</tspan></text><g class="diagram-bar" data-node="0"><text x="28" y="150" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="150" textLength="239.2" lengthAdjust="spacingAndGlyphs">ไม่มีการสูญเสียจากเงา</tspan></text><text x="28" y="191" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="191" textLength="365.87" lengthAdjust="spacingAndGlyphs">15000 กิโลวัตต์ชั่วโมงต่อปี · ตัวอย่างฝึก</tspan></text><rect x="28" y="215" width="424" height="28" rx="3" fill="#dedfce"/><rect x="28" y="215" width="424" height="28" rx="3" fill="#24463e"/><text x="28" y="274" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="274" textLength="317.1" lengthAdjust="spacingAndGlyphs">ค่าอ้างอิงฝึกก่อนใช้สมมติฐานเงาบัง</tspan></text></g><g class="diagram-bar" data-node="1"><text x="28" y="342" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="342" textLength="200.36" lengthAdjust="spacingAndGlyphs">สูญเสียจากเงา 6%</tspan></text><text x="28" y="383" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="383" textLength="365.87" lengthAdjust="spacingAndGlyphs">14100 กิโลวัตต์ชั่วโมงต่อปี · ตัวอย่างฝึก</tspan></text><rect x="28" y="407" width="424" height="28" rx="3" fill="#dedfce"/><rect x="28" y="407" width="398.56" height="28" rx="3" fill="#006f6b"/><text x="28" y="466" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="466" textLength="133.73" lengthAdjust="spacingAndGlyphs">15,000 × 0.94</tspan></text></g><g class="diagram-bar" data-node="2"><text x="28" y="534" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="534" textLength="214.81" lengthAdjust="spacingAndGlyphs">สูญเสียจากเงา 14%</tspan></text><text x="28" y="575" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="575" textLength="365.87" lengthAdjust="spacingAndGlyphs">12900 กิโลวัตต์ชั่วโมงต่อปี · ตัวอย่างฝึก</tspan></text><rect x="28" y="599" width="424" height="28" rx="3" fill="#dedfce"/><rect x="28" y="599" width="364.64" height="28" rx="3" fill="#24463e"/><text x="28" y="658" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="658" textLength="133.73" lengthAdjust="spacingAndGlyphs">15,000 × 0.86</tspan></text></g></svg>
