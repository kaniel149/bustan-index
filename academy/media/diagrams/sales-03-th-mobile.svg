<svg xmlns="http://www.w3.org/2000/svg" width="480" height="998" viewBox="0 0 480 998" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">พร้อมเสนอข้อเสนอสุดท้ายหรือยัง?</title><desc id="desc">หลังคารั่วนำไปสู่การสำรวจ กำหนดการมีเงื่อนไข หรือพักการผูกพันขั้นสุดท้าย</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="412.36" lengthAdjust="spacingAndGlyphs">พร้อมเสนอข้อเสนอสุดท้ายหรือยัง?</tspan></text><g class="diagram-card" data-node="0"><rect x="30" y="125" width="420" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="30" y="125" width="420" height="7" fill="#24463e"/><text x="240" y="164" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="164" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="213" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="213" textLength="268.16" lengthAdjust="spacingAndGlyphs">หลังคาพร้อมหรือยัง?</tspan></text><text x="240" y="264" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="264" textLength="287.32" lengthAdjust="spacingAndGlyphs">แจ้งว่ารั่ว วางแผนเปลี่ยนปีหน้า</tspan></text></g><path d="M27 215 H16 V855.5" stroke="#006f6b" stroke-width="3" fill="none"/><path d="M16 427 L48 427" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="56" y="337" width="396" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="56" y="337" width="396" height="7" fill="#006f6b"/><text x="254" y="376" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="376" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="254" y="425" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="425" textLength="143.77" lengthAdjust="spacingAndGlyphs">สำรวจก่อน</tspan></text><text x="254" y="476" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="476" textLength="273.9" lengthAdjust="spacingAndGlyphs">ทีมเทคนิคตรวจสอบข้อจำกัด</tspan></text></g><path d="M16 633 L48 633" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="56" y="543" width="396" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="56" y="543" width="396" height="7" fill="#24463e"/><text x="254" y="582" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="582" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="254" y="631" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="631" textLength="244.02" lengthAdjust="spacingAndGlyphs">กำหนดการมีเงื่อนไข</tspan></text><text x="254" y="682" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="682" textLength="302.5" lengthAdjust="spacingAndGlyphs">ประสานงานหลังคากับงานโซลาร์</tspan></text></g><path d="M16 855.5 L48 855.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="56" y="749" width="396" height="213" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="56" y="749" width="396" height="7" fill="#006f6b"/><text x="254" y="788" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="788" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="254" y="837" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="837" textLength="155.84" lengthAdjust="spacingAndGlyphs">พักการผูกพัน</tspan></text><text x="254" y="888" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="888" textLength="303.82" lengthAdjust="spacingAndGlyphs">ข้อจำกัดที่ยังไม่ยุติขวางขอบเขต</tspan><tspan x="254" y="924" textLength="65.78" lengthAdjust="spacingAndGlyphs">สุดท้าย</tspan></text></g></svg>
