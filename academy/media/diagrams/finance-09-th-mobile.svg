<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1064" viewBox="0 0 480 1064" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">พร้อมอนุมัติการเงินหรือยัง?</title><desc id="desc">เงินทุนยังไม่ผูกพันและอัตรากรณีแย่ต่ำกว่าหนึ่งทำให้อนุมัติยังมีเงื่อนไขจนมีหลักฐานแก้ช่องว่าง</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="335.3" lengthAdjust="spacingAndGlyphs">พร้อมอนุมัติการเงินหรือยัง?</tspan></text><g class="diagram-card" data-node="0"><rect x="30" y="125" width="420" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="30" y="125" width="420" height="7" fill="#24463e"/><text x="240" y="164" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="164" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="213" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="213" textLength="313.65" lengthAdjust="spacingAndGlyphs">เงินทุนผูกพันแล้วหรือยัง?</tspan></text><text x="240" y="264" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="264" textLength="285.91" lengthAdjust="spacingAndGlyphs">เสนอหนี้และทุนฝ่ายละ 300,000</tspan></text></g><path d="M27 215 H16 V921.5" stroke="#006f6b" stroke-width="3" fill="none"/><path d="M16 443.5 L48 443.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="56" y="337" width="396" height="213" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="56" y="337" width="396" height="7" fill="#006f6b"/><text x="254" y="376" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="376" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="254" y="425" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="425" textLength="275.75" lengthAdjust="spacingAndGlyphs">ความคุ้มครองกรณีฐาน</tspan></text><text x="254" y="476" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="476" textLength="333.19" lengthAdjust="spacingAndGlyphs">CFADS รายปี 144,000 / ยอดชำระ</tspan><tspan x="254" y="512" textLength="226.12" lengthAdjust="spacingAndGlyphs">หนี้รายปี 96,000 = 1.50</tspan></text></g><path d="M16 682.5 L48 682.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="56" y="576" width="396" height="213" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="56" y="576" width="396" height="7" fill="#24463e"/><text x="254" y="615" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="615" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="254" y="664" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="664" textLength="259.18" lengthAdjust="spacingAndGlyphs">ความคุ้มครองกรณีแย่</tspan></text><text x="254" y="715" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="715" textLength="320.96" lengthAdjust="spacingAndGlyphs">CFADS รายปี 72,000 / ยอดชำระ</tspan><tspan x="254" y="751" textLength="226.12" lengthAdjust="spacingAndGlyphs">หนี้รายปี 96,000 = 0.75</tspan></text></g><path d="M16 921.5 L48 921.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="56" y="815" width="396" height="213" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="56" y="815" width="396" height="7" fill="#006f6b"/><text x="254" y="854" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="854" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="254" y="903" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="903" textLength="222.11" lengthAdjust="spacingAndGlyphs">มีเงื่อนไขหรือพักไว้</tspan></text><text x="254" y="954" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="954" textLength="289.3" lengthAdjust="spacingAndGlyphs">ยืนยันเงินทุนและวิธีปิดช่องว่าง</tspan><tspan x="254" y="990" textLength="111.1" lengthAdjust="spacingAndGlyphs">24,000 บาท</tspan></text></g></svg>
