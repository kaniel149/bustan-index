<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="454" viewBox="0 0 1040 454" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">สร้างประมาณการต้นทุนจบงาน</title><desc id="desc">ประมาณการบวกต้นทุนเกิดแล้ว 120,000 บาท ต้นทุนผูกพันคงเหลือ 70,000 บาท และงานยังไม่ผูกพัน 30,000 บาท ได้ 220,000 บาท</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="406.54" lengthAdjust="spacingAndGlyphs">สร้างประมาณการต้นทุนจบงาน</tspan></text><g class="diagram-card" data-node="0"><rect x="40" y="131" width="216" height="287" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="131" width="216" height="7" fill="#24463e"/><text x="148" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="148" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="219" textLength="125.8" lengthAdjust="spacingAndGlyphs">ต้นทุนจริง</tspan></text><text x="148" y="269" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="269" textLength="123.69" lengthAdjust="spacingAndGlyphs">ต้นทุนเกิดแล้ว</tspan><tspan x="148" y="303" textLength="117.73" lengthAdjust="spacingAndGlyphs">120,000 บาท</tspan><tspan x="148" y="337" textLength="128.73" lengthAdjust="spacingAndGlyphs">ภายในขอบเขต</tspan><tspan x="148" y="371" textLength="103.11" lengthAdjust="spacingAndGlyphs">ตัวอย่างฝึก</tspan></text></g><path d="M260 274.5 L279 274.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="288" y="131" width="216" height="287" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="288" y="131" width="216" height="7" fill="#006f6b"/><text x="396" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="396" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="219" textLength="167.92" lengthAdjust="spacingAndGlyphs">ภาระผูกพันคง</tspan><tspan x="396" y="263" textLength="62.06" lengthAdjust="spacingAndGlyphs">เหลือ</tspan></text><text x="396" y="313" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="313" textLength="107.52" lengthAdjust="spacingAndGlyphs">ต้นทุนผูกพัน</tspan><tspan x="396" y="347" textLength="171.78" lengthAdjust="spacingAndGlyphs">70,000 บาท ที่ยังไม่</tspan><tspan x="396" y="381" textLength="32.97" lengthAdjust="spacingAndGlyphs">เกิด</tspan></text></g><path d="M508 274.5 L527 274.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="536" y="131" width="216" height="287" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="536" y="131" width="216" height="7" fill="#24463e"/><text x="644" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="644" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="219" textLength="110.07" lengthAdjust="spacingAndGlyphs">งานยังไม่</tspan><tspan x="644" y="263" textLength="71.88" lengthAdjust="spacingAndGlyphs">ผูกพัน</tspan></text><text x="644" y="313" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="313" textLength="146.58" lengthAdjust="spacingAndGlyphs">ยังต้องใช้เพื่อจบ</tspan><tspan x="644" y="347" textLength="174.72" lengthAdjust="spacingAndGlyphs">งานอีก 30,000 บาท</tspan></text></g><path d="M756 274.5 L775 274.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="784" y="131" width="216" height="287" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="784" y="131" width="216" height="7" fill="#006f6b"/><text x="892" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="892" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="219" textLength="167.92" lengthAdjust="spacingAndGlyphs">ยอดคาดการณ์</tspan><tspan x="892" y="263" textLength="53.91" lengthAdjust="spacingAndGlyphs">รวม</tspan></text><text x="892" y="313" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="313" textLength="170.02" lengthAdjust="spacingAndGlyphs">220,000 บาท เทียบ</tspan><tspan x="892" y="347" textLength="173.25" lengthAdjust="spacingAndGlyphs">รายได้และรายการที่</tspan><tspan x="892" y="381" textLength="59.85" lengthAdjust="spacingAndGlyphs">ไม่รวม</tspan></text></g></svg>
