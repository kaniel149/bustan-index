,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="240" y="707" textLength="286.88" lengthAdjust="spacingAndGlyphs">מתכננים גישה בטוחה ושיטה</tspan><tspan x="240" y="739" textLength="85.58" lengthAdjust="spacingAndGlyphs">מתאימה.</tspan></text></g><path d="M240 777 L240 802" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="40" y="811" width="400" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="811" width="400" height="7" fill="#006f6b"/><text x="240" y="850" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="850" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="240" y="896" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="240" y="896" textLength="184.2" lengthAdjust="spacingAndGlyphs">בדיקת המרווח</tspan></text><text x="240" y="943" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="240" y="943" textLength="337.26" lengthAdjust="spacingAndGlyphs">מתאימים מיקום מושפע לפי ראיות.</tspan></text></g><path d="M36 901 H16 V220 H31" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/></svg>
