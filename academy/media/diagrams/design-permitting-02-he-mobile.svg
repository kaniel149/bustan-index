<svg xmlns="http://www.w3.org/2000/svg" width="480" height="680" viewBox="0 0 480 680" lang="he" xml:lang="he" role="img" aria-labelledby="title desc"><title id="title">הצללה משנה את האומדן</title><desc id="desc">שלוש עמודות מציגות 15,000, 14,100 ו־12,900 קוט״ש בשנה בהנחות הצללה שונות לתרגול.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="313.66" lengthAdjust="spacingAndGlyphs">הצללה משנה את האומדן</tspan></text><g class="diagram-bar" data-node="0"><text x="452" y="146" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="452" y="146" textLength="217.36" lengthAdjust="spacingAndGlyphs">ללא הפסד הצללה</tspan></text><text x="452" y="184" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="452" y="184" textLength="342.37" lengthAdjust="spacingAndGlyphs">15000 קוט״ש לשנה · דוגמת תרגול</tspan></text><rect x="28" y="205" width="424" height="28" rx="3" fill="#dedfce"/><rect x="28" y="205" width="424" height="28" rx="3" fill="#24463e"/><text x="452" y="264" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="452" y="264" textLength="334.32" lengthAdjust="spacingAndGlyphs">ייחוס לתרגול לפני הנחת ההצללה</tspan></text></g><g class="diagram-bar" data-node="1"><text x="452" y="329" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="452" y="329" textLength="205.82" lengthAdjust="spacingAndGlyphs">הפסד הצללה 6%</tspan></text><text x="452" y="367" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="452" y="367" textLength="342.37" lengthAdjust="spacingAndGlyphs">14100 קוט״ש לשנה · דוגמת תרגול</tspan></text><rect x="28" y="388" width="424" height="28" rx="3" fill="#dedfce"/><rect x="53.44" y="388" width="398.56" height="28" rx="3" fill="#006f6b"/><text x="452" y="447" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="452" y="447" textLength="133.73" lengthAdjust="spacingAndGlyphs">15,000 × 0.94</tspan></text></g><g class="diagram-bar" data-node="2"><text x="452" y="512" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="452" y="512" textLength="220.27" lengthAdjust="spacingAndGlyphs">הפסד הצללה 14%</tspan></text><text x="452" y="550" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="452" y="550" textLength="342.37" lengthAdjust="spacingAndGlyphs">12900 קוט״ש לשנה · דוגמת תרגול</tspan></text><rect x="28" y="571" width="424" height="28" rx="3" fill="#dedfce"/><rect x="87.36" y="571" width="364.64" height="28" rx="3" fill="#24463e"/><text x="452" y="630" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="452" y="630" textLength="133.73" lengthAdjust="spacingAndGlyphs">15,000 × 0.86</tspan></text></g></svg>
