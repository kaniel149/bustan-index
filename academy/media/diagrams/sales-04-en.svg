<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="359" viewBox="0 0 1040 359" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Separate the customer outcomes</title><desc id="desc">Bill reduction and specified reception backup are distinct; whole-resort backup is excluded.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="459.73" lengthAdjust="spacingAndGlyphs">Separate the customer outcomes</tspan></text><g class="diagram-card" data-node="0"><rect x="40" y="127" width="298.67" height="196" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="127" width="298.67" height="7" fill="#24463e"/><text x="189.33" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="189.33" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="189.33" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="189.33" y="212" textLength="160.79" lengthAdjust="spacingAndGlyphs">Bill reduction</tspan></text><text x="189.33" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="189.33" y="258" textLength="143.6" lengthAdjust="spacingAndGlyphs">Model matched</tspan><tspan x="189.33" y="289" textLength="206.68" lengthAdjust="spacingAndGlyphs">consumption and tariff</tspan></text></g><g class="diagram-card" data-node="1"><rect x="370.67" y="127" width="298.67" height="196" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="370.67" y="127" width="298.67" height="7" fill="#006f6b"/><text x="520" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="520" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="212" textLength="224.81" lengthAdjust="spacingAndGlyphs">Reception backup</tspan></text><text x="520" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="258" textLength="198.49" lengthAdjust="spacingAndGlyphs">Specified circuits and</tspan><tspan x="520" y="289" textLength="157.63" lengthAdjust="spacingAndGlyphs">stated conditions</tspan></text></g><g class="diagram-card" data-node="2"><rect x="701.33" y="127" width="298.67" height="196" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="701.33" y="127" width="298.67" height="7" fill="#24463e"/><text x="850.67" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="850.67" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="850.67" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="850.67" y="212" textLength="159.21" lengthAdjust="spacingAndGlyphs">Whole resort</tspan></text><text x="850.67" y="258" fill="#4a5d52