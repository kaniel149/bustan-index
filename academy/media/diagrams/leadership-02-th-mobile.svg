<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1065" viewBox="0 0 480 1065" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">เส้นทางยาวที่สุดกำหนดเวลา</title><desc id="desc">แผนฝึกแสดงสำรวจและออกแบบห้าวัน ความพร้อมขออนุมัติแปดวันขนานกับจัดซื้อและขนส่ง ติดตั้งสามวัน และทดสอบหนึ่งวัน</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="327.45" lengthAdjust="spacingAndGlyphs">เส้นทางยาวที่สุดกำหนดเวลา</tspan></text><g class="diagram-card" data-node="0"><rect x="28" y="125" width="424" height="213" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="125" width="424" height="7" fill="#24463e"/><text x="240" y="164" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="164" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="213" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="213" textLength="334.32" lengthAdjust="spacingAndGlyphs">สำรวจและออกแบบ · 5 วัน</tspan></text><text x="240" y="264" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="264" textLength="335.72" lengthAdjust="spacingAndGlyphs">สำรวจและออกแบบก่อนทั้งสองสาย</tspan><tspan x="240" y="300" textLength="108.02" lengthAdjust="spacingAndGlyphs">ความพร้อม</tspan></text></g><path d="M240 342 L240 367" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="28" y="376" width="424" height="213" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="376" width="424" height="7" fill="#006f6b"/><text x="240" y="415" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="415" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="240" y="464" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="464" textLength="211.61" lengthAdjust="spacingAndGlyphs">งานขนาน · 8 วัน</tspan></text><text x="240" y="515" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="515" textLength="355.04" lengthAdjust="spacingAndGlyphs">พร้อมขออนุมัติ 8 จัดซื้อ 6 และขนส่ง 2</tspan><tspan x="240" y="551" textLength="70.4" lengthAdjust="spacingAndGlyphs">รอทั้งคู่</tspan></text></g><path d="M240 593 L240 618" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="28" y="627" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="627" width="424" height="7" fill="#24463e"/><text x="240" y="666" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="666" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="240" y="715" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="715" textLength="169.49" lengthAdjust="spacingAndGlyphs">ติดตั้ง · 3 วัน</tspan></text><text x="240" y="766" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="766" textLength="305.58" lengthAdjust="spacingAndGlyphs">เริ่มเมื่อทั้งสองงานก่อนหน้าเสร็จ</tspan></text></g><path d="M240 811 L240 836" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="28" y="845" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="845" width="424" height="7" fill="#006f6b"/><text x="240" y="884" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="884" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="240" y="933" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="933" textLength="187.46" lengthAdjust="spacingAndGlyphs">ทดสอบ · 1 วัน</tspan></text><text x="240" y="984" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="984" textLength="278.12" lengthAdjust="spacingAndGlyphs">ระยะเวลาตัวอย่างรวม 17 วัน</tspan></text></g></svg>
