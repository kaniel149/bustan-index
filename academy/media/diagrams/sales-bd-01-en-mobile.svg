<svg xmlns="http://www.w3.org/2000/svg" width="480" height="995" viewBox="0 0 480 995" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Segment the need, not the person</title><desc id="desc">Villa, resort and restaurant prompts lead to verified needs rather than fixed assumptions about customers.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="409.2" lengthAdjust="spacingAndGlyphs">Segment the need, not the person</tspan></text><g class="diagram-card" data-node="0"><rect x="28" y="121" width="424" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="121" width="424" height="7" fill="#24463e"/><text x="240" y="160" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="160" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="206" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="206" textLength="53.04" lengthAdjust="spacingAndGlyphs">Villa</tspan></text><text x="240" y="253" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="253" textLength="324.21" lengthAdjust="spacingAndGlyphs">Ask about occupancy and priority</tspan><tspan x="240" y="285" textLength="52.58" lengthAdjust="spacingAndGlyphs">loads</tspan></text></g><g class="diagram-card" data-node="1"><rect x="28" y="339" width="424" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="339" width="424" height="7" fill="#006f6b"/><text x="240" y="378" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="378" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="240" y="424" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="424" textLength="82.7" lengthAdjust="spacingAndGlyphs">Resort</tspan></text><text x="240" y="471" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="471" textLength="309.58" lengthAdjust="spacingAndGlyphs">Ask about guest operations and</tspan><tspan x="240" y="503" textLength="67.23" lengthAdjust="spacingAndGlyphs">meters</tspan></text></g><g class="diagram-card" data-node="2"><rect x="28" y="557" width="424" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="557" width="424" height="7" fill="#24463e"/><text x="240" y="596" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="596" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="240" y="642" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="642" textLength="137.34" lengthAdjust="spacingAndGlyphs">Restaurant</tspan></text><text x="240" y="689" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="689" textLength="277.75" lengthAdjust="spacingAndGlyphs">Ask about service hours and</tspan><tspan x="240" y="721" textLength="95.37" lengthAdjust="spacingAndGlyphs">disruption</tspan></text></g><g class="diagram-card" data-node="3"><rect x="28" y="775" width="424" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="775" width="424" height="7" fill="#006f6b"/><text x="240" y="814" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="814" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="240" y="860" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="860" textLength="179.54" lengthAdjust="spacingAndGlyphs">Verified needs</tspan></text><text x="240" y="907" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="907" textLength="311.94" lengthAdjust="spacingAndGlyphs">Confirm answers with the actual</tspan><tspan x="240" y="939" textLength="124.72" lengthAdjust="spacingAndGlyphs">stakeholders</tspan></text></g></svg>
