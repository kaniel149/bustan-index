<svg xmlns="http://www.w3.org/2000/svg" width="480" height="711" viewBox="0 0 480 711" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Cold voltage screening</title><desc id="desc">Training voltage bars compare an eleven-module string at 573.1 V, a fictional 600 V limit and twelve modules at 625.2 V.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="275.13" lengthAdjust="spacingAndGlyphs">Cold voltage screening</tspan></text><g class="diagram-bar" data-node="0"><text x="28" y="146" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="146" textLength="134.45" lengthAdjust="spacingAndGlyphs">11 modules</tspan></text><text x="28" y="184" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="184" textLength="252.7" lengthAdjust="spacingAndGlyphs">573.1 V · training example</tspan></text><rect x="28" y="205" width="424" height="28" rx="3" fill="#dedfce"/><rect x="28" y="205" width="388.67" height="28" rx="3" fill="#24463e"/><text x="28" y="264" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="264" textLength="313.61" lengthAdjust="spacingAndGlyphs">11 × 52.1 V; other checks remain</tspan></text></g><g class="diagram-bar" data-node="1"><text x="28" y="329" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="329" textLength="154.62" lengthAdjust="spacingAndGlyphs">Example limit</tspan></text><text x="28" y="367" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="367" textLength="235.31" lengthAdjust="spacingAndGlyphs">600 V · training example</tspan></text><rect x="28" y="388" width="424" height="28" rx="3" fill="#dedfce"/><rect x="28" y="388" width="406.91" height="28" rx="3" fill="#006f6b"/><text x="28" y="447" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="447" textLength="399.36" lengthAdjust="spacingAndGlyphs">Fictional inverter maximum; not a universal</tspan><tspan x="28" y="478" textLength="61.87" lengthAdjust="spacingAndGlyphs">setting</tspan></text></g><g class="diagram-bar" data-node="2"><text x="28" y="543" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="543" textLength="134.45" lengthAdjust="spacingAndGlyphs">12 modules</tspan></text><text x="28" y="581" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="581" textLength="252.7" lengthAdjust="spacingAndGlyphs">625.2 V · training example</tspan></text><rect x="28" y="602" width="424" height="28" rx="3" fill="#dedfce"/><rect x="28" y="602" width="424" height="28" rx="3" fill="#24463e"/><text x="28" y="661" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="661" textLength="325.23" lengthAdjust="spacingAndGlyphs">12 × 52.1 V exceeds example limit</tspan></text></g></svg>
