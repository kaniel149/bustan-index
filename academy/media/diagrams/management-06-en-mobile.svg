<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1067" viewBox="0 0 480 1067" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Grow within delivery capacity</title><desc id="desc">Growth moves through qualified opportunities, delivery resources, service headroom and measured commitments.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="348.76" lengthAdjust="spacingAndGlyphs">Grow within delivery capacity</tspan></text><g class="diagram-card" data-node="0"><rect x="28" y="121" width="424" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="121" width="424" height="7" fill="#24463e"/><text x="240" y="160" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="160" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="206" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="206" textLength="238.9" lengthAdjust="spacingAndGlyphs">Qualify the pipeline</tspan></text><text x="240" y="253" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="253" textLength="342.58" lengthAdjust="spacingAndGlyphs">Confirm scope, customer need and</tspan><tspan x="240" y="285" textLength="157.78" lengthAdjust="spacingAndGlyphs">evidence quality</tspan></text></g><path d="M240 323 L240 348" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="28" y="357" width="424" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="357" width="424" height="7" fill="#006f6b"/><text x="240" y="396" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="396" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="240" y="442" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="442" textLength="315.31" lengthAdjust="spacingAndGlyphs">Check delivery resources</tspan></text><text x="240" y="489" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="489" textLength="356" lengthAdjust="spacingAndGlyphs">Match qualified people, procurement</tspan><tspan x="240" y="521" textLength="184.71" lengthAdjust="spacingAndGlyphs">and island logistics</tspan></text></g><path d="M240 559 L240 584" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="28" y="593" width="424" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="593" width="424" height="7" fill="#24463e"/><text x="240" y="632" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="632" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="240" y="678" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="678" textLength="335.61" lengthAdjust="spacingAndGlyphs">Reserve service headroom</tspan></text><text x="240" y="725" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="725" textLength="368.26" lengthAdjust="spacingAndGlyphs">Include existing customers, travel and</tspan><tspan x="240" y="757" textLength="144.3" lengthAdjust="spacingAndGlyphs">documentation</tspan></text></g><path d="M240 795 L240 820" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="28" y="829" width="424" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="829" width="424" height="7" fill="#006f6b"/><text x="240" y="868" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="868" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="240" y="914" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="914" textLength="268.5" lengthAdjust="spacingAndGlyphs">Commit and measure</tspan></text><text x="240" y="961" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="961" textLength="362.12" lengthAdjust="spacingAndGlyphs">Track delivery quality, cash exposure</tspan><tspan x="240" y="993" textLength="117.44" lengthAdjust="spacingAndGlyphs">and lessons</tspan></text></g></svg>
