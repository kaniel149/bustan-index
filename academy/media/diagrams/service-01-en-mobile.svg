<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1033" viewBox="0 0 480 1033" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">What does silence mean?</title><desc id="desc">Monitoring silence branches into hazard escalation, communication checks and unresolved electrical status.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="317.86" lengthAdjust="spacingAndGlyphs">What does silence mean?</tspan></text><g class="diagram-card" data-node="0"><rect x="30" y="121" width="420" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="30" y="121" width="420" height="7" fill="#24463e"/><text x="240" y="160" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="160" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="206" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="206" textLength="314.44" lengthAdjust="spacingAndGlyphs">Monitoring has stopped?</tspan></text><text x="240" y="253" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="253" textLength="344.94" lengthAdjust="spacingAndGlyphs">Separate hazards, communications</tspan><tspan x="240" y="285" textLength="230.01" lengthAdjust="spacingAndGlyphs">and electrical evidence.</tspan></text></g><path d="M27 220 H16 V898" stroke="#006f6b" stroke-width="3" fill="none"/><path d="M16 450 L48 450" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="56" y="351" width="396" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="56" y="351" width="396" height="7" fill="#006f6b"/><text x="254" y="390" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="390" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="254" y="436" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="436" textLength="202.93" lengthAdjust="spacingAndGlyphs">Hazard reported</tspan></text><text x="254" y="483" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="483" textLength="242.26" lengthAdjust="spacingAndGlyphs">Escalate through the site</tspan><tspan x="254" y="515" textLength="162.71" lengthAdjust="spacingAndGlyphs">emergency plan.</tspan></text></g><path d="M16 674 L48 674" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="56" y="575" width="396" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="56" y="575" width="396" height="7" fill="#24463e"/><text x="254" y="614" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="614" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="254" y="660" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="660" textLength="271.7" lengthAdjust="spacingAndGlyphs">Data path unavailable</tspan></text><text x="254" y="707" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="707" textLength="249.5" lengthAdjust="spacingAndGlyphs">Preserve timestamps and</tspan><tspan x="254" y="739" textLength="276.41" lengthAdjust="spacingAndGlyphs">investigate communications.</tspan></text></g><path d="M16 898 L48 898" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="56" y="799" width="396" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="56" y="799" width="396" height="7" fill="#006f6b"/><text x="254" y="838" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="838" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="254" y="884" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="884" textLength="320.03" lengthAdjust="spacingAndGlyphs">Electrical status uncertain</tspan></text><text x="254" y="931" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="931" textLength="297.33" lengthAdjust="spacingAndGlyphs">A qualified lead defines further</tspan><tspan x="254" y="963" textLength="128.44" lengthAdjust="spacingAndGlyphs">investigation.</tspan></text></g></svg>
