<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="439" viewBox="0 0 1040 439" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Control the change</title><desc id="desc">Baseline, authorized purpose, affected-function verification and outcome records form a controlled change sequence.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="263.73" lengthAdjust="spacingAndGlyphs">Control the change</tspan></text><g class="diagram-card" data-node="0"><rect x="40" y="127" width="216" height="276" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="127" width="216" height="7" fill="#24463e"/><text x="148" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="148" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="212" textLength="99.88" lengthAdjust="spacingAndGlyphs">Capture</tspan><tspan x="148" y="252" textLength="104.57" lengthAdjust="spacingAndGlyphs">baseline</tspan></text><text x="148" y="298" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="298" textLength="157.63" lengthAdjust="spacingAndGlyphs">Record versions,</tspan><tspan x="148" y="329" textLength="148.34" lengthAdjust="spacingAndGlyphs">settings and the</tspan><tspan x="148" y="360" textLength="173.99" lengthAdjust="spacingAndGlyphs">observed problem.</tspan></text></g><path d="M260 265 L279 265" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="288" y="127" width="216" height="276" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="288" y="127" width="216" height="7" fill="#006f6b"/><text x="396" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="396" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="212" textLength="142.08" lengthAdjust="spacingAndGlyphs">Authorize a</tspan><tspan x="396" y="252" textLength="101.45" lengthAdjust="spacingAndGlyphs">purpose</tspan></text><text x="396" y="298" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="298" textLength="128.52" lengthAdjust="spacingAndGlyphs">Define the fix,</tspan><tspan x="396" y="329" textLength="98.09" lengthAdjust="spacingAndGlyphs">owner and</tspan><tspan x="396" y="360" textLength="131.96" lengthAdjust="spacingAndGlyphs">recovery plan.</tspan></text></g><path d="M508 265 L527 265" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="536" y="127" width="216" height="276" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="536" y="127" width="216" height="7" fill="#24463e"/><text x="644" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="644" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="212" textLength="71.77" lengthAdjust="spacingAndGlyphs">Verify</tspan><tspan x="644" y="252" textLength="99.91" lengthAdjust="spacingAndGlyphs">affected</tspan><tspan x="644" y="292" textLength="112.38" lengthAdjust="spacingAndGlyphs">functions</tspan></text><text x="644" y="338" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="338" textLength="151.81" lengthAdjust="spacingAndGlyphs">Match checks to</tspan><tspan x="644" y="369" textLength="171.74" lengthAdjust="spacingAndGlyphs">the actual change.</tspan></text></g><path d="M756 265 L775 265" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="784" y="127" width="216" height="276" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="784" y="127" width="216" height="7" fill="#006f6b"/><text x="892" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="892" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="212" textLength="137.4" lengthAdjust="spacingAndGlyphs">Record the</tspan><tspan x="892" y="252" textLength="107.69" lengthAdjust="spacingAndGlyphs">outcome</tspan></text><text x="892" y="298" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="298" textLength="173.94" lengthAdjust="spacingAndGlyphs">Preserve evidence</tspan><tspan x="892" y="329" textLength="143.62" lengthAdjust="spacingAndGlyphs">and unresolved</tspan><tspan x="892" y="360" textLength="107.39" lengthAdjust="spacingAndGlyphs">restrictions.</tspan></text></g></svg>
