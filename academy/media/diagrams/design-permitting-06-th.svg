<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="454" viewBox="0 0 1040 454" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">สายหลักฐานที่ควบคุมได้</title><desc id="desc">ลำดับเอกสารเชื่อมเจตนาออกแบบ เอกสารสอดคล้อง ฉบับทบทวน และการออกใช้อย่างควบคุม</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="315.43" lengthAdjust="spacingAndGlyphs">สายหลักฐานที่ควบคุมได้</tspan></text><g class="diagram-card" data-node="0"><rect x="40" y="131" width="216" height="287" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="131" width="216" height="7" fill="#24463e"/><text x="148" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="148" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="219" textLength="74.13" lengthAdjust="spacingAndGlyphs">เจตนา</tspan><tspan x="148" y="263" textLength="103.33" lengthAdjust="spacingAndGlyphs">ออกแบบ</tspan></text><text x="148" y="313" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="313" textLength="173.04" lengthAdjust="spacingAndGlyphs">ระบุโหลด โหมด และ</tspan><tspan x="148" y="347" textLength="127.05" lengthAdjust="spacingAndGlyphs">อุปกรณ์ที่เลือก</tspan></text></g><path d="M260 274.5 L279 274.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="288" y="131" width="216" height="287" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="288" y="131" width="216" height="7" fill="#006f6b"/><text x="396" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="396" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="219" textLength="92.1" lengthAdjust="spacingAndGlyphs">เอกสาร</tspan><tspan x="396" y="263" textLength="125.8" lengthAdjust="spacingAndGlyphs">สอดคล้อง</tspan></text><text x="396" y="313" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="313" textLength="175.24" lengthAdjust="spacingAndGlyphs">ให้ SLD การคำนวณ</tspan><tspan x="396" y="347" textLength="171.57" lengthAdjust="spacingAndGlyphs">และรายการอุปกรณ์</tspan><tspan x="396" y="381" textLength="67.2" lengthAdjust="spacingAndGlyphs">ตรงกัน</tspan></text></g><path d="M508 274.5 L527 274.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="536" y="131" width="216" height="287" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="536" y="131" width="216" height="7" fill="#24463e"/><text x="644" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="644" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="219" textLength="101.93" lengthAdjust="spacingAndGlyphs">ฉบับผ่าน</tspan><tspan x="644" y="263" textLength="89.86" lengthAdjust="spacingAndGlyphs">ทบทวน</tspan></text><text x="644" y="313" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="313" textLength="134.4" lengthAdjust="spacingAndGlyphs">บันทึกผู้ทบทวน</tspan><tspan x="644" y="347" textLength="162.75" lengthAdjust="spacingAndGlyphs">สถานะ และเงื่อนไข</tspan><tspan x="644" y="381" textLength="35.91" lengthAdjust="spacingAndGlyphs">ค้าง</tspan></text></g><path d="M756 274.5 L775 274.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="784" y="131" width="216" height="287" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="784" y="131" width="216" height="7" fill="#006f6b"/><text x="892" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="892" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="219" textLength="128.04" lengthAdjust="spacingAndGlyphs">ชุดเอกสาร</tspan><tspan x="892" y="263" textLength="80.03" lengthAdjust="spacingAndGlyphs">ออกใช้</tspan></text><text x="892" y="313" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="313" textLength="160.02" lengthAdjust="spacingAndGlyphs">ส่งฉบับเดียวกันให้</tspan><tspan x="892" y="347" textLength="170.31" lengthAdjust="spacingAndGlyphs">ผู้รับผิดชอบทุกฝ่าย</tspan></text></g></svg>
