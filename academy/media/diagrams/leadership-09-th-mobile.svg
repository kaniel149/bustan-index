<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1131" viewBox="0 0 480 1131" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">ฟื้นโครงการด้วยหลักฐาน</title><desc id="desc">วงจรฟื้นงานกระทบยอดแผนฐาน เปิดเผยข้อขัดขวาง อนุมัติการฟื้น และยืนยันปิดก่อนใช้บทเรียน</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="290.68" lengthAdjust="spacingAndGlyphs">ฟื้นโครงการด้วยหลักฐาน</tspan></text><g class="diagram-card" data-node="0"><rect x="40" y="125" width="400" height="213" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="125" width="400" height="7" fill="#24463e"/><text x="240" y="164" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="164" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="213" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="213" textLength="235.31" lengthAdjust="spacingAndGlyphs">กระทบยอดแผนฐาน</tspan></text><text x="240" y="264" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="264" textLength="345.62" lengthAdjust="spacingAndGlyphs">ยืนยันขอบเขต ภาระผูกพัน และข้อเท็จ</tspan><tspan x="240" y="300" textLength="42.24" lengthAdjust="spacingAndGlyphs">จริง</tspan></text></g><path d="M240 342 L240 367" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="40" y="376" width="400" height="213" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="376" width="400" height="7" fill="#006f6b"/><text x="240" y="415" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="415" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="240" y="464" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="464" textLength="226.04" lengthAdjust="spacingAndGlyphs">เปิดเผยข้อขัดขวาง</tspan></text><text x="240" y="515" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="515" textLength="334.62" lengthAdjust="spacingAndGlyphs">จัดลำดับช่องว่างความปลอดภัยและ</tspan><tspan x="240" y="551" textLength="93.94" lengthAdjust="spacingAndGlyphs">งานสำคัญ</tspan></text></g><path d="M240 593 L240 618" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="40" y="627" width="400" height="213" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="627" width="400" height="7" fill="#24463e"/><text x="240" y="666" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="666" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="240" y="715" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="715" textLength="205.26" lengthAdjust="spacingAndGlyphs">อนุมัติแผนฟื้นงาน</tspan></text><text x="240" y="766" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="766" textLength="295.68" lengthAdjust="spacingAndGlyphs">ประเมินต้นทุน เวลา และขอบเขต</tspan><tspan x="240" y="802" textLength="65.78" lengthAdjust="spacingAndGlyphs">อำนาจ</tspan></text></g><path d="M240 844 L240 869" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="40" y="878" width="400" height="213" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="878" width="400" height="7" fill="#006f6b"/><text x="240" y="917" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="917" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="240" y="966" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="966" textLength="195.44" lengthAdjust="spacingAndGlyphs">ยืนยันและเรียนรู้</tspan></text><text x="240" y="1017" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="1017" textLength="312.4" lengthAdjust="spacingAndGlyphs">ตรวจการปิดงานและปรับแนวทาง</tspan><tspan x="240" y="1053" textLength="134.86" lengthAdjust="spacingAndGlyphs">โครงการถัดไป</tspan></text></g><path d="M444 984.5 H464 V231.5 H449" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/></svg>
