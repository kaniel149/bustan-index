<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="501" viewBox="0 0 1040 501" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Build the commissioning record</title><desc id="desc">A commissioning record connects exact identity, approved modes, qualified testing and a preserved handover baseline.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="433.65" lengthAdjust="spacingAndGlyphs">Build the commissioning record</tspan></text><g class="diagram-card" data-node="0"><rect x="40" y="127" width="216" height="338" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="127" width="216" height="7" fill="#24463e"/><text x="148" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="148" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="212" textLength="70.23" lengthAdjust="spacingAndGlyphs">Exact</tspan><tspan x="148" y="252" textLength="131.11" lengthAdjust="spacingAndGlyphs">equipment</tspan><tspan x="148" y="292" textLength="88.96" lengthAdjust="spacingAndGlyphs">identity</tspan></text><text x="148" y="338" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="338" textLength="143.58" lengthAdjust="spacingAndGlyphs">Record inverter</tspan><tspan x="148" y="369" textLength="172.87" lengthAdjust="spacingAndGlyphs">model, variant and</tspan><tspan x="148" y="400" textLength="143.62" lengthAdjust="spacingAndGlyphs">documentation.</tspan></text></g><path d="M260 296 L279 296" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="288" y="127" width="216" height="338" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="288" y="127" width="216" height="7" fill="#006f6b"/><text x="396" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="396" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="212" textLength="120.18" lengthAdjust="spacingAndGlyphs">Approved</tspan><tspan x="396" y="252" textLength="117.07" lengthAdjust="spacingAndGlyphs">operating</tspan><tspan x="396" y="292" textLength="84.27" lengthAdjust="spacingAndGlyphs">modes</tspan></text><text x="396" y="338" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="338" textLength="142.4" lengthAdjust="spacingAndGlyphs">Confirm project</tspan><tspan x="396" y="369" textLength="161.13" lengthAdjust="spacingAndGlyphs">configuration and</tspan><tspan x="396" y="400" textLength="101.51" lengthAdjust="spacingAndGlyphs">permission</tspan><tspan x="396" y="431" textLength="109.77" lengthAdjust="spacingAndGlyphs">boundaries.</tspan></text></g><path d="M508 296 L527 296" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="536" y="127" width="216" height="338" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="536" y="127" width="216" height="7" fill="#24463e"/><text x="644" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="644" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="212" textLength="110.8" lengthAdjust="spacingAndGlyphs">Qualified</tspan><tspan x="644" y="252" textLength="59.3" lengthAdjust="spacingAndGlyphs">tests</tspan></text><text x="644" y="298" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="298" textLength="165.84" lengthAdjust="spacingAndGlyphs">Use the approved</tspan><tspan x="644" y="329" textLength="172.85" lengthAdjust="spacingAndGlyphs">plan and traceable</tspan><tspan x="644" y="360" textLength="67.73" lengthAdjust="spacingAndGlyphs">results.</tspan></text></g><path d="M756 296 L775 296" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="784" y="127" width="216" height="338" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="784" y="127" width="216" height="7" fill="#006f6b"/><text x="892" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="892" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="212" textLength="121.73" lengthAdjust="spacingAndGlyphs">Handover</tspan><tspan x="892" y="252" textLength="104.57" lengthAdjust="spacingAndGlyphs">baseline</tspan></text><text x="892" y="298" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="298" textLength="168.15" lengthAdjust="spacingAndGlyphs">Preserve settings,</tspan><tspan x="892" y="329" textLength="124.95" lengthAdjust="spacingAndGlyphs">evidence and</tspan><tspan x="892" y="360" textLength="164.66" lengthAdjust="spacingAndGlyphs">unresolved holds.</tspan></text></g></svg>
