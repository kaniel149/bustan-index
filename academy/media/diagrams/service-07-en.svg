<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="881" viewBox="0 0 1040 881" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">A phase budget under pressure</title><desc id="desc">Bars compare 32 A budget, 20 A building demand, 16 A EV request and 36 A total.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="437.3" lengthAdjust="spacingAndGlyphs">A phase budget under pressure</tspan></text><g class="diagram-bar" data-node="0"><text x="40" y="154" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="154" textLength="204.53" lengthAdjust="spacingAndGlyphs">Scenario budget</tspan></text><text x="40" y="193" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="193" textLength="207.11" lengthAdjust="spacingAndGlyphs">32 A, training example</tspan></text><rect x="40" y="214" width="960" height="28" rx="3" fill="#dedfce"/><rect x="40" y="214" width="853.33" height="28" rx="3" fill="#24463e"/><text x="40" y="273" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="273" textLength="337.55" lengthAdjust="spacingAndGlyphs">Supplied training limit for this phase.</tspan></text></g><g class="diagram-bar" data-node="1"><text x="40" y="340" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="340" textLength="207.62" lengthAdjust="spacingAndGlyphs">Existing demand</tspan></text><text x="40" y="379" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="379" textLength="207.11" lengthAdjust="spacingAndGlyphs">20 A, training example</tspan></text><rect x="40" y="400" width="960" height="28" rx="3" fill="#dedfce"/><rect x="40" y="400" width="533.33" height="28" rx="3" fill="#006f6b"/><text x="40" y="459" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="459" textLength="336.44" lengthAdjust="spacingAndGlyphs">Building load before the EV request.</tspan></text></g><g class="diagram-bar" data-node="2"><text x="40" y="526" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="526" textLength="138.97" lengthAdjust="spacingAndGlyphs">EV request</tspan></text><text x="40" y="565" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="565" textLength="207.11" lengthAdjust="spacingAndGlyphs">16 A, training example</tspan></text><rect x="40" y="586" width="960" height="28" rx="3" fill="#dedfce"/><rect x="40" y="586" width="426.67" height="28" rx="3" fill="#24463e"/><text x="40" y="645" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="645" textLength="409.96" lengthAdjust="spacingAndGlyphs">Requested current, not guaranteed delivery.</tspan></text></g><g class="diagram-bar" data-node="3"><text x="40" y="712" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="712" textLength="196.73" lengthAdjust="spacingAndGlyphs">Requested total</tspan></text><text x="40" y="751" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="751" textLength="207.11" lengthAdjust="spacingAndGlyphs">36 A, training example</tspan></text><rect x="40" y="772" width="960" height="28" rx="3" fill="#dedfce"/><rect x="40" y="772" width="960" height="28" rx="3" fill="#006f6b"/><text x="40" y="831" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="831" textLength="286.15" lengthAdjust="spacingAndGlyphs">20 + 16 = 36 A exceeds 32 A.</tspan></text></g></svg>
