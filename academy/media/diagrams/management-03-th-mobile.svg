<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1097" viewBox="0 0 480 1097" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">กำลังขอคำตัดสินเรื่องใด?</title><desc id="desc">แผนที่ถามว่าต้องการผลเรื่องใด แล้วแยกคำถามเชื่อมต่อ การขายและ ERC และอาคารหรือการตรวจ</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="314.2" lengthAdjust="spacingAndGlyphs">กำลังขอคำตัดสินเรื่องใด?</tspan></text><g class="diagram-card" data-node="0"><rect x="30" y="125" width="420" height="213" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="30" y="125" width="420" height="7" fill="#24463e"/><text x="240" y="164" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="164" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="213" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="213" textLength="131.98" lengthAdjust="spacingAndGlyphs">ระบุคำถาม</tspan></text><text x="240" y="264" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="264" textLength="298.32" lengthAdjust="spacingAndGlyphs">แยกผลทางกฎหมายและพาณิชย์ที่</tspan><tspan x="240" y="300" textLength="79.86" lengthAdjust="spacingAndGlyphs">ต้องการ</tspan></text></g><path d="M27 231.5 H16 V954.5" stroke="#006f6b" stroke-width="3" fill="none"/><path d="M16 476.5 L48 476.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="56" y="370" width="396" height="213" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="56" y="370" width="396" height="7" fill="#006f6b"/><text x="254" y="409" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="409" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="254" y="458" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="458" textLength="251.6" lengthAdjust="spacingAndGlyphs">เชื่อมต่อและเดินระบบ</tspan></text><text x="254" y="509" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="509" textLength="281.62" lengthAdjust="spacingAndGlyphs">เงื่อนไข PEA และการควบคุมที่</tspan><tspan x="254" y="545" textLength="90.86" lengthAdjust="spacingAndGlyphs">เกี่ยวข้อง</tspan></text></g><path d="M16 715.5 L48 715.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="56" y="609" width="396" height="213" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="56" y="609" width="396" height="7" fill="#24463e"/><text x="254" y="648" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="648" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="254" y="697" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="697" textLength="227.73" lengthAdjust="spacingAndGlyphs">ขายไฟและใบอนุญาต</tspan></text><text x="254" y="748" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="748" textLength="335.3" lengthAdjust="spacingAndGlyphs">ข้อตกลงขายไฟและสถานะ ERC แยก</tspan><tspan x="254" y="784" textLength="28.16" lengthAdjust="spacingAndGlyphs">กัน</tspan></text></g><path d="M16 954.5 L48 954.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="56" y="848" width="396" height="213" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="56" y="848" width="396" height="7" fill="#006f6b"/><text x="254" y="887" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="887" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="254" y="936" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="936" textLength="241.49" lengthAdjust="spacingAndGlyphs">อาคารและการตรวจ</tspan></text><text x="254" y="987" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="987" textLength="342.32" lengthAdjust="spacingAndGlyphs">ข้อกำหนดอาคารท้องถิ่น วิชาชีพ และ</tspan><tspan x="254" y="1023" textLength="93.94" lengthAdjust="spacingAndGlyphs">การตรวจ</tspan></text></g></svg>
