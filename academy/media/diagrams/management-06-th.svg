<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="498" viewBox="0 0 1040 498" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">เติบโตตามความสามารถส่งมอบ</title><desc id="desc">การเติบโตผ่านโอกาสที่คัดกรอง ทรัพยากรส่งมอบ กำลังบริการเผื่อ และภาระผูกพันที่วัดผล</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="411.22" lengthAdjust="spacingAndGlyphs">เติบโตตามความสามารถส่งมอบ</tspan></text><g class="diagram-card" data-node="0"><rect x="40" y="131" width="216" height="331" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="131" width="216" height="7" fill="#24463e"/><text x="148" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="148" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="219" textLength="107.83" lengthAdjust="spacingAndGlyphs">คัดกรอง</tspan><tspan x="148" y="263" textLength="122.15" lengthAdjust="spacingAndGlyphs">โอกาสงาน</tspan></text><text x="148" y="313" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="313" textLength="127.05" lengthAdjust="spacingAndGlyphs">ยืนยันขอบเขต</tspan><tspan x="148" y="347" textLength="164.01" lengthAdjust="spacingAndGlyphs">ความต้องการ และ</tspan><tspan x="148" y="381" textLength="116.55" lengthAdjust="spacingAndGlyphs">คุณภาพข้อมูล</tspan></text></g><path d="M260 296.5 L279 296.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="288" y="131" width="216" height="331" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="288" y="131" width="216" height="7" fill="#006f6b"/><text x="396" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="396" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="219" textLength="71.88" lengthAdjust="spacingAndGlyphs">ตรวจ</tspan><tspan x="396" y="263" textLength="155.84" lengthAdjust="spacingAndGlyphs">ทรัพยากรส่ง</tspan><tspan x="396" y="307" textLength="53.91" lengthAdjust="spacingAndGlyphs">มอบ</tspan></text><text x="396" y="357" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="357" textLength="161.28" lengthAdjust="spacingAndGlyphs">จับคู่คนมีคุณสมบัติ</tspan><tspan x="396" y="391" textLength="145.95" lengthAdjust="spacingAndGlyphs">จัดซื้อ และขนส่ง</tspan><tspan x="396" y="425" textLength="37.59" lengthAdjust="spacingAndGlyphs">เกาะ</tspan></text></g><path d="M508 296.5 L527 296.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="536" y="131" width="216" height="331" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="536" y="131" width="216" height="7" fill="#24463e"/><text x="644" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="644" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="219" textLength="115.97" lengthAdjust="spacingAndGlyphs">เผื่อกำลัง</tspan><tspan x="644" y="263" textLength="83.96" lengthAdjust="spacingAndGlyphs">บริการ</tspan></text><text x="644" y="313" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="313" textLength="164.43" lengthAdjust="spacingAndGlyphs">รวมลูกค้าเดิม การ</tspan><tspan x="644" y="347" textLength="107.31" lengthAdjust="spacingAndGlyphs">เดินทาง และ</tspan><tspan x="644" y="381" textLength="68.88" lengthAdjust="spacingAndGlyphs">เอกสาร</tspan></text></g><path d="M756 296.5 L775 296.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="784" y="131" width="216" height="331" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="784" y="131" width="216" height="7" fill="#006f6b"/><text x="892" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="892" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="219" textLength="127.48" lengthAdjust="spacingAndGlyphs">รับงานและ</tspan><tspan x="892" y="263" textLength="71.88" lengthAdjust="spacingAndGlyphs">วัดผล</tspan></text><text x="892" y="313" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="313" textLength="152.46" lengthAdjust="spacingAndGlyphs">ติดตามคุณภาพส่ง</tspan><tspan x="892" y="347" textLength="152.46" lengthAdjust="spacingAndGlyphs">มอบ เงินสดเสี่ยง</tspan><tspan x="892" y="381" textLength="105.84" lengthAdjust="spacingAndGlyphs">และบทเรียน</tspan></text></g></svg>
