<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1105" viewBox="0 0 480 1105" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Turn observations into maintenance</title><desc id="desc">A repeating loop connects the baseline, condition comparison, authorized correction and interval review.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="267.61" lengthAdjust="spacingAndGlyphs">Turn observations into</tspan><tspan x="240" y="117" textLength="154.8" lengthAdjust="spacingAndGlyphs">maintenance</tspan></text><g class="diagram-card" data-node="0"><rect x="40" y="159" width="400" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="159" width="400" height="7" fill="#24463e"/><text x="240" y="198" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="198" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="244" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="244" textLength="212.31" lengthAdjust="spacingAndGlyphs">Baseline location</tspan></text><text x="240" y="291" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="291" textLength="308.37" lengthAdjust="spacingAndGlyphs">Keep dated asset and condition</tspan><tspan x="240" y="323" textLength="79.51" lengthAdjust="spacingAndGlyphs">records.</tspan></text></g><path d="M240 361 L240 386" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="40" y="395" width="400" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="395" width="400" height="7" fill="#006f6b"/><text x="240" y="434" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="434" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="240" y="480" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="480" textLength="235.7" lengthAdjust="spacingAndGlyphs">Compare condition</tspan></text><text x="240" y="527" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="527" textLength="318.16" lengthAdjust="spacingAndGlyphs">Look for change, recurrence and</tspan><tspan x="240" y="559" textLength="148.02" lengthAdjust="spacingAndGlyphs">consequences.</tspan></text></g><path d="M240 597 L240 622" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="40" y="631" width="400" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="631" width="400" height="7" fill="#24463e"/><text x="240" y="670" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="670" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="240" y="716" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="716" textLength="265.36" lengthAdjust="spacingAndGlyphs">Authorized correction</tspan></text><text x="240" y="763" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="763" textLength="351.19" lengthAdjust="spacingAndGlyphs">Plan safe access and the applicable</tspan><tspan x="240" y="795" textLength="79.53" lengthAdjust="spacingAndGlyphs">method.</tspan></text></g><path d="M240 833 L240 858" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="40" y="867" width="400" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="867" width="400" height="7" fill="#006f6b"/><text x="240" y="906" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="906" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="240" y="952" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="952" textLength="237.3" lengthAdjust="spacingAndGlyphs">Review the interval</tspan></text><text x="240" y="999" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="999" textLength="323.03" lengthAdjust="spacingAndGlyphs">Adjust the affected location using</tspan><tspan x="240" y="1031" textLength="190.85" lengthAdjust="spacingAndGlyphs">observed evidence.</tspan></text></g><path d="M444 966 H464 V258 H449" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/></svg>
