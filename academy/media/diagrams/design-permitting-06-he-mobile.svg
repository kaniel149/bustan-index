<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1031" viewBox="0 0 480 1031" lang="he" xml:lang="he" role="img" aria-labelledby="title desc"><title id="title">שרשרת ראיות מבוקרת אחת</title><desc id="desc">זרימת מסמכים מחברת כוונת תכנון, עקביות מסמכים, מהדורה שנבדקה והפצה מבוקרת.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="333.13" lengthAdjust="spacingAndGlyphs">שרשרת ראיות מבוקרת אחת</tspan></text><g class="diagram-card" data-node="0"><rect x="28" y="121" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="121" width="424" height="7" fill="#24463e"/><text x="240" y="160" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="160" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="206" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="240" y="206" textLength="165.95" lengthAdjust="spacingAndGlyphs">כוונת תכנון</tspan></text><text x="240" y="253" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="240" y="253" textLength="359.48" lengthAdjust="spacingAndGlyphs">מציינים עומסים, מצבים וציוד נבחר</tspan></text></g><path d="M240 305 L240 330" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="28" y="339" width="424" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="339" width="424" height="7" fill="#006f6b"/><text x="240" y="378" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="378" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="240" y="424" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="240" y="424" textLength="202.46" lengthAdjust="spacingAndGlyphs">מסמכים עקביים</tspan></text><text x="240" y="471" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="240" y="471" textLength="331.1" lengthAdjust="spacingAndGlyphs">מתאמים תרשים חד־קווי, חישובים</tspan><tspan x="240" y="503" textLength="123.64" lengthAdjust="spacingAndGlyphs">ורשימת ציוד</tspan></text></g><path d="M240 541 L240 566" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="28" y="575" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="575" width="424" height="7" fill="#24463e"/><text x="240" y="614" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="614" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="240" y="660" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="240" y="660" textLength="218.74" lengthAdjust="spacingAndGlyphs">מהדורה שנבדקה</tspan></text><text x="240" y="707" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="240" y="707" textLength="372.24" lengthAdjust="spacingAndGlyphs">מתעדים בודק, סטטוס ותנאים פתוחים</tspan></text></g><path d="M240 759 L240 784" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="28" y="793" width="424" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="793" width="424" height="7" fill="#006f6b"/><text x="240" y="832" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="832" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="240" y="878" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="240" y="878" textLength="174.1" lengthAdjust="spacingAndGlyphs">חבילה מופצת</tspan></text><text x="240" y="925" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="240" y="925" textLength="321.64" lengthAdjust="spacingAndGlyphs">מפיצים אותה מהדורה לכל בעלי</tspan><tspan x="240" y="957" textLength="87.34" lengthAdjust="spacingAndGlyphs">האחריות</tspan></text></g></svg>
