<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1053" viewBox="0 0 480 1053" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Can export income enter the case?</title><desc id="desc">Export income depends on property-specific evidence, not the existence of a general announcement.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="406.06" lengthAdjust="spacingAndGlyphs">Can export income enter the case</tspan><tspan x="240" y="117" textLength="21.63" lengthAdjust="spacingAndGlyphs">?</tspan></text><g class="diagram-card" data-node="0"><rect x="30" y="159" width="420" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="30" y="159" width="420" height="7" fill="#24463e"/><text x="240" y="198" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="198" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="244" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="244" textLength="256.62" lengthAdjust="spacingAndGlyphs">Evidence available?</tspan></text><text x="240" y="291" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="291" textLength="285.1" lengthAdjust="spacingAndGlyphs">Check account, approval and</tspan><tspan x="240" y="323" textLength="151.65" lengthAdjust="spacingAndGlyphs">purchase terms</tspan></text></g><path d="M27 258 H16 V918" stroke="#006f6b" stroke-width="3" fill="none"/><path d="M16 488 L48 488" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="56" y="389" width="396" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="56" y="389" width="396" height="7" fill="#006f6b"/><text x="254" y="428" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="428" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="254" y="474" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="474" textLength="248.23" lengthAdjust="spacingAndGlyphs">Announcement only</tspan></text><text x="254" y="521" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="521" textLength="336.91" lengthAdjust="spacingAndGlyphs">Does not establish this property’s</tspan><tspan x="254" y="553" textLength="83.12" lengthAdjust="spacingAndGlyphs">eligibility</tspan></text></g><path d="M16 703 L48 703" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="56" y="613" width="396" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="56" y="613" width="396" height="7" fill="#24463e"/><text x="254" y="652" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="652" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="254" y="698" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="698" textLength="237.28" lengthAdjust="spacingAndGlyphs">Verified agreement</tspan></text><text x="254" y="745" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="745" textLength="298.5" lengthAdjust="spacingAndGlyphs">Use its actual applicable terms</tspan></text></g><path d="M16 918 L48 918" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="56" y="819" width="396" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="56" y="819" width="396" height="7" fill="#006f6b"/><text x="254" y="858" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="858" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="254" y="904" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="904" textLength="240.36" lengthAdjust="spacingAndGlyphs">Unresolved income</tspan></text><text x="254" y="951" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="951" textLength="294.89" lengthAdjust="spacingAndGlyphs">Exclude from base case; track</tspan><tspan x="254" y="983" textLength="101.49" lengthAdjust="spacingAndGlyphs">separately</tspan></text></g></svg>
