<svg xmlns="http://www.w3.org/2000/svg" width="480" height="760" viewBox="0 0 480 760" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">แยกผลลัพธ์ที่ลูกค้าต้องการ</title><desc id="desc">ลดค่าไฟกับสำรองไฟแผนกต้อนรับเป็นคนละผลลัพธ์ โดยไม่รวมการสำรองทั้งรีสอร์ต</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="313.12" lengthAdjust="spacingAndGlyphs">แยกผลลัพธ์ที่ลูกค้าต้องการ</tspan></text><g class="diagram-card" data-node="0"><rect x="28" y="125" width="424" height="213" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="125" width="424" height="7" fill="#24463e"/><text x="240" y="164" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="164" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="213" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="213" textLength="92.1" lengthAdjust="spacingAndGlyphs">ลดค่าไฟ</tspan></text><text x="240" y="264" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="264" textLength="358.6" lengthAdjust="spacingAndGlyphs">จำลองการใช้ไฟที่ตรงเวลาและอัตราค่า</tspan><tspan x="240" y="300" textLength="20.46" lengthAdjust="spacingAndGlyphs">ไฟ</tspan></text></g><g class="diagram-card" data-node="1"><rect x="28" y="358" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="358" width="424" height="7" fill="#006f6b"/><text x="240" y="397" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="397" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="240" y="446" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="446" textLength="273.22" lengthAdjust="spacingAndGlyphs">สำรองไฟแผนกต้อนรับ</tspan></text><text x="240" y="497" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="497" textLength="273.9" lengthAdjust="spacingAndGlyphs">วงจรที่ระบุและเงื่อนไขชัดเจน</tspan></text></g><g class="diagram-card" data-node="2"><rect x="28" y="558" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="558" width="424" height="7" fill="#24463e"/><text x="240" y="597" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="597" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="240" y="646" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="646" textLength="125.8" lengthAdjust="spacingAndGlyphs">ทั้งรีสอร์ต</tspan></text><text x="240" y="697" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="697" textLength="236.72" lengthAdjust="spacingAndGlyphs">ไม่รวมในขอบเขตที่เสนอนี้</tspan></text></g></svg>
