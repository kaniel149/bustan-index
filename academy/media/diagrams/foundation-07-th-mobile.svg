<svg xmlns="http://www.w3.org/2000/svg" width="480" height="999" viewBox="0 0 480 999" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">หลักฐานต่อเนื่องชุดเดียว</title><desc id="desc">ข้อมูลฝ่ายขายส่งต่อสู่ฉบับแบบ บันทึกติดตั้ง และส่งมอบฝ่ายบริการ</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="286.89" lengthAdjust="spacingAndGlyphs">หลักฐานต่อเนื่องชุดเดียว</tspan></text><g class="diagram-card" data-node="0"><rect x="28" y="125" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="125" width="424" height="7" fill="#24463e"/><text x="240" y="164" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="164" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="213" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="213" textLength="215.94" lengthAdjust="spacingAndGlyphs">ข้อมูลจากฝ่ายขาย</tspan></text><text x="240" y="264" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="264" textLength="351.78" lengthAdjust="spacingAndGlyphs">ความต้องการ หลักฐาน และคำมั่นค้าง</tspan></text></g><path d="M240 309 L240 334" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="28" y="343" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="343" width="424" height="7" fill="#006f6b"/><text x="240" y="382" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="382" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="240" y="431" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="431" textLength="103.33" lengthAdjust="spacingAndGlyphs">ฉบับแบบ</tspan></text><text x="240" y="482" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="482" textLength="261.14" lengthAdjust="spacingAndGlyphs">สมมติฐานและขอบเขตอนุมัติ</tspan></text></g><path d="M240 527 L240 552" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="28" y="561" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="561" width="424" height="7" fill="#24463e"/><text x="240" y="600" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="600" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="240" y="649" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="649" textLength="143.77" lengthAdjust="spacingAndGlyphs">บันทึกติดตั้ง</tspan></text><text x="240" y="700" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="700" textLength="275.22" lengthAdjust="spacingAndGlyphs">การเปลี่ยนจริงและผลทดสอบ</tspan></text></g><path d="M240 745 L240 770" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="28" y="779" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="779" width="424" height="7" fill="#006f6b"/><text x="240" y="818" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="818" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="240" y="867" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="867" textLength="221.83" lengthAdjust="spacingAndGlyphs">ส่งมอบฝ่ายบริการ</tspan></text><text x="240" y="918" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="918" textLength="290.62" lengthAdjust="spacingAndGlyphs">การตั้งค่า สิทธิ์ และผู้รับผิดชอบ</tspan></text></g></svg>
