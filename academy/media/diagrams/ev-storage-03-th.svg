<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="599" viewBox="0 0 1040 599" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">ทำให้เห็นผลลำดับความสำคัญ</title><desc id="desc">วงควบคุมดูความต้องการ ใช้ลำดับ จัดชาร์จ และยืนยันตอบ.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="390.94" lengthAdjust="spacingAndGlyphs">ทำให้เห็นผลลำดับความสำคัญ</tspan></text><path d="M474 221 L561 221" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M780 315 L780 374" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M566 473 L479 473" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M260 379 L260 320" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="0"><rect x="50" y="131" width="420" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="50" y="131" width="420" height="7" fill="#24463e"/><text x="260" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="260" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="260" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="260" y="219" textLength="217.34" lengthAdjust="spacingAndGlyphs">ดูผลิตและต้องการ</tspan></text><text x="260" y="269" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="260" y="269" textLength="228.69" lengthAdjust="spacingAndGlyphs">ใช้ค่าปัจจุบันที่ขอบเขตถูก.</tspan></text></g><g class="diagram-card" data-node="1"><rect x="570" y="131" width="420" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="570" y="131" width="420" height="7" fill="#006f6b"/><text x="780" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="780" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="780" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="780" y="219" textLength="187.86" lengthAdjust="spacingAndGlyphs">ใช้ลำดับที่ตกลง</tspan></text><text x="780" y="269" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="780" y="269" textLength="345.87" lengthAdjust="spacingAndGlyphs">รักษาโหลดสำคัญและสำรองแบตอนุมัติ.</tspan></text></g><g class="diagram-card" data-node="2"><rect x="570" y="383" width="420" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="570" y="383" width="420" height="7" fill="#24463e"/><text x="780" y="422" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="780" y="422" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="780" y="471" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="780" y="471" textLength="201.17" lengthAdjust="spacingAndGlyphs">จัดสรรชาร์จ EV</tspan></text><text x="780" y="521" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="780" y="521" textLength="279.09" lengthAdjust="spacingAndGlyphs">อยู่ในขีดไซต์และผลิตภัณฑ์อนุมัติ.</tspan></text></g><g class="diagram-card" data-node="3"><rect x="50" y="383" width="420" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="50" y="383" width="420" height="7" fill="#006f6b"/><text x="260" y="422" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="260" y="422" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="260" y="471" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="260" y="471" textLength="227.73" lengthAdjust="spacingAndGlyphs">ยืนยันการตอบจริง</tspan></text><text x="260" y="521" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="260" y="521" textLength="267.33" lengthAdjust="spacingAndGlyphs">เทียบพฤติกรรมสั่งกับทำจริง.</tspan></text></g></svg>
