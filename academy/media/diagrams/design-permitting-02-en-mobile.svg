<svg xmlns="http://www.w3.org/2000/svg" width="480" height="711" viewBox="0 0 480 711" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Shade changes the estimate</title><desc id="desc">Three bars show 15,000, 14,100 and 12,900 kWh per year under different training shade assumptions.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="342.87" lengthAdjust="spacingAndGlyphs">Shade changes the estimate</tspan></text><g class="diagram-bar" data-node="0"><text x="28" y="146" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="146" textLength="164.84" lengthAdjust="spacingAndGlyphs">No shade loss</tspan></text><text x="28" y="184" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="184" textLength="334.94" lengthAdjust="spacingAndGlyphs">15000 kWh/year · training example</tspan></text><rect x="28" y="205" width="424" height="28" rx="3" fill="#dedfce"/><rect x="28" y="205" width="424" height="28" rx="3" fill="#24463e"/><text x="28" y="264" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="264" textLength="397.09" lengthAdjust="spacingAndGlyphs">Training reference before the stated shade</tspan><tspan x="28" y="295" textLength="107.37" lengthAdjust="spacingAndGlyphs">assumption</tspan></text></g><g class="diagram-bar" data-node="1"><text x="28" y="360" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="360" textLength="170.77" lengthAdjust="spacingAndGlyphs">6% shade loss</tspan></text><text x="28" y="398" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="398" textLength="334.94" lengthAdjust="spacingAndGlyphs">14100 kWh/year · training example</tspan></text><rect x="28" y="419" width="424" height="28" rx="3" fill="#dedfce"/><rect x="28" y="419" width="398.56" height="28" rx="3" fill="#006f6b"/><text x="28" y="478" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="478" textLength="133.73" lengthAdjust="spacingAndGlyphs">15,000 × 0.94</tspan></text></g><g class="diagram-bar" data-node="2"><text x="28" y="543" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="543" textLength="185.22" lengthAdjust="spacingAndGlyphs">14% shade loss</tspan></text><text x="28" y="581" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="581" textLength="334.94" lengthAdjust="spacingAndGlyphs">12900 kWh/year · training example</tspan></text><rect x="28" y="602" width="424" height="28" rx="3" fill="#dedfce"/><rect x="28" y="602" width="364.64" height="28" rx="3" fill="#24463e"/><text x="28" y="661" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="661" textLength="133.73" lengthAdjust="spacingAndGlyphs">15,000 × 0.86</tspan></text></g></svg>
