<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1033" viewBox="0 0 480 1033" lang="he" xml:lang="he" role="img" aria-labelledby="title desc"><title id="title">האם העבודה יכולה להתקדם?</title><desc id="desc">החלטה שואלת אם הבקרות הקריטיות אומתו, עם חלופות לשחרור, עצירה או הערכה מחדש בעקבות שינוי תנאים.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="372.34" lengthAdjust="spacingAndGlyphs">האם העבודה יכולה להתקדם?</tspan></text><g class="diagram-card" data-node="0"><rect x="30" y="121" width="420" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="30" y="121" width="420" height="7" fill="#24463e"/><text x="240" y="160" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="160" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="206" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="240" y="206" textLength="299.61" lengthAdjust="spacingAndGlyphs">בקרות קריטיות אומתו?</tspan></text><text x="240" y="253" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="240" y="253" textLength="302.5" lengthAdjust="spacingAndGlyphs">בודקים כשירות, תנאים וראיות</tspan><tspan x="240" y="285" textLength="79.42" lengthAdjust="spacingAndGlyphs">נדרשות</tspan></text></g><path d="M453 220 H464 V898" stroke="#006f6b" stroke-width="3" fill="none"/><path d="M464 450 L432 450" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="28" y="351" width="396" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="351" width="396" height="7" fill="#006f6b"/><text x="226" y="390" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="226" y="390" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="226" y="436" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="226" y="436" textLength="184.2" lengthAdjust="spacingAndGlyphs">הראיות שלמות</tspan></text><text x="226" y="483" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="226" y="483" textLength="258.28" lengthAdjust="spacingAndGlyphs">אחראי מוסמך יכול לשחרר</tspan><tspan x="226" y="515" textLength="158.62" lengthAdjust="spacingAndGlyphs">בגבולות ההיקף</tspan></text></g><path d="M464 674 L432 674" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="28" y="575" width="396" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="575" width="396" height="7" fill="#24463e"/><text x="226" y="614" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="226" y="614" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="226" y="660" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="226" y="660" textLength="226.61" lengthAdjust="spacingAndGlyphs">בקרה לא הושלמה</tspan></text><text x="226" y="707" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="226" y="707" textLength="309.1" lengthAdjust="spacingAndGlyphs">עוצרים עבודה מושפעת ומקצים</tspan><tspan x="226" y="739" textLength="142.78" lengthAdjust="spacingAndGlyphs">פעולה מתקנת</tspan></text></g><path d="M464 898 L432 898" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="28" y="799" width="396" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="799" width="396" height="7" fill="#006f6b"/><text x="226" y="838" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="226" y="838" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="226" y="884" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="226" y="884" textLength="192.35" lengthAdjust="spacingAndGlyphs">התנאים השתנו</tspan></text><text x="226" y="931" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="226" y="931" textLength="294.8" lengthAdjust="spacingAndGlyphs">עוצרים ומעריכים מחדש לפני</tspan><tspan x="226" y="963" textLength="50.82" lengthAdjust="spacingAndGlyphs">המשך</tspan></text></g></svg>
