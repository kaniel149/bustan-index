<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="410" viewBox="0 0 1040 410" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">จากการสังเกตสู่หลักฐาน</title><desc id="desc">สังเกต บันทึก จำลอง และทบทวน แต่ละขั้นส่งหลักฐานให้ขั้นถัดไป</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="328.85" lengthAdjust="spacingAndGlyphs">จากการสังเกตสู่หลักฐาน</tspan></text><g class="diagram-card" data-node="0"><rect x="40" y="131" width="216" height="243" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="131" width="216" height="7" fill="#24463e"/><text x="148" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="148" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="219" textLength="80.03" lengthAdjust="spacingAndGlyphs">สังเกต</tspan></text><text x="148" y="269" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="269" textLength="167.58" lengthAdjust="spacingAndGlyphs">หลังคา เงา ทางเข้า</tspan><tspan x="148" y="303" textLength="78.96" lengthAdjust="spacingAndGlyphs">และโหลด</tspan></text></g><path d="M260 252.5 L279 252.5" st