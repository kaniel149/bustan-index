<svg xmlns="http://www.w3.org/2000/svg" width="480" height="826" viewBox="0 0 480 826" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">สามมุมมองทางการเงิน</title><desc id="desc">สามนิยามเทียบการคืนทุน อัตราผลตอบแทนภายใน และต้นทุนตลอดอายุคิดลดต่อหน่วยพลังงาน</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="267.7" lengthAdjust="spacingAndGlyphs">สามมุมมองทางการเงิน</tspan></text><g class="diagram-card" data-node="0"><rect x="28" y="125" width="424" height="213" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="125" width="424" height="7" fill="#24463e"/><text x="240" y="164" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="164" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="213" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="213" textLength="131.98" lengthAdjust="spacingAndGlyphs">ระยะคืนทุน</tspan></text><text x="240" y="264" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="264" textLength="363.22" lengthAdjust="spacingAndGlyphs">เมื่อกระแสเงินสดสะสมตามนิยามคืนเงิน</tspan><tspan x="240" y="300" textLength="56.32" lengthAdjust="spacingAndGlyphs">ลงทุน</tspan></text></g><g class="diagram-card" data-node="1"><rect x="28" y="358" width="424" height="213" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="358" width="424" height="7" fill="#006f6b"/><text x="240" y="397" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="397" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="240" y="446" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="446" textLength="279.4" lengthAdjust="spacingAndGlyphs">อัตราผลตอบแทนภายใน</tspan></text><text x="240" y="497" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="497" textLength="367.4" lengthAdjust="spacingAndGlyphs">อัตราคิดลดที่มูลค่าปัจจุบันสุทธิของแบบ</tspan><tspan x="240" y="533" textLength="147.18" lengthAdjust="spacingAndGlyphs">จำลองเป็นศูนย์</tspan></text></g><g class="diagram-card" data-node="2"><rect x="28" y="591" width="424" height="213" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="591" width="424" height="7" fill="#24463e"/><text x="240" y="630" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="630" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="240" y="679" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="679" textLength="355.77" lengthAdjust="spacingAndGlyphs">ต้นทุนพลังงานเฉลี่ยตลอดอายุ</tspan></text><text x="240" y="730" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="730" textLength="366.3" lengthAdjust="spacingAndGlyphs">ต้นทุนตลอดอายุคิดลดหารด้วยพลังงาน</tspan><tspan x="240" y="766" textLength="56.32" lengthAdjust="spacingAndGlyphs">คิดลด</tspan></text></g></svg>
