<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="624" viewBox="0 0 1040 624" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">พร้อมเสนอข้อเสนอสุดท้ายหรือยัง?</title><desc id="desc">หลังคารั่วนำไปสู่การสำรวจ กำหนดการมีเงื่อนไข หรือพักการผูกพันขั้นสุดท้าย</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="475.8" lengthAdjust="spacingAndGlyphs">พร้อมเสนอข้อเสนอสุดท้ายหรือยัง?</tspan></text><g class="diagram-card" data-node="0"><rect x="250" y="131" width="540" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="250" y="131" width="540" height="7" fill="#24463e"/><text x="520" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="520" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="219" textLength="268.16" lengthAdjust="spacingAndGlyphs">หลังคาพร้อมหรือยัง?</tspan></text><text x="520" y="269" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="269" textLength="274.26" lengthAdjust="spacingAndGlyphs">แจ้งว่ารั่ว วางแผนเปลี่ยนปีหน้า</tspan></text></g><path d="M520 314 V345" stroke="#006f6b" stroke-width="3" fill="none"/><path d="M520 345 H189.33 V370" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="40" y="379" width="298.67" height="209" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="379" width="298.67" height="7" fill="#006f6b"/><text x="189.33" y="418" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="189.33" y="418" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="189.33" y="467" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="189.33" y="467" textLength="143.77" lengthAdjust="spacingAndGlyphs">สำรวจก่อน</tspan></text><text x="189.33" y="517" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="189.33" y="517" textLength="207.69" lengthAdjust="spacingAndGlyphs">ทีมเทคนิคตรวจสอบข้อ</tspan><tspan x="189.33" y="551" textLength="53.76" lengthAdjust="spacingAndGlyphs">จำกัด</tspan></text></g><path d="M520 345 H520 V370" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="370.67" y="379" width="298.67" height="209" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="370.67" y="379" width="298.67" height="7" fill="#24463e"/><text x="520" y="418" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="418" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="520" y="467" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="467" textLength="244.02" lengthAdjust="spacingAndGlyphs">กำหนดการมีเงื่อนไข</tspan></text><text x="520" y="517" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="517" textLength="252.84" lengthAdjust="spacingAndGlyphs">ประสานงานหลังคากับงานโซ</tspan><tspan x="520" y="551" textLength="35.91" lengthAdjust="spacingAndGlyphs">ลาร์</tspan></text></g><path d="M520 345 H850.67 V370" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="701.33" y="379" width="298.67" height="209" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="701.33" y="379" width="298.67" height="7" fill="#006f6b"/><text x="850.67" y="418" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="850.67" y="418" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="850.67" y="467" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="850.67" y="467" textLength="155.84" lengthAdjust="spacingAndGlyphs">พักการผูกพัน</tspan></text><text x="850.67" y="517" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="850.67" y="517" textLength="216.72" lengthAdjust="spacingAndGlyphs">ข้อจำกัดที่ยังไม่ยุติขวาง</tspan><tspan x="850.67" y="551" textLength="136.08" lengthAdjust="spacingAndGlyphs">ขอบเขตสุดท้าย</tspan></text></g></svg>
