<svg xmlns="http://www.w3.org/2000/svg" width="480" height="711" viewBox="0 0 480 711" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">ตรวจความจุบริการก่อนสัญญา</title><desc id="desc">แท่งสามแท่งเทียบงานผูกพันหกสิบชั่วโมง เวลาผู้มีคุณสมบัติแปดสิบชั่วโมง และเก้าสิบชั่วโมงหลังรับงานใหม่</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="346.38" lengthAdjust="spacingAndGlyphs">ตรวจความจุบริการก่อนสัญญา</tspan></text><g class="diagram-bar" data-node="0"><text x="28" y="150" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="150" textLength="151.84" lengthAdjust="spacingAndGlyphs">งานผูกพันเดิม</tspan></text><text x="28" y="191" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="191" textLength="325.15" lengthAdjust="spacingAndGlyphs">60 ชั่วโมงผู้มีคุณสมบัติ · ตัวอย่างฝึก</tspan></text><rect x="28" y="215" width="424" height="28" rx="3" fill="#dedfce"/><rect x="28" y="215" width="282.67" height="28" rx="3" fill="#24463e"/><text x="28" y="274" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="274" textLength="343.35" lengthAdjust="spacingAndGlyphs">บริการ งานหน้างาน เดินทาง และบันทึก</tspan></text></g><g class="diagram-bar" data-node="1"><text x="28" y="342" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="342" textLength="223.86" lengthAdjust="spacingAndGlyphs">ชั่วโมงทีมมีคุณสมบัติ</tspan></text><text x="28" y="383" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="383" textLength="325.15" lengthAdjust="spacingAndGlyphs">80 ชั่วโมงผู้มีคุณสมบัติ · ตัวอย่างฝึก</tspan></text><rect x="28" y="407" width="424" height="28" rx="3" fill="#dedfce"/><rect x="28" y="407" width="376.89" height="28" rx="3" fill="#006f6b"/><text x="28" y="466" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="466" textLength="355.95" lengthAdjust="spacingAndGlyphs">ชั่วโมงผู้มีคุณสมบัติที่ใช้ได้ในช่วงตัวอย่าง</tspan></text></g><g class="diagram-bar" data-node="2"><text x="28" y="534" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="534" textLength="135.2" lengthAdjust="spacingAndGlyphs">รวมงานใหม่</tspan></text><text x="28" y="575" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="575" textLength="325.15" lengthAdjust="spacingAndGlyphs">90 ชั่วโมงผู้มีคุณสมบัติ · ตัวอย่างฝึก</tspan></text><rect x="28" y="599" width="424" height="28" rx="3" fill="#dedfce"/><rect x="28" y="599" width="424" height="28" rx="3" fill="#24463e"/><text x="28" y="658" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="658" textLength="318.65" lengthAdjust="spacingAndGlyphs">เดิม 60 บวกงานเสนอใหม่ 