<svg xmlns="http://www.w3.org/2000/svg" width="480" height="711" viewBox="0 0 480 711" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">เงินที่มีเทียบกับหนี้ถึงกำหนด</title><desc id="desc">CFADS รายปี 120,000 หรือ 80,000 บาท เทียบภาระหนี้ 100,000 บาท</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="327.18" lengthAdjust="spacingAndGlyphs">เงินที่มีเทียบกับหนี้ถึงกำหนด</tspan></text><g class="diagram-bar" data-node="0"><text x="28" y="150" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="150" textLength="262.86" lengthAdjust="spacingAndGlyphs">เงินพร้อมชำระกรณีฐาน</tspan></text><text x="28" y="191" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="191" textLength="177.34" lengthAdjust="spacingAndGlyphs">120000 บาทต่อปีฝึก</tspan></text><rect x="28" y="215" width="424" height="28" rx="3" fill="#dedfce"/><rect x="28" y="215" width="424" height="28" rx="3" fill="#24463e"/><text x="28" y="274" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="274" textLength="211.66" lengthAdjust="spacingAndGlyphs">CFADS รายปีตามนิยาม</tspan></text></g><g class="diagram-bar" data-node="1"><text x="28" y="342" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="342" textLength="277.68" lengthAdjust="spacingAndGlyphs">ภาระชำระหนี้ตามกำหนด</tspan></text><text x="28" y="383" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="383" textLength="177.34" lengthAdjust="spacingAndGlyphs">100000 บาทต่อปีฝึก</tspan></text><rect x="28" y="407" width="424" height="28" rx="3" fill="#dedfce"/><rect x="28" y="407" width="353.33" height="28" rx="3" fill="#006f6b"/><text x="28" y="466" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="466" textLength="301.98" lengthAdjust="spacingAndGlyphs">เงินต้น 80,000 + ดอกเบี้ย 20,000</tspan></text></g><g class="diagram-bar" data-node="2"><text x="28" y="534" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="534" textLength="247.52" lengthAdjust="spacingAndGlyphs">เงินพร้อมชำระกรณีแย่</tspan></text><text x="28" y="575" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="575" textLength="165.78" lengthAdjust="spacingAndGlyphs">80000 บาทต่อปีฝึก</tspan></text><rect x="28" y="599" width="424" height="28" rx="3" fill="#dedfce"/><rect x="28" y="599" width="282.67" height="28" rx="3" fill="#24463e"/><text x="28" y="658" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="658" textLength="228.48" lengthAdjust="spacingAndGlyphs">งวดและนิยามเงินเดียวกัน</tspan></text></g></svg>
