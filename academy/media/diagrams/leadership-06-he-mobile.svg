<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1015" viewBox="0 0 480 1015" lang="he" xml:lang="he" role="img" aria-labelledby="title desc"><title id="title">מסווגים לפני שינוי הבסיס</title><desc id="desc">החלטת סיווג מפרידה היקף חדש, תיקון ליקוי וחשיפה לסיכון לא ודאי.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="329.08" lengthAdjust="spacingAndGlyphs">מסווגים לפני שינוי הבסיס</tspan></text><g class="diagram-card" data-node="0"><rect x="30" y="121" width="420" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="30" y="121" width="420" height="7" fill="#24463e"/><text x="240" y="160" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="160" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="206" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="240" y="206" textLength="158.09" lengthAdjust="spacingAndGlyphs">מה השתנה?</tspan></text><text x="240" y="253" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="240" y="253" textLength="335.94" lengthAdjust="spacingAndGlyphs">משווים את הבקשה לבסיס המוסכם</tspan></text></g><path d="M453 211 H464 V880" stroke="#006f6b" stroke-width="3" fill="none"/><path d="M464 432 L432 432"