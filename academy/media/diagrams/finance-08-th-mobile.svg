<svg xmlns="http://www.w3.org/2000/svg" width="480" height="793" viewBox="0 0 480 793" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">แยกความไวจากสถานการณ์</title><desc id="desc">ประโยชน์ดำเนินงานฐาน 120,000 บาทลดเหลือ 60,000 เมื่อสองปัจจัยแย่ลงพร้อมกัน</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="309.61" lengthAdjust="spacingAndGlyphs">แยกความไวจากสถานการณ์</tspan></text><g class="diagram-card" data-node="0"><rect x="28" y="125" width="424" height="213" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="125" width="424" height="7" fill="#24463e"/><text x="240" y="164" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="164" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="213" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="213" textLength="101.93" lengthAdjust="spacingAndGlyphs">กรณีฐาน</tspan></text><text x="240" y="264" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="264" textLength="360.25" lengthAdjust="spacingAndGlyphs">ประโยชน์ 150,000 − OPEX 30,000 =</tspan><tspan x="240" y="300" textLength="123.33" lengthAdjust="spacingAndGlyphs">120,000 บาท</tspan></text></g><g class="diagram-card" data-node="1"><rect x="28" y="358" width="424" height="213" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="358" width="424" height="7" fill="#006f6b"/><text x="240" y="397" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="397" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="240" y="446" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="446" textLength="277.15" lengthAdjust="spacingAndGlyphs">กรณีแย่รวมหลายปัจจัย</tspan></text><text x="240" y="497" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="497" textLength="360.25" lengthAdjust="spacingAndGlyphs">ประโยชน์ 100,000 − OPEX 40,000 =</tspan><tspan x="240" y="533" textLength="111.1" lengthAdjust="spacingAndGlyphs">60,000 บาท</tspan></text></g><g class="diagram-card" data-node="2"><rect x="28" y="591" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="591" width="424" height="7" fill="#24463e"/><text x="240" y="630" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="630" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="240" y="679" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="679" textLength="205.83" lengthAdjust="spacingAndGlyphs">เปลี่ยนสองปัจจัย</tspan></text><text x="240" y="730" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="730" textLength="337.04" lengthAdjust="spacingAndGlyphs">ประโยชน์ลด ค่าใช้จ่ายดำเนินงานเพิ่ม</tspan></text></g></svg>
