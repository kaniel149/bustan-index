<svg xmlns="http://www.w3.org/2000/svg" width="480" height="711" viewBox="0 0 480 711" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Energy generated is not all saved</title><desc id="desc">12 kWh generation splits into 8 kWh direct consumption and 4 kWh surplus.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="401.57" lengthAdjust="spacingAndGlyphs">Energy generated is not all saved</tspan></text><g class="diagram-bar" data-node="0"><text x="28" y="146" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="146" textLength="166.24" lengthAdjust="spacingAndGlyphs">AC generation</tspan></text><text x="28" y="184" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="184" textLength="255.01" lengthAdjust="spacingAndGlyphs">12 kWh · one training hour</tspan></text><rect x="28" y="205" width="424" height="28" rx="3" fill="#dedfce"/><rect x="28" y="205" width="424" height="28" rx="3" fill="#24463e"/><text x="28" y="264" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="264" textLength="197.57" lengthAdjust="spacingAndGlyphs">PV-only training hour</tspan></text></g><g class="diagram-bar" data-node="1"><text x="28" y="329" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="329" textLength="117.08" lengthAdjust="spacingAndGlyphs">Direct use</tspan></text><text x="28" y="367" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="367" textLength="243.44" lengthAdjust="spacingAndGlyphs">8 kWh · one training hour</tspan></text><rect x="28" y="388" width="424" height="28" rx="3" fill="#dedfce"/><rect x="28" y="388" width="282.67" height="28" rx="3" fill="#006f6b"/><text x="28" y="447" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="447" textLength="225.44" lengthAdjust="spacingAndGlyphs">Matches the 8 kWh load</tspan></text></g><g class="diagram-bar" data-node="2"><text x="28" y="512" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="512" textLength="88.14" lengthAdjust="spacingAndGlyphs">Surplus</tspan></text><text x="28" y="550" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="550" textLength="243.44" lengthAdjust="spacingAndGlyphs">4 kWh · one training hour</tspan></text><rect x="28" y="571" width="424" height="28" rx="3" fill="#dedfce"/><rect x="28" y="571" width="141.33" height="28" rx="3" fill="#24463e"/><text x="28" y="630" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="630" textLength="340.94" lengthAdjust="spacingAndGlyphs">Destination permitted; compensation</tspan><tspan x="28" y="661" textLength="91.04" lengthAdjust="spacingAndGlyphs">unverified</tspan></text></g></svg>
