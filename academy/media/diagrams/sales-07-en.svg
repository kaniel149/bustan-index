<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="421" viewBox="0 0 1040 421" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Turn an objection into scope</title><desc id="desc">Listen, clarify the operational constraint, verify with engineering, and document the agreement.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="392.18" lengthAdjust="spacingAndGlyphs">Turn an objection into scope</tspan></text><g class="diagram-card" data-node="0"><rect x="40" y="127" width="216" height="258" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="127" width="216" height="7" fill="#24463e"/><text x="148" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="148" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="212" textLength="74.92" lengthAdjust="spacingAndGlyphs">Listen</tspan></text><text x="148" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="258" textLength="151.77" lengthAdjust="spacingAndGlyphs">Restaurant asks</tspan><tspan x="148" y="289" textLength="126.13" lengthAdjust="spacingAndGlyphs">for no service</tspan><tspan x="148" y="320" textLength="105.04" lengthAdjust="spacingAndGlyphs">interruption</tspan></text></g><path d="M260 256 L279 256" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="288" y="127" width="216" height="258" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="288" y="127" width="216" height="7" fill="#006f6b"/><text x="396" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="396" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="212" textLength="79.55" lengthAdjust="spacingAndGlyphs">Clarify</tspan></text><text x="396" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="258" textLength="171.63" lengthAdjust="spacingAndGlyphs">Identify operations</tspan><tspan x="396" y="289" textLength="165.82" lengthAdjust="spacingAndGlyphs">and unacceptable</tspan><tspan x="396" y="320" textLength="72.35" lengthAdjust="spacingAndGlyphs">impacts</tspan></text></g><path d="M508 256 L527 256" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="536" y="127" width="216" height="258" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="536" y="127" width="216" height="7" fill="#24463e"/><text x="644" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="644" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="212" textLength="71.77" lengthAdjust="spacingAndGlyphs">Verify</tspan></text><text x="644" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="258" textLength="112.06" lengthAdjust="spacingAndGlyphs">Engineering</tspan><tspan x="644" y="289" textLength="100.42" lengthAdjust="spacingAndGlyphs">checks the</tspan><tspan x="644" y="320" textLength="142.46" lengthAdjust="spacingAndGlyphs">connection and</tspan><tspan x="644" y="351" textLength="91.06" lengthAdjust="spacingAndGlyphs">sequence</tspan></text></g><path d="M756 256 L775 256" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="784" y="127" width="216" height="258" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="784" y="127" width="216" height="7" fill="#006f6b"/><text x="892" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="892" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="212" textLength="127.96" lengthAdjust="spacingAndGlyphs">Document</tspan></text><text x="892" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="258" textLength="145.93" lengthAdjust="spacingAndGlyphs">Agree workable</tspan><tspan x="892" y="289" textLength="121.42" lengthAdjust="spacingAndGlyphs">windows and</tspan><tspan x="892" y="320" textLength="102.71" lengthAdjust="spacingAndGlyphs">unresolved</tspan><tspan x="892" y="351" textLength="94.54" lengthAdjust="spacingAndGlyphs">conditions</tspan></text></g></svg>
