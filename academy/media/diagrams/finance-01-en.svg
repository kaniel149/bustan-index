<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="695" viewBox="0 0 1040 695" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Energy generated is not all saved</title><desc id="desc">12 kWh generation splits into 8 kWh direct consumption and 4 kWh surplus.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="463.35" lengthAdjust="spacingAndGlyphs">Energy generated is not all saved</tspan></text><g class="diagram-bar" data-node="0"><text x="40" y="154" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="154" textLength="179.54" lengthAdjust="spacingAndGlyphs">AC generation</tspan></text><text x="40" y="193" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="193" textLength="255.01" lengthAdjust="spacingAndGlyphs">12 kWh · one training hour</tspan></text><rect x="40" y="214" width="960" height="28" rx="3" fill="#dedfce"/><rect x="40" y="214" width="960" height="28" rx="3" fill="#24463e"/><text x="40" y="273" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="273" textLength="197.57" lengthAdjust="spacingAndGlyphs">PV-only training hour</tspan></text></g><g class="diagram-bar" data-node="1"><text x="40" y="340" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="340" textLength="126.44" lengthAdjust="spacingAndGlyphs">Direct use</tspan></text><text x="40" y="379" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="379" textLength="243.44" lengthAdjust="spacingAndGlyphs">8 kWh · one training hour</tspan></text><rect x="40" y="400" width="960" height="28" rx="3" fill="#dedfce"/><rect x="40" y="400" width="640" height="28" rx="3" fill="#006f6b"/><text x="40" y="459" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="459" textLength="225.44" lengthAdjust="spacingAndGlyphs">Matches the 8 kWh load</tspan></text></g><g class="diagram-bar" data-node="2"><text x="40" y="526" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="526" textLength="95.19" lengthAdjust="spacingAndGlyphs">Surplus</tspan></text><text x="40" y="565" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="565" textLength="243.44" lengthAdjust="spacingAndGlyphs">4 kWh · one training hour</tspan></text><rect x="40" y="586" width="960" height="28" rx="3" fill="#dedfce"/><rect x="40" y="586" width="320" height="28" rx="3" fill="#24463e"/><text x="40" y="645" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="40" y="645" textLength="437.85" lengthAdjust="spacingAndGlyphs">Destination permitted; compensation unverified</tspan></text></g></svg>
