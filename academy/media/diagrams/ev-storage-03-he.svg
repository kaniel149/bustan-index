<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="627" viewBox="0 0 1040 627" lang="he" xml:lang="he" role="img" aria-labelledby="title desc"><title id="title">להפוך עדיפויות לנצפות</title><desc id="desc">מחזור בקרה מודד ביקוש, מיישם עדיפויות, מקצה טעינה ומאמת תגובה.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="339.46" lengthAdjust="spacingAndGlyphs">להפוך עדיפויות לנצפות</tspan></text><path d="M566 225 L479 225" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M260 327 L260 386" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M474 493 L561 493" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M780 391 L780 332" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="0"><rect x="570" y="127" width="420" height="196" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="570" y="127" width="420" height="7" fill="#24463e"/><text x="780" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="780" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="780" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="780" y="212" textLength="250.75" lengthAdjust="spacingAndGlyphs">מדידת ייצור וביקוש</tsp