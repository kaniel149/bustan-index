<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1015" viewBox="0 0 480 1015" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Ready for a final proposal?</title><desc id="desc">Roof leaks trigger survey, conditional scheduling or a hold on final commitment.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="329.94" lengthAdjust="spacingAndGlyphs">Ready for a final proposal?</tspan></text><g class="diagram-card" data-node="0"><rect x="30" y="121" width="420" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="30" y="121" width="420" height="7" fill="#24463e"/><text x="240" y="160" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="160" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="206" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="206" textLength="225.54" lengthAdjust="spacingAndGlyphs">Is the roof ready?</tspan></text><text x="240" y="253" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="253" textLength="364.58" lengthAdjust="spacingAndGlyphs">Leaks reported; replacement planned</tspan><tspan x="240" y="285" textLength="90.53" lengthAdjust="spacingAndGlyphs">next year</tspan></text></g><path d="M27 220 H16 V880" stroke="#006f6b" stroke-width="3" fill="none"/><path d="M16 450 L48 450" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="56" y="351" width="396" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="56" y="351" width="396" height="7" fill="#006f6b"/><text x="254" y="390" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="390" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="254" y="436" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="436" textLength="140.48" lengthAdjust="spacingAndGlyphs">Survey first</tspan></text><text x="254" y="483" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="483" textLength="286.24" lengthAdjust="spacingAndGlyphs">Technical team examines the</tspan><tspan x="254" y="515" textLength="95.37" lengthAdjust="spacingAndGlyphs">constraint</tspan></text></g><path d="M16 665 L48 665" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="56" y="575" width="396" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="56" y="575" width="396" height="7" fill="#24463e"/><text x="254" y="614" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="614" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="254" y="660" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="660" textLength="260.69" lengthAdjust="spacingAndGlyphs">Conditional schedule</tspan></text><text x="254" y="707" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="707" textLength="300.96" lengthAdjust="spacingAndGlyphs">Coordinate roof and solar work</tspan></text></g><path d="M16 880 L48 880" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="56" y="781" width="396" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="56" y="781" width="396" height="7" fill="#006f6b"/><text x="254" y="820" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="820" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="254" y="866" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="866" textLength="218.49" lengthAdjust="spacingAndGlyphs">Hold commitment</tspan></text><text x="254" y="913" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="913" textLength="320.47" lengthAdjust="spacingAndGlyphs">Unresolved condition blocks final</tspan><tspan x="254" y="945" textLength="58.7" lengthAdjust="spacingAndGlyphs">scope</tspan></text></g></svg>
