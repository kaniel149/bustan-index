<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="390" viewBox="0 0 1040 390" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Four jobs around the module</title><desc id="desc">Conversion, protection, measurement and monitoring are separate system functions.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="399.11" lengthAdjust="spacingAndGlyphs">Four jobs around the module</tspan></text><g class="diagram-card" data-node="0"><rect x="40" y="127" width="216" height="227" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="127" width="216" height="7" fill="#24463e"/><text x="148" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="148" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="212" textLength="98.31" lengthAdjust="spacingAndGlyphs">Convert</tspan></text><text x="148" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="258" textLength="163.44" lengthAdjust="spacingAndGlyphs">Inverter manages</tspan><tspan x="148" y="289" textLength="82.85" lengthAdjust="spacingAndGlyphs">electrical</tspan><tspan x="148" y="320" textLength="101.54" lengthAdjust="spacingAndGlyphs">conversion</tspan></text></g><g class="diagram-card" data-node="1"><rect x="288" y="127" width="216" height="227" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="288" y="127" width="216" height="7" fill="#006f6b"/><text x="396" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="396" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="212" textLength="88.96" lengthAdjust="spacingAndGlyphs">Protect</tspan></text><text x="396" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="258" textLength="158.78" lengthAdjust="spacingAndGlyphs">Selected devices</tspan><tspan x="396" y="289" textLength="149.46" lengthAdjust="spacingAndGlyphs">address defined</tspan><tspan x="396" y="320" textLength="50.19" lengthAdjust="spacingAndGlyphs">faults</tspan></text></g><g class="diagram-card" data-node="2"><rect x="536" y="127" width="216" height="227" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="536" y="127" width="216" height="7" fill="#24463e"/><text x="644" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="644" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="212" textLength="109.23" lengthAdjust="spacingAndGlyphs">Measure</tspan></text><text x="644" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="258" textLength="131.92" lengthAdjust="spacingAndGlyphs">Meter location</tspan><tspan x="644" y="289" textLength="102.77" lengthAdjust="spacingAndGlyphs">defines the</tspan><tspan x="644" y="320" textLength="70.04" lengthAdjust="spacingAndGlyphs">reading</tspan></text></g><g class="diagram-card" data-node="3"><rect x="784" y="127" width="216" height="227" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="784" y="127" width="216" height="7" fill="#006f6b"/><text x="892" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="892" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="212" textLength="93.62" lengthAdjust="spacingAndGlyphs">Monitor</tspan></text><text x="892" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="258" textLength="82.87" lengthAdjust="spacingAndGlyphs">Software</tspan><tspan x="892" y="289" textLength="87.53" lengthAdjust="spacingAndGlyphs">interprets</tspan><tspan x="892" y="320" textLength="175.1" lengthAdjust="spacingAndGlyphs">available telemetry</tspan></text></g></svg>
