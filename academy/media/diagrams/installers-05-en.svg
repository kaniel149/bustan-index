<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="430" viewBox="0 0 1040 430" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Different protective duties</title><desc id="desc">Four parallel cards distinguish overcurrent, residual current, surge protection and bonding/earthing.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="353.87" lengthAdjust="spacingAndGlyphs">Different protective duties</tspan></text><g class="diagram-card" data-node="0"><rect x="40" y="127" width="216" height="267" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="127" width="216" height="7" fill="#24463e"/><text x="148" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="148" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="212" textLength="148.23" lengthAdjust="spacingAndGlyphs">Overcurrent</tspan></text><text x="148" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="258" textLength="137.74" lengthAdjust="spacingAndGlyphs">Review ratings</tspan><tspan x="148" y="289" textLength="80.6" lengthAdjust="spacingAndGlyphs">and fault</tspan><tspan x="148" y="320" textLength="110.92" lengthAdjust="spacingAndGlyphs">interruption.</tspan></text></g><g class="diagram-card" data-node="1"><rect x="288" y="127" width="216" height="267" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="288" y="127" width="216" height="7" fill="#006f6b"/><text x="396" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="396" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="212" textLength="109.23" lengthAdjust="spacingAndGlyphs">Residual</tspan><tspan x="396" y="252" textLength="87.38" lengthAdjust="spacingAndGlyphs">current</tspan></text><text x="396" y="298" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="298" textLength="169.34" lengthAdjust="spacingAndGlyphs">Exact product and</tspan><tspan x="396" y="329" textLength="136.58" lengthAdjust="spacingAndGlyphs">system govern</tspan><tspan x="396" y="360" textLength="88.75" lengthAdjust="spacingAndGlyphs">selection.</tspan></text></g><g class="diagram-card" data-node="2"><rect x="536" y="127" width="216" height="267" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="536" y="127" width="216" height="7" fill="#24463e"/><text x="644" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="644" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="212" textLength="74.92" lengthAdjust="spacingAndGlyphs">Surge</tspan><tspan x="644" y="252" textLength="123.3" lengthAdjust="spacingAndGlyphs">protection</tspan></text><text x="644" y="298" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="298" textLength="145.93" lengthAdjust="spacingAndGlyphs">Coordinate with</tspan><tspan x="644" y="329" textLength="122.62" lengthAdjust="spacingAndGlyphs">the approved</tspan><tspan x="644" y="360" textLength="165.84" lengthAdjust="spacingAndGlyphs">protection design.</tspan></text></g><g class="diagram-card" data-node="3"><rect x="784" y="127" width="216" height="267" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="784" y="127" width="216" height="7" fill="#006f6b"/><text x="892" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="892" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="212" textLength="157.73" lengthAdjust="spacingAndGlyphs">Bonding and</tspan><tspan x="892" y="252" textLength="101.45" lengthAdjust="spacingAndGlyphs">earthing</tspan></text><text x="892" y="298" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="298" textLength="140.11" lengthAdjust="spacingAndGlyphs">Verify intended</tspan><tspan x="892" y="329" textLength="130.81" lengthAdjust="spacingAndGlyphs">paths in every</tspan><tspan x="892" y="360" textLength="151.83" lengthAdjust="spacingAndGlyphs">operating mode.</tspan></text></g></svg>
