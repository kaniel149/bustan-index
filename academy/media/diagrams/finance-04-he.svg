<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="399" viewBox="0 0 1040 399" lang="he" xml:lang="he" role="img" aria-labelledby="title desc"><title id="title">מציגים תזרים החלפה במפורש</title><desc id="desc">השקעה ראשונית של 300,000 באט, הוצאה שנתית 10,000 והחלפה משוערת בשנה השמינית ב־80,000 באט.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="436.18" lengthAdjust="spacingAndGlyphs">מציגים תזרים החלפה במפורש</tspan></text><g class="diagram-card" data-node="0"><rect x="784" y="127" width="216" height="236" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="784" y="127" width="216" height="7" fill="#24463e"/><text x="892" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="892" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="892" y="212" textLength="91.26" lengthAdjust="spacingAndGlyphs">השקעה</tspan><tspan x="892" y="252" textLength="111.48" lengthAdjust="spacingAndGlyphs">ראשונית</tspan></text><text x="892" y="298" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="892" y="298" textLength="136.08" lengthAdjust="spacingAndGlyphs">תשומת תרגול:</tspan><tspan x="892" y="329" textLength="122.77" lengthAdjust="spacingAndGlyphs">300,000 באט</tspan></text></g><path d="M780 245 L761 245" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="536" y="127" width="216" height="236" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="536" y="127" width="216" height="7" fill="#006f6b"/><text x="644" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="644" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="644" y="212" textLength="174.1" lengthAdjust="spacingAndGlyphs">הוצאה שנתית</tspan></text><text x="644" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="644" y="258" textLength="157.92" lengthAdjust="spacingAndGlyphs">10,000 באט בכל</tspan><tspan x="644" y="289" textLength="40.95" lengthAdjust="spacingAndGlyphs">שנה</tspan></text></g><path d="M532 245 L513 245" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="288" y="127" width="216" height="236" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="288" y="127" width="216" height="7" fill="#24463e"/><text x="396" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="396" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="396" y="212" textLength="172.13" lengthAdjust="spacingAndGlyphs">החלפה בשנה</tspan><tspan x="396" y="252" textLength="15.61" lengthAdjust="spacingAndGlyphs">8</tspan></text><text x="396" y="298" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="396" y="298" textLength="122.43" lengthAdjust="spacingAndGlyphs">עלות תרחיש:</tspan><tspan x="396" y="329" textLength="111.09" lengthAdjust="spacingAndGlyphs">80,000 באט</tspan></text></g><path d="M284 245 L265 245" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="40" y="127" width="216" height="236" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="127" width="216" height="7" fill="#006f6b"/><text x="148" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="148" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="148" y="212" textLength="165.95" lengthAdjust="spacingAndGlyphs">בדיקת ראיות</tspan></text><text x="148" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="148" y="258" textLength="151.2" lengthAdjust="spacingAndGlyphs">בודקים אחריות,</tspan><tspan x="148" y="289" textLength="137.76" lengthAdjust="spacingAndGlyphs">החרגות והיקף</tspan><tspan x="148" y="320" textLength="68.25" lengthAdjust="spacingAndGlyphs">החלפה</tspan></text></g></svg>
