<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1032" viewBox="0 0 480 1032" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">ทำให้จุดอนุมัติตรวจสอบได้</title><desc id="desc">สี่ขั้นทำให้จุดอนุมัติชัดเจน ได้แก่ คำตัดสิน เจ้าของ หลักฐานที่ต้องมี และผลที่บันทึก</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="309.88" lengthAdjust="spacingAndGlyphs">ทำให้จุดอนุมัติตรวจสอบได้</tspan></text><g class="diagram-card" data-node="0"><rect x="28" y="125" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="125" width="424" height="7" fill="#24463e"/><text x="240" y="164" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="164" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="213" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="213" textLength="194.03" lengthAdjust="spacingAndGlyphs">ระบุการตัดสินใจ</tspan></text><text x="240" y="264" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="264" textLength="271.26" lengthAdjust="spacingAndGlyphs">ระบุชัดว่างานใดจะเดินหน้าต่อ</tspan></text></g><path d="M240 309 L240 334" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="28" y="343" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="343" width="424" height="7" fill="#006f6b"/><text x="240" y="382" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="382" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="240" y="431" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="431" textLength="233.63" lengthAdjust="spacingAndGlyphs">กำหนดผู้รับผิดชอบ</tspan></text><text x="240" y="482" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="482" textLength="331.54" lengthAdjust="spacingAndGlyphs">แยกเจ้าของคำตัดสินจากผู้สนับสนุน</tspan></text></g><path d="M240 527 L240 552" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="28" y="561" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="561" width="424" height="7" fill="#24463e"/><text x="240" y="600" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="600" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="240" y="649" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="649" textLength="191.79" lengthAdjust="spacingAndGlyphs">กำหนดหลักฐาน</tspan></text><text x="240" y="700" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="700" textLength="316.14" lengthAdjust="spacingAndGlyphs">ตรวจเกณฑ์ที่ตกลงและเงื่อนไขค้าง</tspan></text></g><path d="M240 745 L240 770" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="28" y="779" width="424" height="213" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="779" width="424" height="7" fill="#006f6b"/><text x="240" y="818" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="818" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="240" y="867" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="867" textLength="179.71" lengthAdjust="spacingAndGlyphs">บันทึกผลตัดสิน</tspan></text><text x="240" y="918" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="918" textLength="337.48" lengthAdjust="spacingAndGlyphs">อนุมัติ พัก หรือส่งกลับพร้อมงานและ</tspan><tspan x="240" y="954" textLength="72.16" lengthAdjust="spacingAndGlyphs">เจ้าของ</tspan></text></g></svg>
