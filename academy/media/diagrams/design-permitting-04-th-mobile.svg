<svg xmlns="http://www.w3.org/2000/svg" width="480" height="793" viewBox="0 0 480 793" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">การตรวจไฟฟ้าสามด้านแยกกัน</title><desc id="desc">สามด้านเปรียบเทียบพิกัดกระแส แรงดันตก และการตัดเมื่อขัดข้อง การผ่านด้านหนึ่งไม่ได้ยืนยันด้านอื่น</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="344.22" lengthAdjust="spacingAndGlyphs">การตรวจไฟฟ้าสามด้านแยกกัน</tspan></text><g class="diagram-card" data-node="0"><rect x="28" y="125" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="125" width="424" height="7" fill="#24463e"/><text x="240" y="164" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="164" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="213" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="213" textLength="169.32" lengthAdjust="spacingAndGlyphs">รองรับกระแส</tspan></text><text x="240" y="264" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="264" textLength="359.7" lengthAdjust="spacingAndGlyphs">สภาพติดตั้งมีผลต่อกระแสที่ตัวนำรับได้</tspan></text></g><g class="diagram-card" data-node="1"><rect x="28" y="325" width="424" height="213" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="325" width="424" height="7" fill="#006f6b"/><text x="240" y="364" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="364" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="240" y="413" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="413" textLength="193.19" lengthAdjust="spacingAndGlyphs">จำกัดแรงดันตก</tspan></text><text x="240" y="464" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="464" textLength="358.38" lengthAdjust="spacingAndGlyphs">ความยาวและความต้านทานมีผลต่อการ</tspan><tspan x="240" y="500" textLength="62.7" lengthAdjust="spacingAndGlyphs">สูญเสีย</tspan></text></g><g class="diagram-card" data-node="2"><rect x="28" y="558" width="424" height="213" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="558" width="424" height="7" fill="#24463e"/><text x="240" y="597" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="597" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="240" y="646" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="646" textLength="241.77" lengthAdjust="spacingAndGlyphs">ตัดวงจรเมื่อขัดข้อง</tspan></text><text x="240" y="697" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="697" textLength="350.46" lengthAdjust="spacingAndGlyphs">การป้องกันและต่อลงดินต้องเหมาะกับ</tspan><tspan x="240" y="733" textLength="96.8" lengthAdjust="spacingAndGlyphs">แต่ละโหมด</tspan></text></g></svg>
