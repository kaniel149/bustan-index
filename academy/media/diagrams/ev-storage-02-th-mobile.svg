<svg xmlns="http://www.w3.org/2000/svg" width="480" height="760" viewBox="0 0 480 760" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">แปลงไฟที่ไหน?</title><desc id="desc">เทียบแปลง AC ในรถกับแปลง DC ภายนอกและขีดร่วมระบบ.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="171.43" lengthAdjust="spacingAndGlyphs">แปลงไฟที่ไหน?</tspan></text><g class="diagram-card" data-node="0"><rect x="28" y="125" width="424" height="213" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="125" width="424" height="7" fill="#24463e"/><text x="240" y="164" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="164" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="213" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="213" textLength="112.85" lengthAdjust="spacingAndGlyphs">ชาร์จ AC</tspan></text><text x="240" y="264" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="264" textLength="352.64" lengthAdjust="spacingAndGlyphs">เครื่องชาร์จบนรถแปลง AC ที่จ่ายเป็น</tspan><tspan x="240" y="300" textLength="37.93" lengthAdjust="spacingAndGlyphs">DC.</tspan></text></g><g class="diagram-card" data-node="1"><rect x="28" y="358" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="358" width="424" height="7" fill="#006f6b"/><text x="240" y="397" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="397" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="240" y="446" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="446" textLength="114.4" lengthAdjust="spacingAndGlyphs">ชาร์จ DC</tspan></text><text x="240" y="497" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="497" textLength="349.45" lengthAdjust="spacingAndGlyphs">เครื่องภายนอกจ่าย DC ควบคุมให้รถ.</tspan></text></g><g class="diagram-card" data-node="2"><rect x="28" y="558" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="558" width="424" height="7" fill="#24463e"/><text x="240" y="597" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="597" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="240" y="646" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="646" textLength="137.87" lengthAdjust="spacingAndGlyphs">ขีดทั้งระบบ</tspan></text><text x="240" y="697" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="697" textLength="340.78" lengthAdjust="spacingAndGlyphs">รถ เครื่อง ขั้วต่อ และไซต์ต้องเข้ากัน.</ts