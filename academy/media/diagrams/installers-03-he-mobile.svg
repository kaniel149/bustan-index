<svg xmlns="http://www.w3.org/2000/svg" width="480" height="979" viewBox="0 0 480 979" lang="he" xml:lang="he" role="img" aria-labelledby="title desc"><title id="title">לקבל את החלק שסופק?</title><desc id="desc">החלטת קבלה מתפצלת למאושר, הפרדה או בדיקת חלופה.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="300.14" lengthAdjust="spacingAndGlyphs">לקבל את החלק שסופק?</tspan></text><g class="diagram-card" data-node="0"><rect x="30" y="121" width="420" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="30" y="121" width="420" height="7" fill="#24463e"/><text x="240" y="160" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="160" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="206" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="240" y="206" textLength="214.81" lengthAdjust="spacingAndGlyphs">התאמה מדויקת?</tspan></text><text x="240" y="253" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="240" y="253" textLength="349.8" lengthAdjust="spacingAndGlyphs">בודקים זהות, מצב וגבולות חשיפה.</tspan></text></g><path d="M453 211 H464 V853" stroke="#006f6b" stroke-width="3" fill="none"/><path d="M464 423 L432 423" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="28" y="333" width="396" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="333" width="396" height="7" fill="#006f6b"/><text x="226" y="372" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="226" y="372" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="226" y="418" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="226" y="418" textLength="155.84" lengthAdjust="spacingAndGlyphs">מלאי מאושר</tspan></text><text x="226" y="465" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="226" y="465" textLength="300.96" lengthAdjust="spacingAndGlyphs">עקיב ומתאים לשימוש המאושר.</tspan></text></g><path d="M464 638 L432 638" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="28" y="539" width="396" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="539" width="396" height="7" fill="#24463e"/><text x="226" y="578" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="226" y="578" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="226" y="624" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="226" y="624" textLength="91.26" lengthAdjust="spacingAndGlyphs">הפרדה</tspan></text><text x="226" y="671" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="226" y="671" textLength="340.34" lengthAdjust="spacingAndGlyphs">נזק, רטיבות או משפחה לא מזוהה</tspan><tspan x="226" y="703" textLength="85.58" lengthAdjust="spacingAndGlyphs">לבדיקה.</tspan></text></g><path d="M464 853 L432 853" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="28" y="763" width="396" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="763" width="396" height="7" fill="#006f6b"/><text x="226" y="802" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="226" y="802" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="226" y="848" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="226" y="848" textLength="182.24" lengthAdjust="spacingAndGlyphs">בדיקת החלפה</tspan></text><text x="226" y="895" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="226" y="895" textLength="332.42" lengthAdjust="spacingAndGlyphs">דמיון חיצוני אינו מוכיח תאימות.</tspan></text></g></svg>
