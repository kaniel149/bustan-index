<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="695" viewBox="0 0 1040 695" lang="he" xml:lang="he" role="img" aria-labelledby="title desc"><title id="title">מזומן זמין מול חוב לפירעון</title><desc id="desc">CFADS שנתי של 120,000 או 80,000 באט מול שירות חוב של 100,000 באט.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="426.82" lengthAdjust="spacingAndGlyphs">מזומן זמין מול חוב לפירעון</tspan></text><g class="diagram-bar" data-node="0"><text x="1000" y="154" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="154" textLength="246.82" lengthAdjust="spacingAndGlyphs">מזומן זמין בבסיס</tspan></text><text x="1000" y="193" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="193" textLength="243.07" lengthAdjust="spacingAndGlyphs">120000 באט לשנת תרגול</tspan></text><rect x="40" y="214" width="960" height="28" rx="3" fill="#dedfce"/><rect x="40" y="214" width="960" height="28" rx="3" fill="#24463e"/><text x="1000" y="273" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="273" textLength="254.08" lengthAdjust="spacingAndGlyphs">CFADS שנתי לפי ההגדרה</tspan></text></g><g class="diagram-bar" data-node="1"><text x="1000" y="340" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="340" textLength="238.68" lengthAdjust="spacingAndGlyphs">שירות חוב מתוכנן</tspan></text><text x="1000" y="379" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="379" textLength="243.07" lengthAdjust="spacingAndGlyphs">100000 באט לשנת תרגול</tspan></text><rect x="40" y="400" width="960" height="28" rx="3" fill="#dedfce"/><rect x="200" y="400" width="800" height="28" rx="3" fill="#006f6b"/><text x="1000" y="459" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="459" textLength="265.86" lengthAdjust="spacingAndGlyphs">80,000 קרן + 20,000 ריבית</tspan></text></g><g class="diagram-bar" data-node="2"><text x="1000" y="526" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="526" textLength="254.97" lengthAdjust="spacingAndGlyphs">מזומן זמין בהרעה</tspan></text><text x="1000" y="565" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="565" textLength="231.5" lengthAdjust="spacingAndGlyphs">80000 באט לשנת תרגול</tspan></text><rect x="40" y="586" width="960" height="28" rx="3" fill="#dedfce"/><rect x="360" y="586" width="640" height="28" rx="3" fill="#24463e"/><text x="1000" y="645" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="645" textLength="320.67" lengthAdjust="spacingAndGlyphs">אותה תקופה ואותה הגדרת מזומן</tspan></text></g></svg>
