<svg xmlns="http://www.w3.org/2000/svg" width="480" height="680" viewBox="0 0 480 680" lang="he" xml:lang="he" role="img" aria-labelledby="title desc"><title id="title">הנחה קטנה, השפעה גדולה</title><desc id="desc">עמודות מציגות מחיר מקורי 400,000, מחיר מוזל 360,000 ועלות ישירה קבועה 320,000 באט.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="338.81" lengthAdjust="spacingAndGlyphs">הנחה קטנה, השפעה גדולה</tspan></text><g class="diagram-bar" data-node="0"><text x="452" y="146" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="452" y="146" textLength="136.76" lengthAdjust="spacingAndGlyphs">מחיר מקורי</tspan></text><text x="452" y="184" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="452" y="184" textLength="273.02" lengthAdjust="spacingAndGlyphs">400000 באט · דוגמת תרגול</tspan></text><rect x="28" y="205" width="424" height="28" rx="3" fill="#dedfce"/><rect x="28" y="205" width="424" height="28" rx="3" fill="#24463e"/><text x="452" y="264" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="452" y="264" textLength="122.64" lengthAdjust="spacingAndGlyphs">הצעת תרגול</tspan></text></g><g class="diagram-bar" data-node="1"><text x="452" y="329" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-