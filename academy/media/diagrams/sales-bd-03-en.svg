<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="461" viewBox="0 0 1040 461" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Compare the payment relationships</title><desc id="desc">EPC, PPA and lease differ in what is purchased; compare ownership, service, term and exit duties.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="492.65" lengthAdjust="spacingAndGlyphs">Compare the payment relationships</tspan></text><g class="diagram-card" data-node="0"><rect x="40" y="127" width="216" height="298" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="127" width="216" height="7" fill="#24463e"/><text x="148" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="148" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="212" textLength="57.73" lengthAdjust="spacingAndGlyphs">EPC</tspan><tspan x="148" y="252" textLength="115.49" lengthAdjust="spacingAndGlyphs">purchase</tspan></text><text x="148" y="298" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="298" textLength="91.01" lengthAdjust="spacingAndGlyphs">Customer</tspan><tspan x="148" y="329" textLength="131.94" lengthAdjust="spacingAndGlyphs">purchases the</tspan><tspan x="148" y="360" textLength="148.28" lengthAdjust="spacingAndGlyphs">agreed installed</tspan><tspan x="148" y="391" textLength="56.03" lengthAdjust="spacingAndGlyphs">scope</tspan></text></g><g class="diagram-card" data-node="1"><rect x="288" y="127" width="216" height="298" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="288" y="127" width="216" height="7" fill="#006f6b"/><text x="396" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="396" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="212" textLength="56.19" lengthAdjust="spacingAndGlyphs">PPA</tspan></text><text x="396" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="258" textLength="152.94" lengthAdjust="spacingAndGlyphs">Energy payment</tspan><tspan x="396" y="289" textLength="175.14" lengthAdjust="spacingAndGlyphs">follows the specific</tspan><tspan x="396" y="320" textLength="100.38" lengthAdjust="spacingAndGlyphs">agreement</tspan></text></g><g class="diagram-card" data-node="2"><rect x="536" y="127" width="216" height="298" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="536" y="127" width="216" height="7" fill="#24463e"/><text x="644" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="644" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="212" textLength="76.49" lengthAdjust="spacingAndGlyphs">Lease</tspan></text><text x="644" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="258" textLength="154.12" lengthAdjust="spacingAndGlyphs">Lease payments</tspan><tspan x="644" y="289" textLength="128.44" lengthAdjust="spacingAndGlyphs">follow defined</tspan><tspan x="644" y="320" textLength="108.57" lengthAdjust="spacingAndGlyphs">asset terms</tspan></text></g><g class="diagram-card" data-node="3"><rect x="784" y="127" width="216" height="298" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="784" y="127" width="216" height="7" fill="#006f6b"/><text x="892" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="892" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="212" textLength="113.89" lengthAdjust="spacingAndGlyphs">Common</tspan><tspan x="892" y="252" textLength="145.12" lengthAdjust="spacingAndGlyphs">comparison</tspan></text><text x="892" y="298" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="298" textLength="106.24" lengthAdjust="spacingAndGlyphs">Ownership,</tspan><tspan x="892" y="329" textLength="161.18" lengthAdjust="spacingAndGlyphs">service, term and</tspan><tspan x="892" y="360" textLength="138.94" lengthAdjust="spacingAndGlyphs">exit obligations</tspan></text></g></svg>
