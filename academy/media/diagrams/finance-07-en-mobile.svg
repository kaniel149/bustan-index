<svg xmlns="http://www.w3.org/2000/svg" width="480" height="680" viewBox="0 0 480 680" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Currency exposure in a fixed quote</title><desc id="desc">USD 20,000 costs 700,000 THB at 35 or 720,000 THB at 36; the difference is 20,000 THB.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="419.58" lengthAdjust="spacingAndGlyphs">Currency exposure in a fixed quote</tspan></text><g class="diagram-bar" data-node="0"><text x="28" y="146" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="146" textLength="185.33" lengthAdjust="spacingAndGlyphs">At 35 THB/USD</tspan></text><text x="28" y="184" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="184" textLength="404.16" lengthAdjust="spacingAndGlyphs">700000 THB · hypothetical exchange rates</tspan></text><rect x="28" y="205" width="424" height="28" rx="3" fill="#dedfce"/><rect x="28" y="205" width="412.22" height="28" rx="3" fill="#24463e"/><text x="28" y="264" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="264" textLength="269.79" lengthAdjust="spacingAndGlyphs">USD 20,000 supplier amount</tspan></text></g><g class="diagram-bar" data-node="1"><text x="28" y="329" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="329" textLength="185.33" lengthAdjust="spacingAndGlyphs">At 36 THB/USD</tspan></text><text x="28" y="367" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="367" textLength="404.16" lengthAdjust="spacingAndGlyphs">720000 THB · hypothetical exchange rates</tspan></text><rect x="28" y="388" width="424" height="28" rx="3" fill="#dedfce"/><rect x="28" y="388" width="424" height="28" rx="3" fill="#006f6b"/><text x="28" y="447" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="447" textLength="411.05" lengthAdjust="spacingAndGlyphs">Same supplier amount, different assumption</tspan></text></g><g class="diagram-bar" data-node="2"><text x="28" y="512" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="512" textLength="270.37" lengthAdjust="spacingAndGlyphs">Additional cash needed</tspan></text><text x="28" y="550" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="550" textLength="392.6" lengthAdjust="spacingAndGlyphs">20000 THB · hypothetical exchange rates</tspan></text><rect x="28" y="571" width="424" height="28" rx="3" fill="#dedfce"/><rect x="28" y="571" width="11.78" height="28" rx="3" fill="#24463e"/><text x="28" y="630" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="630" textLength="204.41" lengthAdjust="spacingAndGlyphs">Before fees and taxes</tspan></text></g></svg>
