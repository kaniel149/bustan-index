<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">จากผู้ติดต่อสู่แผนที่ผู้ตัดสินใจ</title><desc id="desc">บทบาทผู้ดำเนินงาน เจ้าของ และผู้จ่ายเงินนำไปสู่ขั้นตอนถัดไปที่ตกลงร่วมกัน.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="376.9" lengthAdjust="spacingAndGlyphs">จากผู้ติดต่อสู่แผนที่ผู้ตัดสินใจ</tspan></text><g class="diagram-card" data-node="0"><rect x="40" y="131" width="216" height="253" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="131" width="216" height="7" fill="#24463e"/><text x="148" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="148" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="219" textLength="146.02" lengthAdjust="spacingAndGlyphs">ผู้ดำเนินงาน</tspan></text><text x="148" y="269" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="269" textLength="161.49" lengthAdjust="spacingAndGlyphs">อธิบายงานประจำ</tspan><tspan x="148" y="303" textLength="149.1" lengthAdjust="spacingAndGlyphs">วันและผลกระทบ</tspan></text></g><path d="M260 257.5 L279 257.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="288" y="131" width="216" height="253" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="288" y="131" width="216" height="7" fill="#006f6b"/><text x="396" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="396" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="219" textLength="92.1" lengthAdjust="spacingAndGlyphs">เจ้าของ</tspan></text><text x="396" y="269" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="269" textLength="147.84" lengthAdjust="spacingAndGlyphs">ยืนยันสิทธิอนุมัติ</tspan><tspan x="396" y="303" textLength="146.16" lengthAdjust="spacingAndGlyphs">การเปลี่ยนแปลง</tspan><tspan x="396" y="337" textLength="62.79" lengthAdjust="spacingAndGlyphs">สถานที่</tspan></text></g><path d="M508 257.5 L527 257.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="536" y="131" width="216" height="253" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="536" y="131" width="216" height="7" fill="#24463e"/><text x="644" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="644" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="219" textLength="110.07" lengthAdjust="spacingAndGlyphs">ผู้จ่ายเงิน</tspan></text><text x="644" y="269" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="269" textLength="152.46" lengthAdjust="spacingAndGlyphs">ยืนยันงบประมาณ</tspan><tspan x="644" y="303" textLength="175.98" lengthAdjust="spacingAndGlyphs">และผู้รับผิดชอบจ่าย</tspan></text></g><path d="M756 257.5 L775 257.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="784" y="131" width="216" height="253" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="784" y="131" width="216" height="7" fill="#006f6b"/><text x="892" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="892" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="219" textLength="169.88" lengthAdjust="spacingAndGlyphs">ขั้นตอนถัดไปที่</tspan><tspan x="892" y="263" textLength="107.83" lengthAdjust="spacingAndGlyphs">ตกลงกัน</tspan></text><text x="892" y="313" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="313" textLength="171.99" lengthAdjust="spacingAndGlyphs">ระบุเรื่องที่จะตัดสิน</tspan><tspan x="892" y="347" textLength="152.25" lengthAdjust="spacingAndGlyphs">ใจและผู้เกี่ยวข้อง</tspan></text></g></svg>
