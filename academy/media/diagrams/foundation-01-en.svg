yphs">Inverter</tspan></text><text x="644" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="258" textLength="159.96" lengthAdjust="spacingAndGlyphs">Converts DC into</tspan><tspan x="644" y="289" textLength="96.92" lengthAdjust="spacingAndGlyphs">usable AC</tspan></text></g><path d="M756 245 L775 245" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="784" y="127" width="216" height="236" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="784" y="127" width="216" height="7" fill="#006f6b"/><text x="892" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="892" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="212" textLength="106.11" lengthAdjust="spacingAndGlyphs">Property</tspan><tspan x="892" y="252" textLength="67.11" lengthAdjust="spacingAndGlyphs">loads</tspan></text><text x="892" y="298" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="298" textLength="165.88" lengthAdjust="spacingAndGlyphs">Use energy at the</tspan><tspan x="892" y="329" textLength="96.89" lengthAdjust="spacingAndGlyphs">same time</tspan></text></g></svg>
