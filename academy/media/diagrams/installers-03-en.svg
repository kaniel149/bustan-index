<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="654" viewBox="0 0 1040 654" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Accept the delivered part?</title><desc id="desc">A receiving decision branches to accepted stock, quarantine or substitution review.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="370.25" lengthAdjust="spacingAndGlyphs">Accept the delivered part?</tspan></text><g class="diagram-card" data-node="0"><rect x="250" y="127" width="540" height="196" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="250" y="127" width="540" height="7" fill="#24463e"/><text x="520" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="520" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="212" textLength="233.26" lengthAdjust="spacingAndGlyphs">Exact part match?</tspan></text><text x="520" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="258" textLength="454.31" lengthAdjust="spacingAndGlyphs">Check approved identity, condition and exposure</tspan><tspan x="520" y="289" textLength="53.7" lengthAdjust="spacingAndGlyphs">limits.</tspan></text></g><path d="M520 326 V357" stroke="#006f6b" stroke-width="3" fill="none"/><path d="M520 357 H189.33 V382" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="40" y="391" width="298.67" height="227" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="391" width="298.67" height="7" fill="#006f6b"/><text x="189.33" y="430" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="189.33" y="430" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="189.33" y="476" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="189.33" y="476" textLength="190.47" lengthAdjust="spacingAndGlyphs">Accepted stock</tspan></text><text x="189.33" y="522" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="189.33" y="522" textLength="242.91" lengthAdjust="spacingAndGlyphs">Traceable and suitable for</tspan><tspan x="189.33" y="553" textLength="168.23" lengthAdjust="spacingAndGlyphs">the approved use.</tspan></text></g><path d="M520 357 H520 V382" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="370.67" y="391" width="298.67" height="227" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="370.67" y="391" width="298.67" height="7" fill="#24463e"/><text x="520" y="430" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="430" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="520" y="476" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="476" textLength="138.91" lengthAdjust="spacingAndGlyphs">Quarantine</tspan></text><text x="520" y="522" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="522" textLength="196.18" lengthAdjust="spacingAndGlyphs">Damage, moisture or</tspan><tspan x="520" y="553" textLength="231.19" lengthAdjust="spacingAndGlyphs">unidentified family needs</tspan><tspan x="520" y="584" textLength="66.55" lengthAdjust="spacingAndGlyphs">review.</tspan></text></g><path d="M520 357 H850.67 V382" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="701.33" y="391" width="298.67" height="227" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="701.33" y="391" width="298.67" height="7" fill="#006f6b"/><text x="850.67" y="430" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="850.67" y="430" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="850.67" y="476" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="850.67" y="476" textLength="235.7" lengthAdjust="spacingAndGlyphs">Substitution review</tspan></text><text x="850.67" y="522" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="850.67" y="522" textLength="249.86" lengthAdjust="spacingAndGlyphs">Similar appearance cannot</tspan><tspan x="850.67" y="553" textLength="210.15" lengthAdjust="spacingAndGlyphs">establish compatibility.</tspan></text></g></svg>
