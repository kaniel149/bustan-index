<svg xmlns="http://www.w3.org/2000/svg" width="480" height="960" viewBox="0 0 480 960" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">ปรับขอบเขตให้เทียบกันก่อนราคา</title><desc id="desc">A ราคา 300,000 บาท ส่วน B 280,000 บวกงานเข้าถึง 25,000 รวม 305,000 เพื่อเทียบ</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="375.59" lengthAdjust="spacingAndGlyphs">ปรับขอบเขตให้เทียบกันก่อนราคา</tspan></text><g class="diagram-card" data-node="0"><rect x="28" y="125" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="125" width="424" height="7" fill="#24463e"/><text x="240" y="164" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="164" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="213" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="213" textLength="124.59" lengthAdjust="spacingAndGlyphs">ข้อเสนอ A</tspan></text><text x="240" y="264" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="264" textLength="337.83" lengthAdjust="spacingAndGlyphs">300,000 บาท รวมงานเข้าถึงที่ตกลง</tspan></text></g><g class="diagram-card" data-node="1"><rect x="28" y="325" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="325" width="424" height="7" fill="#006f6b"/><text x="240" y="364" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="364" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="240" y="413" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="413" textLength="124.59" lengthAdjust="spacingAndGlyphs">ข้อเสนอ B</tspan></text><text x="240" y="464" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="464" textLength="287.89" lengthAdjust="spacingAndGlyphs">280,000 บาท ไม่รวมงานเข้าถึง</tspan></text></g><g class="diagram-card" data-node="2"><rect x="28" y="525" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="525" width="424" height="7" fill="#24463e"/><text x="240" y="564" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="564" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="240" y="613" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="613" textLength="230.73" lengthAdjust="spacingAndGlyphs">B เมื่อปรับเพื่อเทียบ</tspan></text><text x="240" y="664" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="664" textLength="373.78" lengthAdjust="spacingAndGlyphs">บวกค่างานเข้าถึงยืนยันแล้ว 25,000 บาท</tspan></text></g><g class="diagram-card" data-node="3"><rect x="28" y="725" width="424" height="213" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="725" width="424" height="7" fill="#006f6b"/><text x="240" y="764" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="764" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="240" y="813" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="813" textLength="163.99" lengthAdjust="spacingAndGlyphs">เทียบหลักฐาน</tspan></text><text x="240" y="864" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="864" textLength="353.32" lengthAdjust="spacingAndGlyphs">ตรวจรุ่น การรับประกัน และข้อยกเว้น</tspan><tspan x="240" y="900" textLength="42.24" lengthAdjust="spacingAndGlyphs">ด้วย</tspan></text></g></svg>
