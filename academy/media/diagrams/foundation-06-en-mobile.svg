<svg xmlns="http://www.w3.org/2000/svg" width="480" height="961" viewBox="0 0 480 961" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Is the work ready?</title><desc id="desc">Decision branches: unknown hazard means stop; missing control means resolve; reviewed plan needs qualified authorization.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="227.68" lengthAdjust="spacingAndGlyphs">Is the work ready?</tspan></text><g class="diagram-card" data-node="0"><rect x="30" y="121" width="420" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="30" y="121" width="420" height="7" fill="#24463e"/><text x="240" y="160" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="160" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="206" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="206" textLength="234.19" lengthAdjust="spacingAndGlyphs">Check before work</tspan></text><text x="240" y="253" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="253" textLength="304.63" lengthAdjust="spacingAndGlyphs">Hazards, authority and controls</tspan></text></g><path d="M27 211 H16 V835" stroke="#006f6b" stroke-width="3" fill="none"/><path d="M16 423 L48 423" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="56" y="333" width="396" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="56" y="333" width="396" height="7" fill="#006f6b"/><text x="254" y="372" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="372" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="254" y="418" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="418" textLength="210.74" lengthAdjust="spacingAndGlyphs">Unknown hazard</tspan></text><text x="254" y="465" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="465" textLength="176.2" lengthAdjust="spacingAndGlyphs">Stop and escalate</tspan></text></g><path d="M16 629 L48 629" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="56" y="539" width="396" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="56" y="539" width="396" height="7" fill="#24463e"/><text x="254" y="578" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="578" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="254" y="624" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="624" textLength="187.29" lengthAdjust="spacingAndGlyphs">Missing control</tspan></text><text x="254" y="671" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="671" textLength="226.29" lengthAdjust="spacingAndGlyphs">Resolve before release</tspan></text></g><path d="M16 835 L48 835" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="56" y="745" width="396" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="56" y="745" width="396" height="7" fill="#006f6b"/><text x="254" y="784" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="784" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="254" y="830" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="830" textLength="184.2" lengthAdjust="spacingAndGlyphs">Reviewed plan</tspan></text><text x="254" y="877" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="877" textLength="332.73" lengthAdjust="spacingAndGlyphs">Qualified person authorizes scope</tspan></text></g></svg>
