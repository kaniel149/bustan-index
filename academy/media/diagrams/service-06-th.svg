<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="599" viewBox="0 0 1040 599" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">เปลี่ยนข้อสังเกตเป็นบำรุงรักษา</title><desc id="desc">วงซ้ำเชื่อมฐานเทียบ เทียบสภาพ แก้อนุญาต และทบทวนรอบ.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="419.95" lengthAdjust="spacingAndGlyphs">เปลี่ยนข้อสังเกตเป็นบำรุงรักษา</tspan></text><path d="M474 221 L561 221" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M780 315 L780 374" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M566 473 L479 473" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M260 379 L260 320" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="0"><rect x="50" y="131" width="420" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="50" y="131" width="420" height="7" fill="#24463e"/><text x="260" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="260" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="260" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="260" y="219" textLength="213.41" lengthAdjust="spacingAndGlyphs">ฐานเทียบตำแหน่ง</tspan></text><text x="260" y="269" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="260" y="269" textLength="289.8" lengthAdjust="spacingAndGlyphs">เก็บบันทึกทรัพย์สินกับสภาพมีวัน.</tspan></text></g><g class="diagram-card" data-node="1"><rect x="570" y="131" width="420" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="570" y="131" width="420" height="7" fill="#006f6b"/><text x="780" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="780" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="780" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="780" y="219" textLength="128.04" lengthAdjust="spacingAndGlyphs">เทียบสภาพ</tspan></text><text x="780" y="269" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="780" y="269" textLength="322.35" lengthAdjust="spacingAndGlyphs">ดูการเปลี่ยน กลับเป็น และผลกระทบ.</tspan></text></g><g class="diagram-card" data-node="2"><rect x="570" y="383" width="420" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="570" y="383" width="420" height="7" fill="#24463e"/><text x="780" y="422" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="780" y="422" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="780" y="471" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="780" y="471" textLength="133.38" lengthAdjust="spacingAndGlyphs">แก้ที่อนุญาต</tspan></text><text x="780" y="521" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="780" y="521" textLength="270.27" lengthAdjust="spacingAndGlyphs">วางทางปลอดภัยและวิธีที่ใช้ได้.</tspan></text></g><g class="diagram-card" data-node="3"><rect x="50" y="383" width="420" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="50" y="383" width="420" height="7" fill="#006f6b"/><text x="260" y="422" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="260" y="422" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="260" y="471" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="260" y="471" textLength="215.65" lengthAdjust="spacingAndGlyphs">ทบทวนรอบตรวจ</tspan></text><text x="260" y="521" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="260" y="521" textLength="274.89" lengthAdjust="spacingAndGlyphs">ปรับจุดกระทบตามหลักฐานพบ.</tspan></text></g></svg>
