<svg xmlns="http://www.w3.org/2000/svg" width="480" height="959" viewBox="0 0 480 959" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Normalize scope before price</title><desc id="desc">A costs 300,000 THB; B’s 280,000 plus 25,000 access becomes 305,000 for comparison.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="351.79" lengthAdjust="spacingAndGlyphs">Normalize scope before price</tspan></text><g class="diagram-card" data-node="0"><rect x="28" y="121" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="121" width="424" height="7" fill="#24463e"/><text x="240" y="160" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="160" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="206" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="206" textLength="103.08" lengthAdjust="spacingAndGlyphs">Quote A</tspan></text><text x="240" y="253" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="253" textLength="373.23" lengthAdjust="spacingAndGlyphs">300,000 THB; agreed access included</tspan></text></g><g class="diagram-card" data-node="1"><rect x="28" y="321" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="321" width="424" height="7" fill="#006f6b"/><text x="240" y="360" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="360" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="240" y="406" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="406" textLength="103.08" lengthAdjust="spacingAndGlyphs">Quote B</tspan></text><text x="240" y="453" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="453" textLength="304.7" lengthAdjust="spacingAndGlyphs">280,000 THB; access excluded</tspan></text></g><g class="diagram-card" data-node="2"><rect x="28" y="521" width="424" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="521" width="424" height="7" fill="#24463e"/><text x="240" y="560" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="560" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="240" y="606" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="606" textLength="285.71" lengthAdjust="spacingAndGlyphs">B adjusted comparison</tspan></text><text x="240" y="653" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="653" textLength="340.14" lengthAdjust="spacingAndGlyphs">Add confirmed 25,000 THB access</tspan><tspan x="240" y="685" textLength="40.35" lengthAdjust="spacingAndGlyphs">cost</tspan></text></g><g class="diagram-card" data-node="3"><rect x="28" y="739" width="424" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="739" width="424" height="7" fill="#006f6b"/><text x="240" y="778" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="778" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="240" y="824" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="824" textLength="235.7" lengthAdjust="spacingAndGlyphs">Compare evidence</tspan></text><text x="240" y="871" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="871" textLength="278.94" lengthAdjust="spacingAndGlyphs">Check models, warranty and</tspan><tspan x="240" y="903" textLength="139.44" lengthAdjust="spacingAndGlyphs">exclusions too</tspan></text></g></svg>
