<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="464" viewBox="0 0 1040 464" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">จากผลต่างบิลสู่เงินสด</title><desc id="desc">ผลต่างบิล 4,000 บาทหักค่าบำรุง 500 เหลือประโยชน์ดำเนินงาน 3,500 บาท</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="295.46" lengthAdjust="spacingAndGlyphs">จากผลต่างบิลสู่เงินสด</tspan></text><g class="diagram-card" data-node="0"><rect x="40" y="131" width="216" height="297" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="131" width="216" height="7" fill="#24463e"/><text x="148" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="148" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="219" textLength="89.86" lengthAdjust="spacingAndGlyphs">บิลก่อน</tspan></text><text x="148" y="269" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="269" textLength="132.93" lengthAdjust="spacingAndGlyphs">12,000 บาทต่อ</tspan><tspan x="148" y="303" textLength="46.41" lengthAdjust="spacingAndGlyphs">เดือน</tspan></text></g><path d="M260 279.5 L279 279.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="288" y="131" width="216" height="297" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="288" y="131" width="216" height="7" fill="#006f6b"/><text x="396" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="396" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="219" textLength="89.86" lengthAdjust="spacingAndGlyphs">บิลหลัง</tspan></text><text x="396" y="269" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="269" textLength="167.66" lengthAdjust="spacingAndGlyphs">8,000 บาทต่อเดือน</tspan></text></g><path d="M508 279.5 L527 279.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="536" y="131" width="216" height="297" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="536" y="131" width="216" height="7" fill="#24463e"/><text x="644" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="644" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="219" textLength="146.02" lengthAdjust="spacingAndGlyphs">ค่าบำรุงเพิ่ม</tspan></text><text x="644" y="269" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="269" textLength="150.11" lengthAdjust="spacingAndGlyphs">500 บาทต่อเดือน</tspan></text></g><path d="M756 279.5 L775 279.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="784" y="131" width="216" height="297" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="784" y="131" width="216" height="7" fill="#006f6b"/><text x="892" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="892" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="219" textLength="110.07" lengthAdjust="spacingAndGlyphs">ประโยชน์</tspan><tspan x="892" y="263" textLength="160.06" lengthAdjust="spacingAndGlyphs">เงินสดดำเนิน</tspan><tspan x="892" y="307" textLength="48.02" lengthAdjust="spacingAndGlyphs">งาน</tspan></text><text x="892" y="357" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="357" textLength="148.93" lengthAdjust="spacingAndGlyphs">4,000 ลบ 500 =</tspan><tspan x="892" y="391" textLength="94.37" lengthAdjust="spacingAndGlyphs">3,500 บาท</tspan></text></g></svg>
