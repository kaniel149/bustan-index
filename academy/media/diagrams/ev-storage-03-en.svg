<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="707" viewBox="0 0 1040 707" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Make priorities observable</title><desc id="desc">A repeating control cycle observes demand, applies priorities, allocates EV charging and verifies response.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="364.23" lengthAdjust="spacingAndGlyphs">Make priorities observable</tspan></text><path d="M474 245 L561 245" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M780 367 L780 426" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M566 553 L479 553" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M260 431 L260 372" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="0"><rect x="50" y="127" width="420" height="236" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="50" y="127" width="420" height="7" fill="#24463e"/><text x="260" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="260" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="260" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="260" y="212" textLength="301.35" lengthAdjust="spacingAndGlyphs">Observe generation and</tspan><tspan x="260" y="252" textLength="101.45" lengthAdjust="spacingAndGlyphs">demand</tspan></text><text x="260" y="298" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="260" y="298" textLength="311.79" lengthAdjust="spacingAndGlyphs">Use current measurements at the</tspan><tspan x="260" y="329" textLength="163.49" lengthAdjust="spacingAndGlyphs">correct boundary.</tspan></text></g><g class="diagram-card" data-node="1"><rect x="570" y="127" width="420" height="236" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="570" y="127" width="420" height="7" fill="#006f6b"/><text x="780" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="780" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="780" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="780" y="212" textLength="279.45" lengthAdjust="spacingAndGlyphs">Apply agreed priorities</tspan></text><text x="780" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="780" y="258" textLength="356.18" lengthAdjust="spacingAndGlyphs">Respect essential loads and approved</tspan><tspan x="780" y="289" textLength="145.97" lengthAdjust="spacingAndGlyphs">battery reserve.</tspan></text></g><g class="diagram-card" data-node="2"><rect x="570" y="435" width="420" height="236" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="570" y="435" width="420" height="7" fill="#24463e"/><text x="780" y="474" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="780" y="474" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="780" y="520" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="780" y="520" textLength="260.75" lengthAdjust="spacingAndGlyphs">Allocate EV charging</tspan></text><text x="780" y="566" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="780" y="566" textLength="304.79" lengthAdjust="spacingAndGlyphs">Remain within approved site and</tspan><tspan x="780" y="597" textLength="129.61" lengthAdjust="spacingAndGlyphs">product limits.</tspan></text></g><g class="diagram-card" data-node="3"><rect x="50" y="435" width="420" height="236" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="50" y="435" width="420" height="7" fill="#006f6b"/><text x="260" y="474" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="260" y="474" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="260" y="520" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="260" y="520" textLength="277.91" lengthAdjust="spacingAndGlyphs">Verify actual response</tspan></text><text x="260" y="566" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="260" y="566" textLength="337.41" lengthAdjust="spacingAndGlyphs">Compare commanded behavior with</tspan><tspan x="260" y="597" textLength="185.68" lengthAdjust="spacingAndGlyphs">observed operation.</tspan></text></g></svg>
