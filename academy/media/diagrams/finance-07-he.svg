<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="695" viewBox="0 0 1040 695" lang="he" xml:lang="he" role="img" aria-labelledby="title desc"><title id="title">חשיפת מטבע בהצעה קבועה</title><desc id="desc">20,000 דולר עולים 700,000 באט בשער 35 או 720,000 בשער 36; ההפרש 20,000 באט.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="393.43" lengthAdjust="spacingAndGlyphs">חשיפת מטבע בהצעה קבועה</tspan></text><g class="diagram-bar" data-node="0"><text x="1000" y="154" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="154" textLength="221.33" lengthAdjust="spacingAndGlyphs">ב־35 באט לדולר</tspan></text><text x="1000" y="193" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="193" textLength="370.36" lengthAdjust="spacingAndGlyphs">700000 באט · שערי חליפין היפותטיים</tspan></text><rect x="40" y="214" width="960" height="28" rx="3" fill="#dedfce"/><rect x="66.67" y="214" width="933.33" height="28" rx="3" fill="#24463e"/><text x="1000" y="273" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="273" textLength="225.75" lengthAdjust="spacingAndGlyphs">סכום ספק: 20,000 דולר</tspan></text></g><g class="diagram-bar" data-node="1"><text x="1000" y="340" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="340" textLength="221.33" lengthAdjust="spacingAndGlyphs">ב־36 באט לדולר</tspan></text><text x="1000" y="379" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="379" textLength="370.36" lengthAdjust="spacingAndGlyphs">720000 באט · שערי חליפין היפותטיים</tspan></text><rect x="40" y="400" width="960" height="28" rx="3" fill="#dedfce"/><rect x="40" y="400" width="960" height="28" rx="3" fill="#006f6b"/><text x="1000" y="459" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="459" textLength="330.96" lengthAdjust="spacingAndGlyphs">אותו סכום ספק, הנחת מטבע אחרת</tspan></text></g><g class="diagram-bar" data-node="2"><text x="1000" y="526" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="526" textLength="273.22" lengthAdjust="spacingAndGlyphs">תוספת מזומן נדרשת</tspan></text><text x="1000" y="565" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="565" textLength="358.8" lengthAdjust="spacingAndGlyphs">20000 באט · שערי חליפין היפותטיים</tspan></text><rect x="40" y="586" width="960" height="28" rx="3" fill="#dedfce"/><rect x="973.33" y="586" width="26.67" height="28" rx="3" fill="#24463e"/><text x="1000" y="645" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="rtl" unicode-bidi="plaintext"><tspan x="1000" y="645" textLength="178.5" lengthAdjust="spacingAndGlyphs">לפני עמלות ומסים</tspan></text></g></svg>
