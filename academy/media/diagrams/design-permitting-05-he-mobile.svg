<svg xmlns="http://www.w3.org/2000/svg" width="480" height="759" viewBox="0 0 480 759" lang="he" xml:lang="he" role="img" aria-labelledby="title desc"><title id="title">אנרגיה, הספק ומצב עבודה</title><desc id="desc">שלושה גבולות תכנון נפרדים מציגים אנרגיה שימושית, הספק בו־זמני ומצב רשת או גיבוי.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="340.7" lengthAdjust="spacingAndGlyphs">אנרגיה, הספק ומצב עבודה</tspan></text><g class="diagram-card" data-node="0"><rect x="28" y="121" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="121" width="424" height="7" fill="#24463e"/><text x="240" y="160" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="160" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="206" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="240" y="206" textLength="192.35" lengthAdjust="spacingAndGlyphs">תקציב אנרגיה</tspan></text><text x="240" y="253" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="240" y="253" textLength="351.78" lengthAdjust="spacingAndGlyphs">אנרגיה שימושית קובעת משך מחושב</tspan></text></g><g class="diagram-card" data-node="1"><rect x="28" y="321" width="424" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="321" width="424" height="7" fill="#006f6b"/><text x="240" y="360" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="360" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="240" y="406" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="240" y="406" textLength="153.88" lengthAdjust="spacingAndGlyphs">תקרת הספק</tspan></text><text x="240" y="453" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="240" y="453" textLength="347.16" lengthAdjust="spacingAndGlyphs">עומסים בו־זמניים חייבים להתאים</tspan><tspan x="240" y="485" textLength="145.86" lengthAdjust="spacingAndGlyphs">ליכולות הציוד</tspan></text></g><g class="diagram-card" data-node="2"><rect x="28" y="539" width="424" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="539" width="424" height="7" fill="#24463e"/><text x="240" y="578" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="578" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="240" y="624" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="240" y="624" textLength="218.46" lengthAdjust="spacingAndGlyphs">גבול מצב עבודה</tspan></text><text x="240" y="671" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="240" y="671" textLength="334.18" lengthAdjust