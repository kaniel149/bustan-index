<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="657" viewBox="0 0 1040 657" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">ทบทวนกรณีออกแบบครบวงจร</title><desc id="desc">วงจรทบทวนเชื่อมหลักฐานอาคาร การทดสอบสมมติฐาน การอนุมัติแยกเรื่อง และความพร้อมส่งมอบ</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="414.34" lengthAdjust="spacingAndGlyphs">ทบทวนกรณีออกแบบครบวงจร</tspan></text><path d="M474 235.5 L561 235.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M780 344 L780 403" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M566 516.5 L479 516.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M260 408 L260 349" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="0"><rect x="50" y="131" width="420" height="209" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="50" y="131" width="420" height="7" fill="#24463e"/><text x="260" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="260" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="260" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="260" y="219" textLength="229.98" lengthAdjust="spacingAndGlyphs">กำหนดโจทย์อาคาร</tspan></text><text x="260" y="269" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="260" y="269" textLength="298.62" lengthAdjust="spacingAndGlyphs">ยืนยันขอบเขตและคุณภาพหลักฐาน</tspan></text></g><g class="diagram-card" data-node="1"><rect x="570" y="131" width="420" height="209" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="570" y="131" width="420" height="7" fill="#006f6b"/><text x="780" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="780" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="780" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="780" y="219" textLength="197.96" lengthAdjust="spacingAndGlyphs">ท้าทายสมมติฐาน</tspan></text><text x="780" y="269" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="780" y="269" textLength="329.28" lengthAdjust="spacingAndGlyphs">ตรวจกรณีออกแบบ ผลผลิต และโหมด</tspan><tspan x="780" y="303" textLength="62.79" lengthAdjust="spacingAndGlyphs">ทำงาน</tspan></text></g><g class="diagram-card" data-node="2"><rect x="570" y="412" width="420" height="209" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="570" y="412" width="420" height="7" fill="#24463e"/><text x="780" y="451" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="780" y="451" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="780" y="500" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="780" y="500" textLength="203.86" lengthAdjust="spacingAndGlyphs">ติดตามการอนุมัติ</tspan></text><text x="780" y="550" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="780" y="550" textLength="351.75" lengthAdjust="spacingAndGlyphs">แยกคำตัดสินและเงื่อนไขแต่ละหน่วยงาน</tspan></text></g><g class="diagram-card" data-node="3"><rect x="50" y="412" width="420" height="209" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="50" y="412" width="420" height="7" fill="#006f6b"/><text x="260" y="451" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="260" y="451" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="260" y="500" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="260" y="500" textLength="317.58" lengthAdjust="spacingAndGlyphs">ทบทวนความพร้อมส่งมอบ</tspan></text><text x="260" y="550" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="260" y="550" textLength="346.71" lengthAdjust="spacingAndGlyphs">ส่งหลักฐานที่ยังขาดกลับให้ผู้รับผิดชอบ</tspan></text></g></svg>
