<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="430" viewBox="0 0 1040 430" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Build the completion forecast</title><desc id="desc">A cost forecast adds 120,000 THB incurred, 70,000 THB remaining committed costs and 30,000 THB uncommitted work to reach 220,000 THB.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="400.76" lengthAdjust="spacingAndGlyphs">Build the completion forecast</tspan></text><g class="diagram-card" data-node="0"><rect x="40" y="127" width="216" height="267" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="127" width="216" height="7" fill="#24463e"/><text x="148" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="148" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="212" textLength="137.4" lengthAdjust="spacingAndGlyphs">Actual cost</tspan></text><text x="148" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="258" textLength="123.82" lengthAdjust="spacingAndGlyphs">120,000 THB</tspan><tspan x="148" y="289" textLength="170.48" lengthAdjust="spacingAndGlyphs">incurred within the</tspan><tspan x="148" y="320" textLength="113.25" lengthAdjust="spacingAndGlyphs">training cost</tspan><tspan x="148" y="351" textLength="87.55" lengthAdjust="spacingAndGlyphs">boundary</tspan></text></g><path d="M260 260.5 L279 260.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="288" y="127" width="216" height="267" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="288" y="127" width="216" height="7" fill="#006f6b"/><text x="396" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="396" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="212" textLength="134.19" lengthAdjust="spacingAndGlyphs">Remaining</tspan><tspan x="396" y="252" textLength="166.94" lengthAdjust="spacingAndGlyphs">commitments</tspan></text><text x="396" y="298" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="298" textLength="112.14" lengthAdjust="spacingAndGlyphs">70,000 THB</tspan><tspan x="396" y="329" textLength="141.25" lengthAdjust="spacingAndGlyphs">committed cost</tspan><tspan x="396" y="360" textLength="164.68" lengthAdjust="spacingAndGlyphs">still to be incurred</tspan></text></g><path d="M508 260.5 L527 260.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="536" y="127" width="216" height="267" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="536" y="127" width="216" height="7" fill="#24463e"/><text x="644" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="644" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="212" textLength="165.39" lengthAdjust="spacingAndGlyphs">Uncommitted</tspan><tspan x="644" y="252" textLength="59.28" lengthAdjust="spacingAndGlyphs">work</tspan></text><text x="644" y="298" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="298" textLength="148.34" lengthAdjust="spacingAndGlyphs">30,000 THB still</tspan><tspan x="644" y="329" textLength="93.45" lengthAdjust="spacingAndGlyphs">needed to</tspan><tspan x="644" y="360" textLength="85.2" lengthAdjust="spacingAndGlyphs">complete</tspan></text></g><path d="M756 260.5 L775 260.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="784" y="127" width="216" height="267" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="784" y="127" width="216" height="7" fill="#006f6b"/><text x="892" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="892" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="212" textLength="170.16" lengthAdjust="spacingAndGlyphs">Forecast total</tspan></text><text x="892" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="258" textLength="129.7" lengthAdjust="spacingAndGlyphs">220,000 THB;</tspan><tspan x="892" y="289" textLength="124.91" lengthAdjust="spacingAndGlyphs">compare with</tspan><tspan x="892" y="320" textLength="150.63" lengthAdjust="spacingAndGlyphs">defined revenue</tspan><tspan x="892" y="351" textLength="138.94" lengthAdjust="spacingAndGlyphs">and exclusions</tspan></text></g></svg>
