<svg xmlns="http://www.w3.org/2000/svg" width="480" height="680" viewBox="0 0 480 680" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">A small discount, large effect</title><desc id="desc">Bars show original price 400,000, discounted price 360,000 and unchanged direct cost 320,000 THB.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="345.92" lengthAdjust="spacingAndGlyphs">A small discount, large effect</tspan></text><g class="diagram-bar" data-node="0"><text x="28" y="146" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="146" textLength="153.19" lengthAdjust="spacingAndGlyphs">Original price</tspan></text><text x="28" y="184" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="184" textLength="297.73" lengthAdjust="spacingAndGlyphs">400000 THB · training example</tspan></text><rect x="28" y="205" width="424" height="28" rx="3" fill="#dedfce"/><rect x="28" y="205" width="424" height="28" rx="3" fill="#24463e"/><text x="28" y="264" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="264" textLength="134.27" lengthAdjust="spacingAndGlyphs">Training quote</tspan></text></g><g class="diagram-bar" data-node="1"><text x="28" y="329" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="329" textLength="193.67" lengthAdjust="spacingAndGlyphs">Discounted price</tspan></text><text x="28" y="367" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="367" textLength="297.73" lengthAdjust="spacingAndGlyphs">360000 THB · training example</tspan></text><rect x="28" y="388" width="424" height="28" rx="3" fill="#dedfce"/><rect x="28" y="388" width="381.6" height="28" rx="3" fill="#006f6b"/><text x="28" y="447" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="447" textLength="304.96" lengthAdjust="spacingAndGlyphs">10% discount; unchanged scope</tspan></text></g><g class="diagram-bar" data-node="2"><text x="28" y="512" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="512" textLength="122.85" lengthAdjust="spacingAndGlyphs">Direct cost</tspan></text><text x="28" y="550" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="550" textLength="297.73" lengthAdjust="spacingAndGlyphs">320000 THB · training example</tspan></text><rect x="28" y="571" width="424" height="28" rx="3" fill="#dedfce"/><rect x="28" y="571" width="339.2" height="28" rx="3" fill="#24463e"/><text x="28" y="630" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="630" textLength="282.62" lengthAdjust="spacingAndGlyphs">Held constant for this example</tspan></text></g></svg>
