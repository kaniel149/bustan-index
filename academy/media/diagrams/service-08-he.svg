<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="439" viewBox="0 0 1040 439" lang="he" xml:lang="he" role="img" aria-labelledby="title desc"><title id="title">לשלוט בשינוי</title><desc id="desc">מצב בסיס, מטרה מאושרת, אימות מושפע ותיעוד תוצאה יוצרים רצף שינוי מבוקר.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="195.62" lengthAdjust="spacingAndGlyphs">לשלוט בשינוי</tspan></text><g class="diagram-card" data-node="0"><rect x="784" y="127" width="216" height="276" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="784" y="127" width="216" height="7" fill="#24463e"/><text x="892" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="892" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="892" y="212" textLength="145.74" lengthAdjust="spacingAndGlyphs">שמירת מצב</tspan><tspan x="892" y="252" textLength="64.86" lengthAdjust="spacingAndGlyphs">בסיס</tspan></text><text x="892" y="298" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="892" y="298" textLength="163.38" lengthAdjust="spacingAndGlyphs">מתעדים גרסאות,</tspan><tspan x="892" y="329" textLength="137.76" lengthAdjust="spacingAndGlyphs">הגדרות ובעיה</tspan><tspan x="892" y="360" textLength="68.04" lengthAdjust="spacingAndGlyphs">נצפית.</tspan></text></g><path d="M780 265 L761 265" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="536" y="127" width="216" height="276" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="536" y="127" width="216" height="7" fill="#006f6b"/><text x="644" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="644" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="644" y="212" textLength="155.84" lengthAdjust="spacingAndGlyphs">אישור מטרה</tspan></text><text x="644" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="644" y="258" textLength="151.2" lengthAdjust="spacingAndGlyphs">מגדירים תיקון,</tspan><tspan x="644" y="289" textLength="145.32" lengthAdjust="spacingAndGlyphs">אחראי ותוכנית</tspan><tspan x="644" y="320" textLength="102.9" lengthAdjust="spacingAndGlyphs">התאוששות.</tspan></text></g><path d="M532 265 L513 265" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="288" y="127" width="216" height="276" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="288" y="127" width="216" height="7" fill="#24463e"/><text x="396" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></