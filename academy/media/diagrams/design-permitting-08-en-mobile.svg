<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1067" viewBox="0 0 480 1067" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">From installed asset to handover</title><desc id="desc">Four handover steps connect actual equipment, asset-specific tests, open-item closure and owner knowledge.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="392.46" lengthAdjust="spacingAndGlyphs">From installed asset to handover</tspan></text><g class="diagram-card" data-node="0"><rect x="28" y="121" width="424" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="121" width="424" height="7" fill="#24463e"/><text x="240" y="160" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="160" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="206" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="206" textLength="293.52" lengthAdjust="spacingAndGlyphs">Verify actual equipment</tspan></text><text x="240" y="253" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="253" textLength="320.56" lengthAdjust="spacingAndGlyphs">Match model, serial and installed</tspan><tspan x="240" y="285" textLength="75.81" lengthAdjust="spacingAndGlyphs">location</tspan></text></g><path d="M240 323 L240 348" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="28" y="357" width="424" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="357" width="424" height="7" fill="#006f6b"/><text x="240" y="396" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="396" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="240" y="442" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="442" textLength="252.97" lengthAdjust="spacingAndGlyphs">Attach test evidence</tspan></text><text x="240" y="489" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="489" textLength="339" lengthAdjust="spacingAndGlyphs">Link results to the actual asset and</tspan><tspan x="240" y="521" textLength="75.79" lengthAdjust="spacingAndGlyphs">revision</tspan></text></g><path d="M240 559 L240 584" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="28" y="593" width="424" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="593" width="424" height="7" fill="#24463e"/><text x="240" y="632" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="632" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="240" y="678" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="678" textLength="227.95" lengthAdjust="spacingAndGlyphs">Resolve punch list</tspan></text><text x="240" y="725" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="725" textLength="341.31" lengthAdjust="spacingAndGlyphs">Separate critical holds from agreed</tspan><tspan x="240" y="757" textLength="149.18" lengthAdjust="spacingAndGlyphs">remaining work</tspan></text></g><path d="M240 795 L240 820" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="28" y="829" width="424" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="829" width="424" height="7" fill="#006f6b"/><text x="240" y="868" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="868" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="240" y="914" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="914" textLength="246.63" lengthAdjust="spacingAndGlyphs">Transfer knowledge</tspan></text><text x="240" y="961" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="961" textLength="312.2" lengthAdjust="spacingAndGlyphs">Give owner as-built records and</tspan><tspan x="240" y="993" textLength="157.76" lengthAdjust="spacingAndGlyphs">service contacts</tspan></text></g></svg>
