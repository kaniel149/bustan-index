<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="532" viewBox="0 0 1040 532" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">เส้นทางยาวที่สุดกำหนดเวลา</title><desc id="desc">แผนฝึกแสดงสำรวจและออกแบบห้าวัน ความพร้อมขออนุมัติแปดวันขนานกับจัดซื้อและขนส่ง ติดตั้งสามวัน และทดสอบหนึ่งวัน</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="377.83" lengthAdjust="spacingAndGlyphs">เส้นทางยาวที่สุดกำหนดเวลา</tspan></text><g class="diagram-card" data-node="0"><rect x="40" y="131" width="216" height="365" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="131" width="216" height="7" fill="#24463e"/><text x="148" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="148" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="219" textLength="133.38" lengthAdjust="spacingAndGlyphs">สำรวจและ</tspan><tspan x="148" y="263" textLength="157.14" lengthAdjust="spacingAndGlyphs">ออกแบบ · 5</tspan><tspan x="148" y="307" textLength="35.94" lengthAdjust="spacingAndGlyphs">วัน</tspan></text><text x="148" y="357" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="357" textLength="99.75" lengthAdjust="spacingAndGlyphs">สำรวจและ</tspan><tspan x="148" y="391" textLength="144.48" lengthAdjust="spacingAndGlyphs">ออกแบบก่อนทั้ง</tspan><tspan x="148" y="425" textLength="125.58" lengthAdjust="spacingAndGlyphs">สองสายความ</tspan><tspan x="148" y="459" textLength="53.76" lengthAdjust="spacingAndGlyphs">พร้อม</tspan></text></g><path d="M260 313.5 L279 313.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="288" y="131" width="216" height="365" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="288" y="131" width="216" height="7" fill="#006f6b"/><text x="396" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="396" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="219" textLength="167.81" lengthAdjust="spacingAndGlyphs">งานขนาน · 8</tspan><tspan x="396" y="263" textLength="35.94" lengthAdjust="spacingAndGlyphs">วัน</tspan></text><text x="396" y="313" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="313" textLength="151.96" lengthAdjust="spacingAndGlyphs">พร้อมขออนุมัติ 8</tspan><tspan x="396" y="347" textLength="163.51" lengthAdjust="spacingAndGlyphs">จัดซื้อ 6 และขนส่ง</tspan><tspan x="396" y="381" textLength="84.76" lengthAdjust="spacingAndGlyphs">2 รอทั้งคู่</tspan></text></g><path d="M508 313.5 L527 313.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="536" y="131" width="216" height="365" rx="5" fill="#fff4e2" stroke="#b9