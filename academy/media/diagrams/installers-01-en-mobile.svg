<svg xmlns="http://www.w3.org/2000/svg" width="480" height="831" viewBox="0 0 480 831" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">From drawing to work</title><desc id="desc">Approved revision leads to site comparison, then a named hold or release decision.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="260.1" lengthAdjust="spacingAndGlyphs">From drawing to work</tspan></text><g class="diagram-card" data-node="0"><rect x="28" y="121" width="424" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="121" width="424" height="7" fill="#24463e"/><text x="240" y="160" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="160" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="206" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="206" textLength="187.32" lengthAdjust="spacingAndGlyphs">Issued revision</tspan></text><text x="240" y="253" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="253" textLength="330.31" lengthAdjust="spacingAndGlyphs">Identify the approved construction</tspan><tspan x="240" y="285" textLength="89.32" lengthAdjust="spacingAndGlyphs">package.</tspan></text></g><path d="M240 323 L240 348" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="28" y="357" width="424" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="357" width="424" height="7" fill="#006f6b"/><text x="240" y="396" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="396" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="240" y="442" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="442" textLength="201.36" lengthAdjust="spacingAndGlyphs">Site comparison</tspan></text><text x="240" y="489" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="489" textLength="286.31" lengthAdjust="spacingAndGlyphs">Match actual roof and access</tspan><tspan x="240" y="521" textLength="105.2" lengthAdjust="spacingAndGlyphs">conditions.</tspan></text></g><path d="M240 559 L240 584" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="28" y="593" width="424" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="593" width="424" height="7" fill="#24463e"/><text x="240" y="632" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="632" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="240" y="678" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="678" textLength="190.49" lengthAdjust="spacingAndGlyphs">Hold or release</tspan></text><text x="240" y="725" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="725" textLength="289.87" lengthAdjust="spacingAndGlyphs">Named reviewer resolves any</tspan><tspan x="240" y="757" textLength="123.53" lengthAdjust="spacingAndGlyphs">discrepancy.</tspan></text></g></svg>
