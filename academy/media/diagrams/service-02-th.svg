xt"><tspan x="644" y="219" textLength="173.82" lengthAdjust="spacingAndGlyphs">ผลวัดตามรอย</tspan><tspan x="644" y="263" textLength="26.11" lengthAdjust="spacingAndGlyphs">ได้</tspan></text><text x="644" y="313" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="313" textLength="162.75" lengthAdjust="spacingAndGlyphs">บันทึกหน่วย สภาพ</tspan><tspan x="644" y="347" textLength="119.07" lengthAdjust="spacingAndGlyphs">และผู้ทดสอบ.</tspan></text></g><path d="M756 257.5 L775 257.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="784" y="131" width="216" height="253" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="784" y="131" width="216" height="7" fill="#006f6b"/><text x="892" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="892" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="219" textLength="131.98" lengthAdjust="spacingAndGlyphs">ผลพิจารณา</tspan><tspan x="892" y="263" textLength="49.42" lengthAdjust="spacingAndGlyphs">แล้ว</tspan></text><text x="892" y="313" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="313" textLength="141.75" lengthAdjust="spacingAndGlyphs">รับ พัก หรือวาง</tspan><tspan x="892" y="347" textLength="162.75" lengthAdjust="spacingAndGlyphs">ทดสอบซ้ำอนุญาต.</tspan></text></g></svg>
