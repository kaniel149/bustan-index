<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="607" viewBox="0 0 1040 607" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Can this work proceed?</title><desc id="desc">A decision asks whether critical controls are verified, with alternatives to release, hold or reassess changed conditions.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="335.52" lengthAdjust="spacingAndGlyphs">Can this work proceed?</tspan></text><g class="diagram-card" data-node="0"><rect x="250" y="127" width="540" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="250" y="127" width="540" height="7" fill="#24463e"/><text x="520" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="520" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="212" textLength="312.78" lengthAdjust="spacingAndGlyphs">Critical controls verified?</tspan></text><text x="520" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="258" textLength="499.82" lengthAdjust="spacingAndGlyphs">Check competence, conditions and required evidence</tspan></text></g><path d="M520 310 V341" stroke="#006f6b" stroke-width="3" fill="none"/><path d="M520 341 H189.33 V366" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="40" y="375" width="298.67" height="196" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="375" width="298.67" height="7" fill="#006f6b"/><text x="189.33" y="414" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="189.33" y="414" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="189.33" y="460" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="189.33" y="460" textLength="237.28" lengthAdjust="spacingAndGlyphs">Evidence complete</tspan></text><text x="189.33" y="506" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="189.33" y="506" textLength="208.99" lengthAdjust="spacingAndGlyphs">Authorized owner may</tspan><tspan x="189.33" y="537" textLength="190.32" lengthAdjust="spacingAndGlyphs">release within scope</tspan></text></g><path d="M520 341 H520 V366" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="370.67" y="375" width="298.67" height="196" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="370.67" y="375" width="298.67" height="7" fill="#24463e"/><text x="520" y="414" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="414" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="520" y="460" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="460" textLength="235.7" lengthAdjust="spacingAndGlyphs">Control unresolved</tspan></text><text x="520" y="506" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="506" textLength="214.89" lengthAdjust="spacingAndGlyphs">Hold affected work and</tspan><tspan x="520" y="537" textLength="219.49" lengthAdjust="spacingAndGlyphs">assign corrective action</tspan></text></g><path d="M520 341 H850.67 V366" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="701.33" y="375" width="298.67" height="196" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="701.33" y="375" width="298.67" height="7" fill="#006f6b"/><text x="850.67" y="414" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="850.67" y="414" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="850.67" y="460" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="850.67" y="460" textLength="248.23" lengthAdjust="spacingAndGlyphs">Conditions changed</tspan></text><text x="850.67" y="506" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="850.67" y="506" textLength="239.42" lengthAdjust="spacingAndGlyphs">Stop and reassess before</tspan><tspan x="850.67" y="537" textLength="95.72" lengthAdjust="spacingAndGlyphs">continuing</tspan></text></g></svg>
