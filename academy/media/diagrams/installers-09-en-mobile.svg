<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1073" viewBox="0 0 480 1073" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Can the task proceed?</title><desc id="desc">A capstone decision distinguishes structural, material and EV-scope holds.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="278.81" lengthAdjust="spacingAndGlyphs">Can the task proceed?</tspan></text><g class="diagram-card" data-node="0"><rect x="30" y="121" width="420" height="238" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="30" y="121" width="420" height="7" fill="#24463e"/><text x="240" y="160" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="160" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="206" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="206" textLength="362.2" lengthAdjust="spacingAndGlyphs">Capstone evidence complete</tspan><tspan x="240" y="246" textLength="22.46" lengthAdjust="spacingAndGlyphs">?</tspan></text><text x="240" y="293" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="293" textLength="298.52" lengthAdjust="spacingAndGlyphs">Check each affected boundary</tspan><tspan x="240" y="325" textLength="107.65" lengthAdjust="spacingAndGlyphs">separately.</tspan></text></g><path d="M27 240 H16 V938" stroke="#006f6b" stroke-width="3" fill="none"/><path d="M16 490 L48 490" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="56" y="391" width="396" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="56" y="391" width="396" height="7" fill="#006f6b"/><text x="254" y="430" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="430" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="254" y="476" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="476" textLength="252.92" lengthAdjust="spacingAndGlyphs">Missing roof support</tspan></text><text x="254" y="523" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="523" textLength="327.84" lengthAdjust="spacingAndGlyphs">Structural owner must resolve the</tspan><tspan x="254" y="555" textLength="100.28" lengthAdjust="spacingAndGlyphs">mismatch.</tspan></text></g><path d="M16 714 L48 714" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="56" y="615" width="396" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="56" y="615" width="396" height="7" fill="#24463e"/><text x="254" y="654" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="654" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="254" y="700" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="700" textLength="298.15" lengthAdjust="spacingAndGlyphs">Unapproved connectors</tspan></text><text x="254" y="747" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="747" textLength="340.03" lengthAdjust="spacingAndGlyphs">Quarantine until compliant material</tspan><tspan x="254" y="779" textLength="117.48" lengthAdjust="spacingAndGlyphs">is accepted.</tspan></text></g><path d="M16 938 L48 938" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="56" y="839" width="396" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="56" y="839" width="396" height="7" fill="#006f6b"/><text x="254" y="878" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="878" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="254" y="924" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="924" textLength="220.2" lengthAdjust="spacingAndGlyphs">EV scope change</tspan></text><text x="254" y="971" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="254" y="971" textLength="323.03" lengthAdjust="spacingAndGlyphs">Hold pending load and protection</tspan><tspan x="254" y="1003" textLength="69.72" lengthAdjust="spacingAndGlyphs">review.</tspan></text></g></svg>
