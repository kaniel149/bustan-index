<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="430" viewBox="0 0 1040 430" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">One consistent handover pack</title><desc id="desc">Signed scope, design and supplier order must agree before the receiving team accepts the handover.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="421.61" lengthAdjust="spacingAndGlyphs">One consistent handover pack</tspan></text><g class="diagram-card" data-node="0"><rect x="40" y="127" width="216" height="267" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="127" width="216" height="7" fill="#24463e"/><text x="148" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="148" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="212" textLength="170.19" lengthAdjust="spacingAndGlyphs">Signed scope</tspan></text><text x="148" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="258" textLength="106.26" lengthAdjust="spacingAndGlyphs">Equipment,</tspan><tspan x="148" y="289" textLength="106.24" lengthAdjust="spacingAndGlyphs">circuits and</tspan><tspan x="148" y="320" textLength="98.03" lengthAdjust="spacingAndGlyphs">exclusions</tspan></text></g><path d="M260 260.5 L279 260.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="288" y="127" width="216" height="267" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="288" y="127" width="216" height="7" fill="#006f6b"/><text x="396" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="396" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="212" textLength="120.15" lengthAdjust="spacingAndGlyphs">Technical</tspan><tspan x="396" y="252" textLength="82.72" lengthAdjust="spacingAndGlyphs">design</tspan></text><text x="396" y="298" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="298" textLength="171.59" lengthAdjust="spacingAndGlyphs">Matches promised</tspan><tspan x="396" y="329" textLength="117.87" lengthAdjust="spacingAndGlyphs">performance</tspan><tspan x="396" y="360" textLength="103.89" lengthAdjust="spacingAndGlyphs">boundaries</tspan></text></g><path d="M508 260.5 L527 260.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="536" y="127" width="216" height="267" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="536" y="127" width="216" height="7" fill="#24463e"/><text x="644" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="644" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="212" textLength="103" lengthAdjust="spacingAndGlyphs">Supplier</tspan><tspan x="644" y="252" textLength="65.54" lengthAdjust="spacingAndGlyphs">order</tspan></text><text x="644" y="298" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="298" textLength="172.79" lengthAdjust="spacingAndGlyphs">Matches approved</tspan><tspan x="644" y="329" textLength="108.59" lengthAdjust="spacingAndGlyphs">models and</tspan><tspan x="644" y="360" textLength="89.88" lengthAdjust="spacingAndGlyphs">quantities</tspan></text></g><path d="M756 260.5 L775 260.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="784" y="127" width="216" height="267" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="784" y="127" width="216" height="7" fill="#006f6b"/><text x="892" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="892" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="212" textLength="117.07" lengthAdjust="spacingAndGlyphs">Accepted</tspan><tspan x="892" y="252" textLength="95.19" lengthAdjust="spacingAndGlyphs">transfer</tspan></text><text x="892" y="298" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="298" textLength="155.25" lengthAdjust="spacingAndGlyphs">Receiving owner</tspan><tspan x="892" y="329" textLength="133.06" lengthAdjust="spacingAndGlyphs">acknowledges</tspan><tspan x="892" y="360" textLength="102.75" lengthAdjust="spacingAndGlyphs">open items</tspan></text></g></svg>
