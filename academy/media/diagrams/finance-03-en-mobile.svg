<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1031" viewBox="0 0 480 1031" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Reconstruct the applicable bill</title><desc id="desc">Account and period determine base charges and applicable Ft/tax treatment before the two bills are compared.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="359.33" lengthAdjust="spacingAndGlyphs">Reconstruct the applicable bill</tspan></text><g class="diagram-card" data-node="0"><rect x="28" y="121" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="121" width="424" height="7" fill="#24463e"/><text x="240" y="160" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="160" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="206" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="206" textLength="242.05" lengthAdjust="spacingAndGlyphs">Account and period</tspan></text><text x="240" y="253" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="253" textLength="353.61" lengthAdjust="spacingAndGlyphs">Verify PEA class and effective dates</tspan></text></g><path d="M240 305 L240 330" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="28" y="339" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="339" width="424" height="7" fill="#006f6b"/><text x="240" y="378" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="378" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="240" y="424" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="424" textLength="171.74" lengthAdjust="spacingAndGlyphs">Base charges</tspan></text><text x="240" y="471" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="471" textLength="300.98" lengthAdjust="spacingAndGlyphs">Apply the actual category rules</tspan></text></g><path d="M240 523 L240 548" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="28" y="557" width="424" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="557" width="424" height="7" fill="#24463e"/><text x="240" y="596" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="596" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="240" y="642" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="642" textLength="124.98" lengthAdjust="spacingAndGlyphs">Ft and tax</tspan></text><text x="240" y="689" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="689" textLength="329.03" lengthAdjust="spacingAndGlyphs">Use separately verified applicable</tspan><tspan x="240" y="721" textLength="92.93" lengthAdjust="spacingAndGlyphs">treatment</tspan></text></g><path d="M240 759 L240 784" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="28" y="793" width="424" height="198" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="793" width="424" height="7" fill="#006f6b"/><text x="240" y="832" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="832" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="240" y="878" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="878" textLength="201.47" lengthAdjust="spacingAndGlyphs">Before and after</tspan></text><text x="240" y="925" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="925" textLength="316.82" lengthAdjust="spacingAndGlyphs">Recalculate consistently for both</tspan><tspan x="240" y="957" textLength="57.46" lengthAdjust="spacingAndGlyphs">cases</tspan></text></g></svg>
