<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="607" viewBox="0 0 1040 607" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Can export income enter the case?</title><desc id="desc">Export income depends on property-specific evidence, not the existence of a general announcement.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="493.49" lengthAdjust="spacingAndGlyphs">Can export income enter the case?</tspan></text><g class="diagram-card" data-node="0"><rect x="250" y="127" width="540" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="250" y="127" width="540" height="7" fill="#24463e"/><text x="520" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="520" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="212" textLength="256.62" lengthAdjust="spacingAndGlyphs">Evidence available?</tspan></text><text x="520" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="258" textLength="422.77" lengthAdjust="spacingAndGlyphs">Check account, approval and purchase terms</tspan></text></g><path d="M520 310 V341" stroke="#006f6b" stroke-width="3" fill="none"/><path d="M520 341 H189.33 V366" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="40" y="375" width="298.67" height="196" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="375" width="298.67" height="7" fill="#006f6b"/><text x="189.33" y="414" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="189.33" y="414" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="189.33" y="460" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="189.33" y="460" textLength="248.23" lengthAdjust="spacingAndGlyphs">Announcement only</tspan></text><text x="189.33" y="506" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="189.33" y="506" textLength="211.39" lengthAdjust="spacingAndGlyphs">Does not establish this</tspan><tspan x="189.33" y="537" textLength="189.55" lengthAdjust="spacingAndGlyphs">property’s eligibility</tspan></text></g><path d="M520 341 H520 V366" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="370.67" y="375" width="298.67" height="196" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="370.67" y="375" width="298.67" height="7" fill="#24463e"/><text x="520" y="414" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="414" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="520" y="460" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="460" textLength="237.28" lengthAdjust="spacingAndGlyphs">Verified agreement</tspan></text><text x="520" y="506" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="506" textLength="226.55" lengthAdjust="spacingAndGlyphs">Use its actual applicable</tspan><tspan x="520" y="537" textLength="52.5" lengthAdjust="spacingAndGlyphs">terms</tspan></text></g><path d="M520 341 H850.67 V366" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="701.33" y="375" width="298.67" height="196" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="701.33" y="375" width="298.67" height="7" fill="#006f6b"/><text x="850.67" y="414" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="850.67" y="414" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="850.67" y="460" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="850.67" y="460" textLength="240.36" lengthAdjust="spacingAndGlyphs">Unresolved income</tspan></text><text x="850.67" y="506" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="850.67" y="506" textLength="230.1" lengthAdjust="spacingAndGlyphs">Exclude from base case;</tspan><tspan x="850.67" y="537" textLength="148.26" lengthAdjust="spacingAndGlyphs">track separately</tspan></text></g></svg>
