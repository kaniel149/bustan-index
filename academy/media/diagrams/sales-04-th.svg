<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">แยกผลลัพธ์ที่ลูกค้าต้องการ</title><desc id="desc">ลดค่าไฟกับสำรองไฟแผนกต้อนรับเป็นคนละผลลัพธ์ โดยไม่รวมการสำรองทั้งรีสอร์ต</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="361.3" lengthAdjust="spacingAndGlyphs">แยกผลลัพธ์ที่ลูกค้าต้องการ</tspan></text><g class="diagram-card" data-node="0"><rect x="40" y="131" width="298.67" height="253" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="131" width="298.67" height="7" fill="#24463e"/><text x="189.33" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="189.33" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="189.33" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="189.33" y="219" textLength="92.1" lengthAdjust="spacingAndGlyphs">ลดค่าไฟ</tspan></text><text x="189.33" y="269" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="189.33" y="269" textLength="237.93" lengthAdjust="spacingAndGlyphs">จำลองการใช้ไฟที่ตรงเวลา</tspan><tspan x="189.33" y="303" textLength="123.9" lengthAdjust="spacingAndGlyphs">และอัตราค่าไฟ</tspan></text></g><g class="diagram-card" data-node="1"><rect x="370.67" y="131" width="298.67" height="253" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="370.67" y="131" width="298.67" height="7" fill="#006f6b"/><text x="520" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="520" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="219" textLength="183.36" lengthAdjust="spacingAndGlyphs">สำรองไฟแผนก</tspan><tspan x="520" y="263" textLength="89.86" lengthAdjust="spacingAndGlyphs">ต้อนรับ</tspan></text><text x="520" y="313" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="313" textLength="201.6" lengthAdjust="spacingAndGlyphs">วงจรที่ระบุและเงื่อนไข</tspan><tspan x="520" y="347" textLength="59.85" lengthAdjust="spacingAndGlyphs">ชัดเจน</tspan></text></g><g class="diagram-card" data-node="2"><rect x="701.33" y="131" width="298.67" height="253" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="701.33" y="131" width="298.67" height="7" fill="#24463e"/><text x="850.67" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="850.67" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="850.67" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="850.67" y="219" textLength="125.8" lengthAdjust="spacingAndGlyphs">ทั้งรีสอร์ต</tspan></text><text x="850.67" y="269" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="850.67" y="269" textLength="225.96" lengthAdjust="spacingAndGlyphs">ไม่รวมในขอบเขตที่เสนอนี้</tspan></text></g></svg>
