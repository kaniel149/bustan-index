<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1065" viewBox="0 0 480 1065" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">สร้างประมาณการต้นทุนจบงาน</title><desc id="desc">ประมาณการบวกต้นทุนเกิดแล้ว 120,000 บาท ต้นทุนผูกพันคงเหลือ 70,000 บาท และงานยังไม่ผูกพัน 30,000 บาท ได้ 220,000 บาท</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="352.33" lengthAdjust="spacingAndGlyphs">สร้างประมาณการต้นทุนจบงาน</tspan></text><g class="diagram-card" data-node="0"><rect x="28" y="125" width="424" height="213" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="125" width="424" height="7" fill="#24463e"/><text x="240" y="164" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="164" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="240" y="213" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="213" textLength="125.8" lengthAdjust="spacingAndGlyphs">ต้นทุนจริง</tspan></text><text x="240" y="264" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="264" textLength="323.31" lengthAdjust="spacingAndGlyphs">ต้นทุนเกิดแล้ว 120,000 บาท ภายใน</tspan><tspan x="240" y="300" textLength="184.8" lengthAdjust="spacingAndGlyphs">ขอบเขตตัวอย่างฝึก</tspan></text></g><path d="M240 342 L240 367" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="28" y="376" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="376" width="424" height="7" fill="#006f6b"/><text x="240" y="415" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="415" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="240" y="464" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="464" textLength="229.98" lengthAdjust="spacingAndGlyphs">ภาระผูกพันคงเหลือ</tspan></text><text x="240" y="515" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="515" textLength="333.3" lengthAdjust="spacingAndGlyphs">ต้นทุนผูกพัน 70,000 บาท ที่ยังไม่เกิด</tspan></text></g><path d="M240 560 L240 585" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="28" y="594" width="424" height="180" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="594" width="424" height="7" fill="#24463e"/><text x="240" y="633" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="633" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="240" y="682" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="682" textLength="181.96" lengthAdjust="spacingAndGlyphs">งานยังไม่ผูกพัน</tspan></text><text x="240" y="733" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="733" textLength="336.6" lengthAdjust="spacingAndGlyphs">ยังต้องใช้เพื่อจบงานอีก 30,000 บาท</tspan></text></g><path d="M240 778 L240 803" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="28" y="812" width="424" height="213" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="28" y="812" width="424" height="7" fill="#006f6b"/><text x="240" y="851" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="851" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="240" y="900" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="900" textLength="221.83" lengthAdjust="spacingAndGlyphs">ยอดคาดการณ์รวม</tspan></text><text x="240" y="951" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="22" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="951" textLength="359.61" lengthAdjust="spacingAndGlyphs">220,000 บาท เทียบรายได้และรายการที่</tspan><tspan x="240" y="987" textLength="62.7" lengthAdjust="spacingAndGlyphs">ไม่รวม</tspan></text></g></svg>
