just="spacingAndGlyphs">שיטה וקריטריון</tspan><tspan x="892" y="360" textLength="60.48" lengthAdjust="spacingAndGlyphs">קבלה.</tspan></text></g><path d="M780 260.5 L761 260.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="536" y="127" width="216" height="267" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="536" y="127" width="216" height="7" fill="#006f6b"/><text x="644" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="644" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="644" y="212" textLength="174.1" lengthAdjust="spacingAndGlyphs">מכשיר מתאים</tspan></text><text x="644" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"><tspan x="644" y="258" textLength="164.85" lengthAdjust="spacingAndGlyphs">מאמתים דירוגים,</tspan><tspan x="644" y="289" textLength="110.25" lengthAdjust="spacingAndGlyphs">מצב וזיהוי.</tspan></text></g><path d="M532 260.5 L513 260.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="288" y="127" width="216" height="267" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="288" y="127" width="216" height="7" fill="#24463e"/><text x="396" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="396" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif