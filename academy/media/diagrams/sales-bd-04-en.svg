<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="492" viewBox="0 0 1040 492" lang="en" xml:lang="en" role="img" aria-labelledby="title desc"><title id="title">Build the economic explanation</title><desc id="desc">Energy quantities feed verified billing, then actual cash obligations and a conditional customer outcome.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="432" lengthAdjust="spacingAndGlyphs">Build the economic explanation</tspan></text><g class="diagram-card" data-node="0"><rect x="40" y="127" width="216" height="329" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="127" width="216" height="7" fill="#24463e"/><text x="148" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="148" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="212" textLength="174.85" lengthAdjust="spacingAndGlyphs">Energy ledger</tspan></text><text x="148" y="258" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="148" y="258" textLength="142.44" lengthAdjust="spacingAndGlyphs">Separate direct</tspan><tspan x="148" y="289" textLength="155.36" lengthAdjust="spacingAndGlyphs">use, imports and</tspan><tspan x="148" y="320" textLength="67.68" lengthAdjust="spacingAndGlyphs">surplus</tspan></text></g><path d="M260 291.5 L279 291.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="1"><rect x="288" y="127" width="216" height="329" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="288" y="127" width="216" height="7" fill="#006f6b"/><text x="396" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">02</tspan></text><text x="396" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="212" textLength="74.89" lengthAdjust="spacingAndGlyphs">Billing</tspan><tspan x="396" y="252" textLength="118.61" lengthAdjust="spacingAndGlyphs">treatment</tspan></text><text x="396" y="298" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="396" y="298" textLength="172.81" lengthAdjust="spacingAndGlyphs">Apply verified tariff</tspan><tspan x="396" y="329" textLength="157.65" lengthAdjust="spacingAndGlyphs">and export terms</tspan></text></g><path d="M508 291.5 L527 291.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="2"><rect x="536" y="127" width="216" height="329" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="536" y="127" width="216" height="7" fill="#24463e"/><text x="644" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">03</tspan></text><text x="644" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="212" textLength="65.54" lengthAdjust="spacingAndGlyphs">Cash</tspan><tspan x="644" y="252" textLength="134.22" lengthAdjust="spacingAndGlyphs">obligations</tspan></text><text x="644" y="298" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="644" y="298" textLength="129.61" lengthAdjust="spacingAndGlyphs">Include actual</tspan><tspan x="644" y="329" textLength="170.5" lengthAdjust="spacingAndGlyphs">costs and contract</tspan><tspan x="644" y="360" textLength="91.04" lengthAdjust="spacingAndGlyphs">payments</tspan></text></g><path d="M756 291.5 L775 291.5" stroke="#006f6b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="diagram-card" data-node="3"><rect x="784" y="127" width="216" height="329" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="784" y="127" width="216" height="7" fill="#006f6b"/><text x="892" y="166" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="166" textLength="21.97" lengthAdjust="spacingAndGlyphs">04</tspan></text><text x="892" y="212" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="212" textLength="121.7" lengthAdjust="spacingAndGlyphs">Customer</tspan><tspan x="892" y="252" textLength="107.69" lengthAdjust="spacingAndGlyphs">outcome</tspan></text><text x="892" y="298" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="892" y="298" textLength="68.86" lengthAdjust="spacingAndGlyphs">Explain</tspan><tspan x="892" y="329" textLength="123.75" lengthAdjust="spacingAndGlyphs">assumptions,</tspan><tspan x="892" y="360" textLength="94.61" lengthAdjust="spacingAndGlyphs">range and</tspan><tspan x="892" y="391" textLength="92.19" lengthAdjust="spacingAndGlyphs">remaining</tspan><tspan x="892" y="422" textLength="84.04" lengthAdjust="spacingAndGlyphs">evidence</tspan></text></g></svg>
