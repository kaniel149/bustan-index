<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="376" viewBox="0 0 1040 376" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">สามคำถามแบตต่างกัน</title><desc id="desc">สามช่องแยกความจุพลังงาน ขีดกำลังพร้อมกัน และเข้ากันควบคุม.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H1016" stroke="#f2b84b" stroke-width="5"/><text x="520" y="83" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="30" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="520" y="83" textLength="294.84" lengthAdjust="spacingAndGlyphs">สามคำถามแบตต่างกัน</tspan></text><g class="diagram-card" data-node="0"><rect x="40" y="131" width="298.67" height="209" rx="5" fill="#fff4e2" stroke="#b9c6b6" stroke-width="1.5"/><rect x="40" y="131" width="298.67" height="7" fill="#24463e"/><text x="189.33" y="170" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="19" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="189.33" y="170" textLength="21.97" lengthAdjust="spacingAndGlyphs">01</tspan></text><text x="189.33" y="219" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="27" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="189.33" y="219" textLength="165.95" lengthAdjust="spacingAndGlyphs">พลังงาน kWh</tspan></text><text x="189.33" y="269" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="189.33" y="269" textLength="193.2" lengthAdjust="spacingAndGlyphs">มีพลังงานเท่าไรภายใต้</tspan><tspan x="189.33" y="303" textLength="106.47" lengthAdjust="spacingAndGlyphs">สมมติฐาน?</tspan></text></g><g cla