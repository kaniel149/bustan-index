<svg xmlns="http://www.w3.org/2000/svg" width="480" height="745" viewBox="0 0 480 745" lang="th" xml:lang="th" role="img" aria-labelledby="title desc"><title id="title">ตรวจคัดกรองแรงดันในอากาศเย็น</title><desc id="desc">แท่งแรงดันสำหรับฝึกเปรียบเทียบสิบเอ็ดแผงที่ 573.1 โวลต์ ขีดจำกัดสมมติ 600 โวลต์ และสิบสองแผงที่ 625.2 โวลต์</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006f6b"/></marker></defs><rect width="100%" height="100%" rx="8" fill="#f4ead8"/><path d="M24 32 H456" stroke="#f2b84b" stroke-width="5"/><text x="240" y="79" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="26" font-weight="700" text-anchor="middle" direction="ltr" unicode-bidi="plaintext"><tspan x="240" y="79" textLength="398.03" lengthAdjust="spacingAndGlyphs">ตรวจคัดกรองแรงดันในอากาศเย็น</tspan></text><g class="diagram-bar" data-node="0"><text x="28" y="150" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="150" textLength="81.95" lengthAdjust="spacingAndGlyphs">11 แผง</tspan></text><text x="28" y="191" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="191" textLength="234.29" lengthAdjust="spacingAndGlyphs">573.1 โวลต์ · ตัวอย่างฝึก</tspan></text><rect x="28" y="215" width="424" height="28" rx="3" fill="#dedfce"/><rect x="28" y="215" width="388.67" height="28" rx="3" fill="#24463e"/><text x="28" y="274" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="274" textLength="334.74" lengthAdjust="spacingAndGlyphs">11 × 52.1 โวลต์ ยังต้องตรวจด้านอื่น</tspan></text></g><g class="diagram-bar" data-node="1"><text x="28" y="342" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="342" textLength="194.22" lengthAdjust="spacingAndGlyphs">ขีดจำกัดตัวอย่าง</tspan></text><text x="28" y="383" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="383" textLength="216.9" lengthAdjust="spacingAndGlyphs">600 โวลต์ · ตัวอย่างฝึก</tspan></text><rect x="28" y="407" width="424" height="28" rx="3" fill="#dedfce"/><rect x="28" y="407" width="406.91" height="28" rx="3" fill="#006f6b"/><text x="28" y="466" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="466" textLength="357.42" lengthAdjust="spacingAndGlyphs">ค่าสูงสุดของอินเวอร์เตอร์สมมติ ไม่ใช่ค่า</tspan><tspan x="28" y="500" textLength="131.67" lengthAdjust="spacingAndGlyphs">มาตรฐานทั่วไป</tspan></text></g><g class="diagram-bar" data-node="2"><text x="28" y="568" fill="#24463e" font-family="Arial,Tahoma,sans-serif" font-size="25" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="568" textLength="81.95" lengthAdjust="spacingAndGlyphs">12 แผง</tspan></text><text x="28" y="609" fill="#006f6b" font-family="Arial,Tahoma,sans-serif" font-size="20" font-weight="700" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="609" textLength="234.29" lengthAdjust="spacingAndGlyphs">625.2 โวลต์ · ตัวอย่างฝึก</tspan></text><rect x="28" y="633" width="424" height="28" rx="3" fill="#dedfce"/><rect x="28" y="633" width="424" height="28" rx="3" fill="#24463e"/><text x="28" y="692" fill="#4a5d52" font-family="Arial,Tahoma,sans-serif" font-size="21" font-weight="400" text-anchor="start" direction="ltr" unicode-bidi="plaintext"><tspan x="28" y="692" textLength="340.83" lengthAdjus